name: USE v487.57 syntax validation

on:
  push:
    branches:
      - v487.57-asgi-fix

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile main.py
