name: USE v339 full validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile production modules
        run: python -m py_compile main.py use_core.py run_v338_validation.py run_v387_authority_validation.py
      - name: v387 compatibility validation
        run: python run_v338_validation.py
      - name: v387 core regression tests
        run: python -m pytest -q tests/test_v387_secondary_pathway_relevance.py
      - name: Executable v387 authority validation
        run: python run_v387_authority_validation.py
      - name: Reject unclosed build identity marker
        run: python - <<'PY'
import pathlib
source = pathlib.Path('main.py').read_text(encoding='utf-8')
assert 'CANONICAL_BUILD_PAYLOAD_SHA256 = "PLACEHOLDER_RECOMPUTE_REQUIRED"' not in source
assert 'CANONICAL_BUILD_PAYLOAD_SHA256 = "__PAYLOAD_SHA256__"' not in source
assert 'RUNTIME_SOURCE_SHA256' in source
assert '_core_runtime_sha' in source
print('USE v387 executable identity guard: PASS')
PY
