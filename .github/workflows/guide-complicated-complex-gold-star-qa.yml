name: Guide Complicated vs Complex Gold Star QA

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "complicated_complex_distinction_contract.py"
      - "docs/qa/gold_standard_registry.json"
      - "tests/test_complicated_complex_distinction_contract.py"
      - ".github/workflows/guide-complicated-complex-gold-star-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complicated-complex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed runtime units
        run: python -m py_compile main.py complicated_complex_distinction_contract.py
      - name: Validate canonical Gold Star registry
        run: python scripts/validate_gold_star_registry.py
      - name: Run focused contract tests
        run: PYTHONPATH=. python -m pytest -q tests/test_complicated_complex_distinction_contract.py
