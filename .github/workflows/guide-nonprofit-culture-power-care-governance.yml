name: Guide Nonprofit Culture Power Care Governance Contract

on:
  pull_request:
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "nonprofit_mission_care_contract.py"
      - "tests/fixtures/general-guide-nonprofit-mission-care-trust-centered-gold-star-2026-11-28.json"
      - "tests/fixtures/general-guide-nonprofit-mission-care-trust-centered-nearmiss-2026-11-28.json"
      - "tests/test_nonprofit_mission_care_doorway_contract.py"
      - "tests/test_nonprofit_culture_power_care_governance.py"
      - ".github/workflows/guide-nonprofit-culture-power-care-governance.yml"
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "tests/test_nonprofit_culture_power_care_governance.py"
      - ".github/workflows/guide-nonprofit-culture-power-care-governance.yml"

permissions:
  contents: read

jobs:
  nonprofit-organizational-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile changed Guide modules
        run: python -m py_compile main.py general_guide_composition.py
      - name: Run nonprofit culture, power, care, and governance regressions
        run: timeout --signal=TERM --kill-after=30s 8m python -m pytest -q tests/test_nonprofit_culture_power_care_governance.py tests/test_nonprofit_mission_care_doorway_contract.py
