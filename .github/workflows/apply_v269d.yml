name: Apply USE v269d canonical chunk identity patch
on:
  push:
    paths:
      - '.github/workflows/apply_v269d.yml'
permissions:
  contents: write
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v269d
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('main.py'); s=p.read_text(encoding='utf-8')
          assert 'APP_VERSION = "v268"' in s
          s=s.replace('APP_VERSION = "v268"','APP_VERSION = "v269"',1)
          s=s.replace('DEPLOYMENT_FINGERPRINT = "USE-v268-canonical-publication-identity"','DEPLOYMENT_FINGERPRINT = "USE-v269-canonical-chunk-publication-identity"',1)
          s=s.replace('CANONICAL_BUILD_ID = "USE-BUILD-v268-canonical-publication-identity"','CANONICAL_BUILD_ID = "USE-BUILD-v269-canonical-chunk-publication-identity"',1)
          fn=s.index('def _d20_content_self_identification'); a=s.index('    content_patterns = (',fn); b=s.index('    )\n    for pattern, resource_type',a)+6
          bs=chr(92)
          block='    content_patterns = (\n'+f'        (r"{bs}bcornerstone{bs}s+essay(?:{bs}s+series)?{bs}b", "Essay"),\n'+f'        (r"{bs}bfoundational{bs}s+essay(?:s)?{bs}b", "Essay"),\n'+f'        (r"{bs}b(?:this|the) living archive navigator{bs}b", "Navigator"),\n'+f'        (r"{bs}b(?:this|the) reference map{bs}b", "Reference Map"),\n'+f'        (r"{bs}b(?:this|the) guided reading pathway{bs}b", "Pathway"),\n'+f'        (r"{bs}b(?:this|the) knowledge hub{bs}b", "Knowledge Hub"),\n'+f'        (r"{bs}b(?:this|the) cornerstone(?: hub)?{bs}b", "Cornerstone"),\n'+f'        (r"{bs}b(?:this|the) learning arc{bs}b", "Learning Arc"),\n'+f'        (r"{bs}b(?:this|the) case study{bs}b", "Case"),\n'+f'        (r"{bs}b(?:this|the) essay{bs}b", "Essay"),\n    )\n'
          s=s[:a]+block+s[b:]
          marker='def _v268_canonical_publication_identity_self_audit() -> None:\n'
          helper='''def _v269_resolve_canonical_type_across_chunks(metadata, vector, required_type):\n    if not required_type or not isinstance(metadata, dict) or not index:\n        return None\n    url=str(metadata.get("url","") or "").strip().rstrip("/")\n    if not url or not vector:\n        return None\n    try:\n        result=index.query(vector=vector, top_k=32, include_metadata=True, filter={"url":{"$eq":url}})\n        matches=result.get("matches",[]) if hasattr(result,"get") else getattr(result,"matches",[])\n    except Exception as exc:\n        print(f"USE v269 canonical chunk identity lookup error: {exc}")\n        return None\n    for match in matches or []:\n        sibling=_match_metadata(match)\n        if not isinstance(sibling,dict):\n            continue\n        rec=_recognize_resource_type(sibling)\n        if rec.get("resource_type") == required_type:\n            merged=dict(metadata)\n            merged["_use_resource_type_recognition"]=dict(rec)\n            merged["_use_canonical_chunk_identity"]={"source":"v269_exact_canonical_url_sibling_chunk","url":url,"evidence_chunk_index":sibling.get("chunk_index")}\n            print(f"USE v269 canonical chunk publication identity: resolved type={required_type!r}, title={metadata.get('title')!r}, url={url!r}, evidence_chunk_index={sibling.get('chunk_index')!r}.")\n            return merged\n    return None\n\n\n'''
          assert marker in s; s=s.replace(marker,helper+marker,1)
          gate_start=s.index('                if required_type:',s.index('def _function_targeted_candidate_search'))
          gate_end=s.index('                print(',gate_start)
          gate='''                if required_type:\n                    recognized = _recognize_resource_type(metadata)\n                    if recognized.get("resource_type") != required_type:\n                        resolved = _v269_resolve_canonical_type_across_chunks(metadata, vector, required_type)\n                        if resolved is None:\n                            rejected_for_type += 1\n                            continue\n                        metadata = resolved\n                        recognized = metadata.get("_use_resource_type_recognition") or {}\n                    else:\n                        metadata = dict(metadata)\n                        metadata["_use_resource_type_recognition"] = dict(recognized)\n                    metadata = dict(metadata)\n                    metadata["_use_explicit_type_selection_identity"] = {"requested_type":required_type,"source":"D20_type_constrained_function_retrieval"}\n\n'''
          s=s[:gate_start]+gate+s[gate_end:]
          audit='''def _v269_canonical_chunk_publication_identity_self_audit():\n    essay={"title":"T","url":"https://example.invalid/chunked","text":"This essay forms part of the Cornerstone Essay Series."}\n    assert _recognize_resource_type(essay).get("resource_type") == "Essay"\n    chunks=[{"title":"T","url":"https://example.invalid/chunked","chunk_index":1,"text":"Topic only."},{"title":"T","url":"https://example.invalid/chunked","chunk_index":7,"text":"This essay forms part of the Cornerstone Essay Series."}]\n    class F:\n        def query(self,**kwargs): return {"matches":[{"metadata":x} for x in chunks]}\n    old=globals().get("index")\n    try:\n        globals()["index"]=F(); r=_v269_resolve_canonical_type_across_chunks(chunks[0],[0.0],"Essay"); assert r is not None; assert r["_use_canonical_chunk_identity"]["evidence_chunk_index"]==7\n    finally:\n        globals()["index"]=old\n    print("USE v269 CANONICAL CHUNK PUBLICATION IDENTITY AUDIT: PASS")\n\n\n'''
          s=s.replace(marker,audit+marker,1)
          pat=re.compile(r'(?ms)^# === CANONICAL BUILD IDENTITY \(excluded from payload hash\) ===\n.*?^# === END CANONICAL BUILD IDENTITY ===\n?')
          norm,n=pat.subn('# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n',s,count=1); assert n==1
          payload=hashlib.sha256(norm.encode()).hexdigest(); s=re.sub(r'CANONICAL_BUILD_PAYLOAD_SHA256 = "[0-9a-f]+"',f'CANONICAL_BUILD_PAYLOAD_SHA256 = "{payload}"',s,count=1)
          p.write_text(s,encoding='utf-8'); print('payload',payload); print('raw',hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py
          git diff --cached --check
          git rm .github/workflows/apply_v269d.yml .github/workflows/apply_v269c.yml .github/workflows/apply_v269b.yml .github/workflows/apply_v269.yml
          git commit -m 'USE v269 canonical chunk publication identity'
          git push
