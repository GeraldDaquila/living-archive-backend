name: Guide stewardship values-conflict regression

on:
  pull_request:
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "tests/test_guide_stewardship_values_conflict.py"
      - ".github/workflows/guide-stewardship-values-conflict.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "tests/test_guide_stewardship_values_conflict.py"
      - ".github/workflows/guide-stewardship-values-conflict.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Compile changed modules and test
        run: python -m py_compile main.py general_guide_composition.py tests/test_guide_stewardship_values_conflict.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_guide_stewardship_values_conflict.py
