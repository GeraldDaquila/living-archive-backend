name: CLSS Standalone Contract Tests

on:
  pull_request:
    paths:
      - "clss/**"
      - "tests/test_clss*.py"
      - "docs/clss/**"
      - ".github/workflows/clss-standalone-tests.yml"
  push:
    branches:
      - "clss/standalone-build-contract"
    paths:
      - "clss/**"
      - "tests/test_clss*.py"
      - "docs/clss/**"
      - ".github/workflows/clss-standalone-tests.yml"

permissions:
  contents: read

jobs:
  clss-contract-tests:
    name: CLSS contract and fixture integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CLSS structural tests
        run: python -m unittest discover -s tests -p "test_clss*.py" -v
