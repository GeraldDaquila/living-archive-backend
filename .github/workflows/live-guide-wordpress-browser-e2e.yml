name: Live Guide WordPress Browser E2E

on:
  push:
    branches: [qa/live-guide-wordpress-browser-e2e]
    paths:
      - "QA/live_guide_wordpress_browser_e2e.mjs"
      - ".github/workflows/live-guide-wordpress-browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-guide-wordpress-browser-e2e
  cancel-in-progress: false

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test both live WordPress Guide entryways
        run: node QA/live_guide_wordpress_browser_e2e.mjs
