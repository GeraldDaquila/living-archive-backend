name: Claim adjudication contract

on:
  pull_request:
    paths:
      - "claim_adjudication.py"
      - "tests/test_claim_adjudication.py"
      - ".github/workflows/claim-adjudication.yml"

permissions:
  contents: read

jobs:
  claim-adjudication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile adjudication module and tests
        run: python -m py_compile claim_adjudication.py tests/test_claim_adjudication.py
      - name: Run claim adjudication contract tests
        run: PYTHONPATH=. python -m pytest -q tests/test_claim_adjudication.py
