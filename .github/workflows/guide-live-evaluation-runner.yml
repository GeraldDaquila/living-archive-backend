name: Guide Live Evaluation Runner Contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/guide-live-evaluation.yml"
      - ".github/workflows/guide-live-evaluation-runner.yml"
      - "scripts/guide_live_evaluation.py"
      - "gold_star_semantic_contract.py"
      - "institutional_learning_failure_contract.py"
      - "tests/test_guide_live_evaluation_runner.py"

permissions:
  contents: read

jobs:
  live-evaluation-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile live evaluation script
        run: python -m py_compile scripts/guide_live_evaluation.py
      - name: Verify runner import path and evaluation contracts
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_guide_live_evaluation_runner.py
