name: CLSS hybrid synthesis isolation

on:
  push:
    branches:
      - "clss/hybrid-synthesis-isolated"
    paths:
      - "clss_hybrid_synthesis.py"
      - "clss_evidence_triage.py"
      - "clss_response_validator.py"
      - "clss_deterministic_response.py"
      - "scripts/clss_synthetic_provider_eval.py"
      - ".github/workflows/clss-synthetic-provider-evaluation.yml"
      - "tests/test_clss_hybrid_synthesis.py"
      - "tests/test_clss_hybrid_semantic_gate.py"
      - "tests/fixtures/clss/semantic-response-candidates.json"
      - "tests/fixtures/clss/semantic-review-records-template.json"
      - "tests/fixtures/clss/stewardship-coherence-cases.json"
      - "docs/CLSS_HYBRID_SEMANTIC_GATE.md"
      - "clss_evidence_normalization.py"
      - "tests/clss_deterministic_response.py"
      - "tests/clss_evidence_triage.py"
      - "tests/clss_response_validator.py"
      - ".github/workflows/clss-hybrid-synthesis-isolated.yml"
  pull_request:
    paths:
      - "clss_hybrid_synthesis.py"
      - "clss_evidence_triage.py"
      - "clss_response_validator.py"
      - "clss_deterministic_response.py"
      - "scripts/clss_synthetic_provider_eval.py"
      - ".github/workflows/clss-synthetic-provider-evaluation.yml"
      - "tests/test_clss_hybrid_synthesis.py"
      - "tests/test_clss_hybrid_semantic_gate.py"
      - "tests/fixtures/clss/semantic-response-candidates.json"
      - "tests/fixtures/clss/semantic-review-records-template.json"
      - "tests/fixtures/clss/stewardship-coherence-cases.json"
      - "docs/CLSS_HYBRID_SEMANTIC_GATE.md"
      - "clss_evidence_normalization.py"
      - "tests/clss_deterministic_response.py"
      - "tests/clss_evidence_triage.py"
      - "tests/clss_response_validator.py"
      - ".github/workflows/clss-hybrid-synthesis-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile adapter and tests
        run: python -m py_compile clss_hybrid_synthesis.py clss_evidence_triage.py clss_response_validator.py clss_deterministic_response.py scripts/clss_synthetic_provider_eval.py tests/test_clss_hybrid_synthesis.py tests/test_clss_hybrid_semantic_gate.py
      - name: Run isolated adapter tests
        run: python -m unittest -v tests.test_clss_hybrid_synthesis
      - name: Run five-profile semantic and adversarial gate tests
        run: python -m unittest -v tests.test_clss_hybrid_semantic_gate tests.test_clss_semantic_candidate_evaluation
      - name: Run existing CLSS contract regressions
        run: python -m unittest -v tests.test_clss_response_validator tests.test_clss_evidence_triage tests.test_clss_deterministic_response tests.test_clss_reasoning_boundary tests.test_clss_evidence_normalization tests.test_clss_contextual_review tests.test_clss_questionnaire_review_bridge tests.test_clss_semantic_review_template tests.test_clss_semantic_candidate_evaluation tests.test_clss_stewardship_fixtures
