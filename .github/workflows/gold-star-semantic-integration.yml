name: Gold Star Real-Model Semantic Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "gold_star_lessons.py"
      - "gold_star_semantic_retrieval.py"
      - "tests/test_gold_star_semantic_integration.py"
      - "requirements.txt"
      - ".github/workflows/gold-star-semantic-integration.yml"

permissions:
  contents: read

jobs:
  real-model-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install semantic runtime and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Verify canonical BGE model retrieval with real embeddings
        run: python -m pytest -q tests/test_gold_star_semantic_integration.py
