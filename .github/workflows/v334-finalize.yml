name: USE v334 finalize

on:
  push:
    branches:
      - use-v334-release

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'USE PRODUCTION VERSION: v334 - finalize release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: use-v334-release

      - name: Apply v334 source patch
        run: python tools/apply_v334_release.py

      - name: Run release gate
        shell: python
        run: |
          import ast
          import hashlib
          import re
          import tempfile
          from pathlib import Path
          import py_compile

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          assert s.splitlines()[0] == '# USE PRODUCTION VERSION: v334 — Compassionate Recommendation Boundary + The Guide'
          assert hashlib.sha256(s.encode('utf-8')).hexdigest() == 'b7497393a1c67674f050939ca608bf44650ad64126055145a0f84181eca441b6'
          assert 'APP_VERSION = "v334"' in s
          assert 'DEPLOYMENT_FINGERPRINT = "USE-v334-compassionate-recommendation-boundary"' in s
          assert 'CANONICAL_BUILD_ID = "USE-BUILD-v334-compassionate-recommendation-boundary"' in s
          assert 'APP_VERSION = "v333"' not in s

          identity_re = re.compile(r'(?ms)^# === CANONICAL BUILD IDENTITY \(excluded from payload hash\) ===\n.*?^# === END CANONICAL BUILD IDENTITY ===\n?')
          placeholder = '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n'
          canonical = hashlib.sha256(identity_re.sub(placeholder, s, count=1).encode('utf-8')).hexdigest()
          assert canonical == '90590d2b18fad50f3dd4a03c28060d0f51473b1fb860fcb139c8bc86e1857301'

          ast.parse(s)
          with tempfile.TemporaryDirectory() as td:
              py_compile.compile(str(p), cfile=str(Path(td) / 'main.pyc'), doraise=True)

          tree = ast.parse(s)
          wanted = None
          for node in tree.body:
              if isinstance(node, ast.FunctionDef) and node.name == '_v308_compassionate_voice_violation':
                  wanted = node
                  break
          assert wanted is not None
          mini = ast.Module(body=[ast.Import(names=[ast.alias(name='re')]), wanted], type_ignores=[])
          ns = {}
          exec(compile(mini, '<release-gate>', 'exec'), ns)
          check = ns['_v308_compassionate_voice_violation']

          bad = [
              ('What essay would you recommend while I am grieving the death of my partner?', 'You should find meaning in your grief and use this loss to become stronger.'),
              ('I am grieving the death of a loved one. Where should I begin?', 'Your grief is a transformative lesson that will heal you.'),
              ('What essay would you recommend for someone grieving the death of a loved one?', 'The material offers comfort by suggesting continuity and connection beyond death.'),
              ('What essay would you recommend for someone grieving the death of a loved one?', 'The material provides comfort for those grieving the death of a loved one.'),
              ('What essay would you recommend for someone grieving the death of a loved one?', 'The material brings peace to someone grieving.'),
              ('What essay would you recommend for someone grieving the death of a loved one?', 'The material gives meaning to those grieving.'),
              ('What essay would you recommend for someone grieving the death of a loved one?', 'The material offers healing to the reader.'),
              ('What essay would you recommend for someone grieving the death of a loved one?', 'The material helps those grieving find closure.'),
          ]
          good = [
              ('What essay would you recommend while I am grieving the death of my partner?', 'This piece explores grief through spiritual and psychological perspectives. It may be a gentle place to begin.'),
              ('Tell me about grief in the Living Archive.', 'This essay approaches grief as a question of meaning and continuity, while leaving the reader to decide what is useful.'),
              ('Where is the essay about conflict?', 'You should compare the two essays before deciding.'),
              ('What essay would you recommend for someone grieving the death of a loved one?', 'The essay explores beliefs about continuity and connection beyond death. Its spiritual framing includes themes of hope and peace.'),
          ]
          for q, a in bad:
              assert check(q, a)
          for q, a in good:
              assert not check(q, a)

          assert 'Do not turn a source\'s claims about comfort, healing, hope, meaning, purpose, peace, closure, or benefit into an asserted outcome for the visitor' in s
          print('USE v334 release gate: PASS')

      - name: Finalize branch
        shell: bash
        run: |
          rm -f tools/apply_v334_release.py .github/workflows/v334-finalize.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py tools/apply_v334_release.py .github/workflows/v334-finalize.yml
          git commit -m 'USE PRODUCTION VERSION: v334 - finalize release'
          git push origin HEAD:use-v334-release
