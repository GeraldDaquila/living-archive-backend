name: Promote USE v300
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-v300.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact v300 source transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          p = Path('main.py')
          b = p.read_bytes()
          if b.count(b'v299') == 0 or b.count(b'USE-v299-authority-doorway-diagnostic') == 0:
              raise SystemExit('Expected v299 source not found; refusing promotion')
          old = b.decode('utf-8').replace('\r\n','\n').replace('\r','\n')
          old_marker = '    scored = []\n    for index, document in enumerate(candidates):'
          new_marker = '    requested_types = _explicit_resource_type_targets(question)\n    scored = []\n    for index, document in enumerate(candidates):'
          if old.count(old_marker) != 1:
              raise SystemExit('Unexpected recommendation adjudication marker count')
          s = old.replace(old_marker, new_marker, 1)
          inner_old = '        requested_types = _explicit_resource_type_targets(question)\n        recognized_type = _recognize_resource_type(document).get("resource_type")'
          inner_new = '        recognized_type = _recognize_resource_type(document).get("resource_type")'
          if s.count(inner_old) != 1:
              raise SystemExit('Expected inner requested_types assignment not found exactly once')
          s = s.replace(inner_old, inner_new, 1)
          s = s.replace('# USE PRODUCTION VERSION: v299 — Authority Doorway Diagnostic + The Guide', '# USE PRODUCTION VERSION: v300 — Recommendation Type Cache + The Guide', 1)
          s = s.replace('APP_VERSION = "v299"', 'APP_VERSION = "v300"', 1)
          s = s.replace('USE-BUILD-v299-authority-doorway-diagnostic', 'USE-BUILD-v300-recommendation-type-cache')
          s = s.replace('USE-v299-authority-doorway-diagnostic', 'USE-v300-recommendation-type-cache')
          s = re.sub(r'(CANONICAL_BUILD_PAYLOAD_SHA256 = ")[^"]*(")', r'\1__PAYLOAD_SHA256__\2', s, count=1)
          marker = re.compile(r'(?ms)^# === CANONICAL BUILD IDENTITY \(excluded from payload hash\) ===\n.*?^# === END CANONICAL BUILD IDENTITY ===\n?')
          payload, n = marker.subn('# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n', s, count=1)
          if n != 1:
              raise SystemExit('Canonical identity block not found exactly once')
          sha = hashlib.sha256(payload.encode('utf-8')).hexdigest()
          s = s.replace('__PAYLOAD_SHA256__', sha, 1)
          p.write_bytes(s.replace('\n','\r\n').encode('utf-8'))
          print('v300 canonical payload SHA:', sha)
          print('v300 raw source SHA:', hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Verify and commit exact v300 source
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, re
          p = Path('main.py')
          b = p.read_bytes()
          s = b.decode('utf-8').replace('\r\n','\n').replace('\r','\n')
          assert b.endswith(b'\r\n') and b.count(b'\r\n') == b.count(b'\n')
          assert s.count('TextEmbedding(') == 1 and s.count('threads=1') == 1
          assert s.count('threads=2') == 0 and s.count('threads=4') == 0 and s.count('threads=6') == 0
          ast.parse(s)
          marker = re.compile(r'(?ms)^# === CANONICAL BUILD IDENTITY \(excluded from payload hash\) ===\n.*?^# === END CANONICAL BUILD IDENTITY ===\n?')
          payload, n = marker.subn('# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n', s, count=1)
          assert n == 1
          actual = hashlib.sha256(payload.encode()).hexdigest()
          declared = re.search(r'CANONICAL_BUILD_PAYLOAD_SHA256 = "([0-9a-f]+)"', s).group(1)
          assert actual == declared
          print('Verified:', len(b), hashlib.sha256(b).hexdigest(), actual, declared)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Promote USE v300 recommendation type cache [skip v300]'
          git push
