name: Guide response provenance lifecycle regression

on:
  push:
    branches:
      - gold-star-v2-complete-architecture
    paths:
      - "main.py"
      - "tests/test_general_guide_response_provenance_lifecycle.py"
      - ".github/workflows/guide-provenance-lifecycle.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "tests/test_general_guide_response_provenance_lifecycle.py"
      - ".github/workflows/guide-provenance-lifecycle.yml"

permissions:
  contents: read

jobs:
  provenance-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile runtime
        run: python -m py_compile main.py
      - name: Verify provenance initialization and preservation
        run: PYTHONPATH=. python -m pytest -q tests/test_general_guide_response_provenance_lifecycle.py
