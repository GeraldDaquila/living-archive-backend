name: One-time Crosslink Snapshot Promotion

on:
  push:
    paths:
      - ".github/workflows/one-time-crosslink-snapshot-promotion.yml"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover validated candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "13646961419"
          EXPECTED_SHA256: "b6581d6f43937cf44a5c76fa4e237940f6222f52142aabfc25f4b9082208963e"
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$ARTIFACT_ID/zip"             -o candidate.zip
          unzip -q candidate.zip -d candidate
          test "$(jq '.asset_count' candidate/archive_crosslink_snapshot.json)" = "2026"
          actual="$(sha256sum candidate/archive_crosslink_snapshot.json | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          cp candidate/archive_crosslink_snapshot.json archive_crosslink_snapshot.json
          cat > QA/archive_crosslink_snapshot_promotion.md <<EOF
          # Crosslink Snapshot Promotion

          Promoted the validated 2,026-asset candidate from GitHub Actions artifact 13646961419.

          Candidate SHA-256: $actual

          The promotion is explicit and separate from the territorial-integrity architecture merge. Protected assets remain governed by the editorial manifest.
          EOF
      - name: Commit promoted snapshot and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-crosslink-snapshot-promotion.yml
          git add archive_crosslink_snapshot.json QA/archive_crosslink_snapshot_promotion.md
          git commit -m "Promote validated 2,026-asset crosslink snapshot"
          git push
