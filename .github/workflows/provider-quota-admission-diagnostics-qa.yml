name: Provider Quota Admission Diagnostics QA

on:
  push:
    branches:
      - fix/provider-quota-admission-reason-telemetry
  pull_request:
    branches:
      - main
    paths:
      - "provider_bank.py"
      - "provider_quota_control.py"
      - "tests/test_provider_quota_admission_diagnostics.py"
      - ".github/workflows/provider-quota-admission-diagnostics-qa.yml"

permissions:
  contents: read

jobs:
  quota-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Test precise quota admission reasons
        run: pytest -q tests/test_provider_quota_admission_diagnostics.py
