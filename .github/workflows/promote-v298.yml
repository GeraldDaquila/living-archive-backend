name: Promote v298 exact source
on:
  push:
    paths:
      - '.github/workflows/promote-v298.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build v298 byte-exact from v297
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re
          p = Path('main.py')
          b = p.read_bytes()
          replacements = [
              ('# USE PRODUCTION VERSION: v297 — Embedding Runtime Threads 2 + The Guide', '# USE PRODUCTION VERSION: v298 — Embedding Runtime Threads 1 + The Guide'),
              ('APP_VERSION = "v297"', 'APP_VERSION = "v298"'),
              ('DEPLOYMENT_FINGERPRINT = "USE-v297-embedding-runtime-threads-2"', 'DEPLOYMENT_FINGERPRINT = "USE-v298-embedding-runtime-threads-1"'),
              ('CANONICAL_BUILD_ID = "USE-BUILD-v297-embedding-runtime-threads-2"', 'CANONICAL_BUILD_ID = "USE-BUILD-v298-embedding-runtime-threads-1"'),
          ]
          b = b.replace(b'TextEmbedding(model_name="BAAI/bge-small-en-v1.5", threads=2)', b'TextEmbedding(model_name="BAAI/bge-small-en-v1.5", threads=1)')
          for old, new in replacements:
              a, c = old.encode(), new.encode()
              assert b.count(a) == 1, (old, b.count(a))
              b = b.replace(a, c)
          assert b.count(b'TextEmbedding(model_name="BAAI/bge-small-en-v1.5", threads=1)') == 1
          assert b.count(b'TextEmbedding(model_name="BAAI/bge-small-en-v1.5", threads=2)') == 0
          s = b.decode('utf-8')
          s_norm = s.replace('\r\n', '\n').replace('\r', '\n')
          pat = re.compile(r'(?ms)^# === CANONICAL BUILD IDENTITY \(excluded from payload hash\) ===\n.*?^# === END CANONICAL BUILD IDENTITY ===\n?')
          normalized, count = pat.subn('# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n', s_norm, count=1)
          assert count == 1
          payload_sha = hashlib.sha256(normalized.encode('utf-8')).hexdigest()
          old_hash = re.search(r'CANONICAL_BUILD_PAYLOAD_SHA256 = "[0-9a-f]+"', s).group(0)
          b = b.replace(old_hash.encode(), f'CANONICAL_BUILD_PAYLOAD_SHA256 = "{payload_sha}"'.encode())
          p.write_bytes(b)
          assert b.count(b'\r\n') == 21402
          assert b.count(b'\n') == 21402
          assert b.count(b'\r') == 21402
          assert b.endswith(b'\r\n')
          assert b.count(b'threads=1') == 1
          assert b.count(b'threads=2') == 0
          assert b.count(b'threads=4') == 0
          assert b.count(b'threads=6') == 0
          assert b.count(b'v297') == 0
          assert b.count(b'v298') == 4
          assert b.count(b'TextEmbedding(') == 1
          compile(p.read_text(encoding='utf-8'), 'main.py', 'exec')
          raw_sha = hashlib.sha256(b).hexdigest()
          print('v298 payload_sha256=', payload_sha)
          print('v298 raw_sha256=', raw_sha)
          print('v298 bytes=', len(b))
      - name: Commit exact v298 main.py
        shell: bash
        run: |
          git config core.autocrlf false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git diff --cached --quiet && { echo 'No source change'; exit 1; }
          git commit -m 'Promote USE v298 threads 1'
          git push origin HEAD:main
