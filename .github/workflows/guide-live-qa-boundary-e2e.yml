name: Guide Live QA Boundary E2E

on:
  pull_request:
    branches:
      - feat/runtime-gold-standard-exemplars
    paths:
      - main.py
      - guide_direct_attribute_evidence.py
      - general_guide_composition.py
      - .github/workflows/guide-live-qa-boundary-e2e.yml
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  live-guide-boundary:
    if: github.event.pull_request.head.ref == 'fix/guide-factual-no-evidence-final-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for isolated QA service
        env:
          QA_BASE_URL: https://guide-factual-boundary-qa.onrender.com
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base = os.environ["QA_BASE_URL"].rstrip("/")
          deadline = time.monotonic() + 300
          last_error = None
          while time.monotonic() < deadline:
              try:
                  req = urllib.request.Request(base + "/", method="GET")
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status == 200:
                          print("QA service is responding with HTTP 200.")
                          break
                      last_error = f"unexpected HTTP {response.status}"
              except Exception as exc:
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(f"QA service did not become ready within 5 minutes: {last_error}")
          PY

      - name: Run live negative and positive visitor queries
        env:
          QA_BASE_URL: https://guide-factual-boundary-qa.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import time
          import urllib.error
          import urllib.request

          base = os.environ["QA_BASE_URL"].rstrip("/")
          endpoint = base + "/api/query"
          cases = [
              (
                  "negative_direct_attribute",
                  "What is the boiling point of water at sea level?",
              ),
              (
                  "provider_exhaustion_fails_closed",
                  "What is stewardship and why does it matter now more than ever?",
              ),
              (
                  "provider_error_payload_fails_closed",
                  "I want to learn about AI vs. Human Stewardship: Why Conscious Guidance Matters More Than Ever.",
              ),
              (
                  "positive_canonical_node_handoff",
                  "Please take me to Living Stewardship.",
              ),
          ]
          timings = {}
          payloads = {}

          def post_query(query):
              body = json.dumps({"query": query}).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              started = time.perf_counter()
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      status = response.status
                      raw = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read().decode("utf-8", errors="replace")
              elapsed_ms = (time.perf_counter() - started) * 1000
              try:
                  payload = json.loads(raw)
              except Exception:
                  payload = {"raw_response": raw[:2000]}
              return status, payload, elapsed_ms

          for name, query in cases:
              samples = []
              observed = []
              sample_count = 3 if name == "provider_error_payload_fails_closed" else 5
              for attempt in range(sample_count):
                  status, payload, elapsed_ms = post_query(query)
                  samples.append(elapsed_ms)
                  observed.append({"status": status, "payload": payload, "elapsed_ms": round(elapsed_ms, 1)})
                  if status != 200:
                      raise AssertionError(
                          f"{name} attempt {attempt + 1}: expected HTTP 200, got {status}; "
                          f"payload={json.dumps(payload, ensure_ascii=False)[:2000]}"
                      )
                  basis = payload.get("answer_basis") or {}
                  recommendation = payload.get("recommendation")
                  response = str(payload.get("response") or "")
                  if name == "negative_direct_attribute":
                      if basis.get("kind") != "archive_evidence_unavailable":
                          raise AssertionError(
                              "Direct-attribute query did not fail closed with "
                              f"archive_evidence_unavailable: {json.dumps(payload, ensure_ascii=False)[:2000]}"
                          )
                      if recommendation is not None:
                          raise AssertionError(
                              "Direct-attribute query returned an unsupported recommendation: "
                              f"{json.dumps(recommendation, ensure_ascii=False)}"
                          )
                      if "Frequency Water" in response:
                          raise AssertionError("Direct-attribute response contains the known unrelated decoy.")
                  elif name == "provider_exhaustion_fails_closed":
                      if basis.get("kind") != "archive_evidence_unavailable":
                          raise AssertionError(
                              "Provider-exhaustion control did not fail closed: "
                              f"{json.dumps(payload, ensure_ascii=False)[:2000]}"
                          )
                      if recommendation is not None:
                          raise AssertionError(
                              "Provider-exhaustion control returned a doorway as answer authority: "
                              f"{json.dumps(recommendation, ensure_ascii=False)}"
                          )
                      if "outside knowledge" not in response.casefold():
                          raise AssertionError(
                              "Provider-exhaustion control did not explicitly preserve the Archive-only boundary: "
                              f"{json.dumps(payload, ensure_ascii=False)[:2000]}"
                          )
                      if "Stewardship means taking care" in response:
                          raise AssertionError("Provider-exhaustion control leaked the hardcoded general-knowledge answer.")
                  elif name == "provider_error_payload_fails_closed":
                      if basis.get("kind") != "archive_evidence_unavailable":
                          raise AssertionError(
                              "Provider-error payload did not fail closed: "
                              f"{json.dumps(payload, ensure_ascii=False)[:2000]}"
                          )
                      if recommendation is not None:
                          raise AssertionError("Provider-error payload retained an unsupported recommendation.")
                      if "outside knowledge" not in response.casefold():
                          raise AssertionError("Provider-error payload did not use the Archive-only limitation response.")
                      if "GROQ_API_KEY" in response or "Unable to generate a response" in response:
                          raise AssertionError("Provider configuration/error details leaked into the visitor response.")
                  else:
                      if payload.get("intent") == "GUIDE_NODE_HANDOFF":
                          if payload.get("handoff") != "guide_node":
                              raise AssertionError("Living Stewardship positive control used an unexpected handoff mode.")
                          if payload.get("guide_node_title") != "Living Stewardship":
                              raise AssertionError(
                                  "Positive node handoff did not select the requested canonical node: "
                                  f"{json.dumps(payload, ensure_ascii=False)[:2000]}"
                              )
                          if payload.get("guide_node_url") != "https://geralddaquila.com/living-projects-2/":
                              raise AssertionError(
                                  "Positive node handoff URL did not match the canonical registry: "
                                  f"{json.dumps(payload, ensure_ascii=False)[:2000]}"
                              )
                      else:
                          if basis.get("kind") != "archive_supported":
                              raise AssertionError(
                                  "Source-discovery positive control was not Archive-supported: "
                                  f"{json.dumps(payload, ensure_ascii=False)[:2000]}"
                              )
                          positive_url = str((recommendation or {}).get("url") or "")
                          if not isinstance(recommendation, dict) or not positive_url.startswith("https://geralddaquila.com/"):
                              raise AssertionError(
                                  "Source-discovery positive control did not return a canonical Living Archive recommendation: "
                                  f"{json.dumps(payload, ensure_ascii=False)[:2000]}"
                              )
                          if len(response.strip()) < 40:
                              raise AssertionError("Source-discovery response is unexpectedly empty or short.")
                  time.sleep(2)
              ordered = sorted(samples)
              timings[name] = {
                  "samples_ms": [round(x, 1) for x in samples],
                  "p50_ms": round(statistics.median(samples), 1),
                  "p95_ms_nearest_rank": round(ordered[max(0, __import__("math").ceil(0.95 * len(ordered)) - 1)], 1),
              }
              payloads[name] = observed[-1]["payload"]
              print(json.dumps({"case": name, "timings": timings[name], "last_payload": observed[-1]["payload"]}, ensure_ascii=False))

          print("LIVE_QA_SUMMARY=" + json.dumps(timings, ensure_ascii=False))
          PY
