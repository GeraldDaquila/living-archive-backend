name: Guide intergenerational stewardship response contract

on:
  pull_request:
    paths:
      - "general_guide_composition.py"
      - "tests/test_guide_intergenerational_stewardship_contract.py"
      - ".github/workflows/guide-intergenerational-stewardship-contract.yml"
  push:
    branches: [main]
    paths:
      - "general_guide_composition.py"
      - "tests/test_guide_intergenerational_stewardship_contract.py"
      - ".github/workflows/guide-intergenerational-stewardship-contract.yml"

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Guide composition module and regression test
        run: python -m py_compile general_guide_composition.py tests/test_guide_intergenerational_stewardship_contract.py
      - name: Run intergenerational stewardship response contract
        run: python -m pytest -q tests/test_guide_intergenerational_stewardship_contract.py
