name: Guide Provider Health Latency Budget

on:
  pull_request:
    paths:
      - "provider_bank.py"
      - "provider_health_store.py"
      - "test_provider_health_store.py"
      - "test_provider_contract_diagnostics_and_pathway_attribution.py"
      - ".github/workflows/guide-provider-health-latency-budget.yml"
  push:
    branches: [main]
    paths:
      - "provider_bank.py"
      - "provider_health_store.py"
      - "test_provider_health_store.py"
      - "test_provider_contract_diagnostics_and_pathway_attribution.py"
      - ".github/workflows/guide-provider-health-latency-budget.yml"

jobs:
  provider-health-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compile changed runtime modules
        run: python -m py_compile provider_bank.py provider_health_store.py
      - name: Run provider health and pathway regressions
        run: pytest -q test_provider_health_store.py test_provider_contract_diagnostics_and_pathway_attribution.py
