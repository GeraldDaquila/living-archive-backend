name: Reconstruct USE v303

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore v302 source and apply exact v303 gate optimization
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/GeraldDaquila/living-archive-backend/c938362f5aebd364877940ac2300fbc0674c0745/main.py -o main.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          p = Path('main.py')
          text = p.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          assert 'APP_VERSION = "v302"' in text
          assert 'USE-v302-explicit-type-preparation-breakdown' in text
          text = text.replace('# USE PRODUCTION VERSION: v302 — Explicit Type Preparation Breakdown Diagnostic + The Guide', '# USE PRODUCTION VERSION: v303 — Explicit Type Identity Gate Optimization + The Guide', 1)
          text = text.replace('APP_VERSION = "v302"', 'APP_VERSION = "v303"', 1)
          text = text.replace('DEPLOYMENT_FINGERPRINT = "USE-v302-explicit-type-preparation-breakdown"', 'DEPLOYMENT_FINGERPRINT = "USE-v303-explicit-type-identity-gate"', 1)
          text = text.replace('CANONICAL_BUILD_ID = "USE-BUILD-v302-explicit-type-preparation-breakdown"', 'CANONICAL_BUILD_ID = "USE-BUILD-v303-explicit-type-identity-gate"', 1)
          old = '''        _v302_one = time.perf_counter()\n        selection_identity = _explicit_type_selection_identity(document)\n        _v302_identity_elapsed += time.perf_counter() - _v302_one\n        if recognized_type not in explicit_type_targets:\n            continue\n        if selection_identity and selection_identity["requested_type"] in explicit_type_targets:\n            recognized_type = selection_identity["requested_type"]\n'''
          new = '''        if recognized_type not in explicit_type_targets:\n            continue\n        _v302_one = time.perf_counter()\n        selection_identity = _explicit_type_selection_identity(document)\n        _v302_identity_elapsed += time.perf_counter() - _v302_one\n        if selection_identity and selection_identity["requested_type"] in explicit_type_targets:\n            recognized_type = selection_identity["requested_type"]\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          placeholder = '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ==='
          identity_pattern = re.compile(r'(?ms)^# === CANONICAL BUILD IDENTITY \(excluded from payload hash\) ===\n.*?^# === END CANONICAL BUILD IDENTITY ===')
          text, count = identity_pattern.subn(placeholder, text, count=1)
          assert count == 1
          payload = hashlib.sha256(text.encode('utf-8')).hexdigest()
          actual_identity = '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\nCANONICAL_BUILD_ID = "USE-BUILD-v303-explicit-type-identity-gate"\nCANONICAL_BUILD_PAYLOAD_SHA256 = "' + payload + '"\n# === END CANONICAL BUILD IDENTITY ==='
          text = text.replace(placeholder, actual_identity, 1)
          p.write_bytes(text.replace('\n','\r\n').encode('utf-8'))
          raw = p.read_bytes()
          assert raw.count(b'\r\n') == raw.count(b'\n') == raw.count(b'\r')
          assert raw.endswith(b'\r\n')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          normalized = p.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          verify = identity_pattern.sub(placeholder, normalized, count=1)
          assert hashlib.sha256(verify.encode('utf-8')).hexdigest() == payload
          print('v303 raw_sha256=' + hashlib.sha256(raw).hexdigest())
          print('v303 payload_sha256=' + payload)
          PY

      - name: Verify and commit v303
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'APP_VERSION = "v303"' main.py
          grep -q 'USE-v303-explicit-type-identity-gate' main.py
          grep -q 'CANONICAL_BUILD_ID = "USE-BUILD-v303-explicit-type-identity-gate"' main.py
          test "$(grep -c 'TextEmbedding(' main.py)" = "1"
          test "$(grep -c 'threads=1' main.py)" = "1"
          test "$(grep -c 'threads=2' main.py)" = "0"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'Promote USE v303 explicit type identity gate [skip ci]'
          git push
