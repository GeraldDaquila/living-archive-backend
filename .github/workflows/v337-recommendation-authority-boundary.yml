name: USE v337 recommendation authority boundary

on:
  push:
    branches:
      - exp/v337-recommendation-authority-fix
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile main.py use_core.py run_v337_authority_validation.py tests/test_v337_authority_runtime.py tests/test_v337_recommendation_authority_boundary.py
      - name: Authority boundary validation
        run: python run_v337_authority_validation.py
      - name: Authority boundary tests
        run: python -m pytest -q tests/test_v337_authority_runtime.py tests/test_v337_recommendation_authority_boundary.py
