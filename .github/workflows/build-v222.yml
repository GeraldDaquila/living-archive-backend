name: Build v222

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-v222:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Transform and audit v221 to v222
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import re

          p = Path("main.py")
          s = p.read_text(encoding="utf-8").replace("\r\n", "\n")
          assert s.startswith("# USE PRODUCTION VERSION: v221 — Question-Specific Resource Authority + The Guide")
          assert 'APP_VERSION = "v221"' in s
          assert 'DEPLOYMENT_FINGERPRINT = "USE-v221-question-specific-resource-authority"' in s
          assert 'CANONICAL_BUILD_ID = "USE-BUILD-v221-question-specific-resource-authority"' in s

          s = s.replace("# USE PRODUCTION VERSION: v221 — Question-Specific Resource Authority + The Guide", "# USE PRODUCTION VERSION: v222 — Final Evidence Authority Preservation + The Guide", 1)
          s = s.replace('APP_VERSION = "v221"', 'APP_VERSION = "v222"', 1)
          s = s.replace('DEPLOYMENT_FINGERPRINT = "USE-v221-question-specific-resource-authority"', 'DEPLOYMENT_FINGERPRINT = "USE-v222-final-evidence-authority-preservation"', 1)
          s = s.replace('CANONICAL_BUILD_ID = "USE-BUILD-v221-question-specific-resource-authority"', 'CANONICAL_BUILD_ID = "USE-BUILD-v222-final-evidence-authority-preservation"', 1)

          old = '''def _v220_relational_provider_subset(
    prepared: List[Tuple[str, str]],
    question: str,
    max_chars: int,
    separator_len: int,
    prefix_func: Any,
    min_content: int,
    selected_n: int,
) -> Tuple[List[Tuple[str, str]], int, int, bool]:'''
          new = '''def _v220_relational_provider_subset(
    prepared: List[Tuple[str, str]],
    question: str,
    max_chars: int,
    separator_len: int,
    prefix_func: Any,
    min_content: int,
    selected_n: int,
    protected_documents: Optional[List[Dict[str, Any]]] = None,
) -> Tuple[List[Tuple[str, str]], int, int, bool]:'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    axes = _v214_relational_axis_texts(question)
    if len(axes) <= 2 or len(prepared) <= 1:
        return prepared[:selected_n], selected_n, min_content, False

    profiles = []'''
          new = '''    axes = _v214_relational_axis_texts(question)
    if len(axes) <= 2 or len(prepared) <= 1:
        return prepared[:selected_n], selected_n, min_content, False

    # v222: Question-Specific Resource Authority must survive the final
    # provider-evidence compression boundary. v221 establishes functional
    # authority upstream; this boundary prevents that authority from being
    # displaced by a merely more generic resource during final allocation.
    authority_documents = list(protected_documents or [])
    authority_documents.extend(
        _v221_question_specific_resource_authority(
            [{"title": title, "text": content} for title, content in prepared],
            question,
        )
    )
    authority_keys = {
        _resource_key(document)
        for document in authority_documents
        if isinstance(document, dict)
    }
    protected_indices = {
        index
        for index, (title, content) in enumerate(prepared)
        if _resource_key({"title": title, "text": content}) in authority_keys
    }

    profiles = []'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    def rank(indices: Tuple[int, ...]) -> Tuple[Any, ...]:
        covered = set()
        for index in indices:
            covered.update(profiles[index][3].get("covered", set()))
        direct = sum(profiles[index][3].get("direct_fit", 0) for index in indices)
        hits = sum(sum(profiles[index][3].get("hits", {}).values()) for index in indices)
        return (1 if 0 in indices else 0, len(covered), direct, hits, -sum(indices))

    effective_min = min_content
    effective_n = selected_n
    pair_rescue = False
'''
          new = '''    def rank(indices: Tuple[int, ...]) -> Tuple[Any, ...]:
        covered = set()
        for index in indices:
            covered.update(profiles[index][3].get("covered", set()))
        direct = sum(profiles[index][3].get("direct_fit", 0) for index in indices)
        hits = sum(sum(profiles[index][3].get("hits", {}).values()) for index in indices)
        protected_count = len(set(indices) & protected_indices)
        return (protected_count, 1 if 0 in indices else 0, len(covered), direct, hits, -sum(indices))

    effective_min = min_content
    effective_n = selected_n
    pair_rescue = False

    # If the ordinary floor can afford only one block, retain a QSRA-authority
    # resource rather than allowing generic ranking to select a different block.
    if effective_n < 2 and protected_indices:
        effective_index = max(protected_indices, key=lambda index: rank((index,)))
        chosen = [prepared[effective_index]]
        print(
            "USE v222 final evidence authority preservation: "
            f"protected_single=True, index={effective_index}, "
            f"title={chosen[0][0]!r}"
        )
        return chosen, 1, effective_min, False
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        for indices in itertools.combinations(range(len(prepared)), 2):
            if not covers(indices):
                continue'''
          new = '''        for indices in itertools.combinations(range(len(prepared)), 2):
            if protected_indices and not protected_indices.issubset(set(indices)):
                continue
            if not covers(indices):
                continue'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        complete = [
            indices for indices in itertools.combinations(range(len(prepared)), subset_n)
            if covers(indices)
        ]
        if complete:
            best = max(complete, key=rank)'''
          new = '''        complete = [
            indices for indices in itertools.combinations(range(len(prepared)), subset_n)
            if (not protected_indices or protected_indices.issubset(set(indices)))
            and covers(indices)
        ]
        if complete:
            best = max(complete, key=rank)'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    selected, selected_n, min_content, _pair_rescue = _v220_relational_provider_subset(
        prepared, question, max_chars, separator_len, prefix, min_content, selected_n
    )'''
          new = '''    selected, selected_n, min_content, _pair_rescue = _v220_relational_provider_subset(
        prepared, question, max_chars, separator_len, prefix, min_content, selected_n,
        protected_documents=_v221_question_specific_resource_authority(
            [{"title": title, "text": content} for title, content in prepared],
            question,
        ),
    )'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = 'def _v220_final_relational_evidence_integrity_self_audit() -> None:\n'
          audit = '''def _v222_final_evidence_authority_preservation_self_audit() -> None:
    """Verify QSRA-authoritative evidence survives final provider compression."""
    question = (
        "How can clearer division of responsibilities reduce duplication and conflict "
        "while making an organization slower to adapt when a problem crosses those "
        "established boundaries?"
    )
    context = (
        "Title: Why Cooperation Breaks Down: Trust, Competition, and Survival\n"
        "Content: Cooperation can reduce conflict and improve collective effectiveness, "
        "but interdependence can also create constraints between parts of a system.\n\n---\n\n"
        "Title: Work Sequence — The Protocol\n"
        "Content: Clear division of responsibilities can reduce duplication and conflict "
        "by assigning work through defined sequences and boundaries.\n\n---\n\n"
        "Title: Capability Must Be Shared\n"
        "Content: Shared capability helps organizations coordinate and respond when work "
        "requires contribution across multiple parts."
    )
    prepared = []
    for block in context.split("\n\n---\n\n"):
        title_match = re.search(r"^Title:\s*(.+?)\s*$", block, flags=re.MULTILINE)
        content_match = re.search(r"^Content:\s*(.*)$", block, flags=re.MULTILINE | re.DOTALL)
        if title_match and content_match:
            prepared.append((title_match.group(1).strip(), content_match.group(1).strip()))

    authority = _v221_question_specific_resource_authority(
        [{"title": title, "text": content} for title, content in prepared],
        question,
    )
    authority_titles = {doc["title"] for doc in authority}
    assert "Work Sequence — The Protocol" in authority_titles

    bounded = _v217_build_provider_evidence_context(
        context, max_chars=700, max_resource_chars=700, question=question, schema_free=False
    )
    assert "Work Sequence — The Protocol" in bounded
    print(
        "USE v222 FINAL EVIDENCE AUTHORITY PRESERVATION AUDIT: PASS; "
        f"authority={sorted(authority_titles)}, bounded_chars={len(bounded)}"
    )


'''
          assert marker in s
          s = s.replace(marker, audit + marker, 1)

          s = s.replace('v221: preserve question-specific authority', 'v221/v222: preserve question-specific authority')
          s = s.replace('USE v220 final relational evidence integrity: ', 'USE v220/v222 final evidence integrity: ')

          start = '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n'
          end = '# === END CANONICAL BUILD IDENTITY ===\n'
          i = s.index(start)
          j = s.index(end, i) + len(end)
          normalized = s[:i] + '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n' + s[j:]
          payload = hashlib.sha256(normalized.encode("utf-8")).hexdigest()
          lines = s.splitlines()
          replaced = False
          for n, line in enumerate(lines):
              if line.startswith('CANONICAL_BUILD_PAYLOAD_SHA256 = '):
                  lines[n] = f'CANONICAL_BUILD_PAYLOAD_SHA256 = "{payload}"'
                  replaced = True
                  break
          assert replaced
          s = "\n".join(lines) + "\n"
          i = s.index(start)
          j = s.index(end, i) + len(end)
          normalized2 = s[:i] + '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n' + s[j:]
          assert hashlib.sha256(normalized2.encode("utf-8")).hexdigest() == payload

          s = s.replace("\n", "\r\n")
          p.write_bytes(s.encode("utf-8"))
          ast.parse(p.read_text(encoding="utf-8"))
          print("v222 payload_sha256=", payload)
          print("v222 source_sha256=", hashlib.sha256(p.read_bytes()).hexdigest())
          print("v222 bytes=", p.stat().st_size)
          print("v222 lines=", len(p.read_text(encoding="utf-8").splitlines()))
          PY

      - name: Commit v222 to main and remove builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --check
          git rm .github/workflows/build-v222.yml
          git add main.py
          git diff --cached --check
          git commit -m "USE PRODUCTION VERSION: v222 — Final Evidence Authority Preservation"
          git push origin HEAD:main
