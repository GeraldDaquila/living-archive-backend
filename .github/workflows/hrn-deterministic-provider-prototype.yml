name: HRN Deterministic Provider Prototype

on:
  pull_request:
    paths:
      - "hrn_deterministic_provider_prototype.py"
      - "tests/test_hrn_deterministic_provider_prototype.py"
      - ".github/workflows/hrn-deterministic-provider-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test isolated HRN provider contract
        run: python -m pytest -q tests/test_hrn_deterministic_provider_prototype.py
