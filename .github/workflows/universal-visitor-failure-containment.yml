name: Universal visitor failure containment
on:
  pull_request:
    paths:
      - "main.py"
      - "visitor_failure_recovery.py"
      - "tests/test_universal_visitor_failure_containment.py"
      - ".github/workflows/universal-visitor-failure-containment.yml"
  workflow_dispatch:
jobs:
  visitor-failure-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run failure-containment contract
        run: python -m pytest -q tests/test_universal_visitor_failure_containment.py
      - name: Compile changed runtime module
        run: python -m py_compile main.py visitor_failure_recovery.py
