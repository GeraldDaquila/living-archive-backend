name: Guide active-active transport contract

on:
  pull_request:
    paths:
      - "QA/guide_active_active_transport.js"
      - "QA/guide_active_active_transport.test.js"
      - ".github/workflows/guide-active-active-transport.yml"
  push:
    branches:
      - main
    paths:
      - "QA/guide_active_active_transport.js"
      - "QA/guide_active_active_transport.test.js"
      - ".github/workflows/guide-active-active-transport.yml"

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check QA/guide_active_active_transport.js
      - name: Run weighted endpoint selection contract
        run: node QA/guide_active_active_transport.test.js
