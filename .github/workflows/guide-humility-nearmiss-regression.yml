name: Guide Humility Near-Miss Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "humility_spiritual_maturity_contract.py"
      - "tests/test_humility_spiritual_maturity_contract.py"
      - "tests/test_general_guide_provider_parse_contract.py"
      - "tests/test_guide_humility_spiritual_maturity_doorway.py"
      - "tests/test_answer_doorway_mobile_presentation.py"
      - "wordpress/living-archive-answer-doorway-standard/assets/answer-doorway.css"
      - "wordpress/guide/woody-snippet-76926-universal.html"
      - "wordpress/living-archive-answer-doorway-standard/living-archive-answer-doorway-standard.php"
      - ".github/workflows/guide-humility-nearmiss-regression.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "humility_spiritual_maturity_contract.py"
      - "tests/test_humility_spiritual_maturity_contract.py"
      - "tests/test_general_guide_provider_parse_contract.py"
      - "tests/test_guide_humility_spiritual_maturity_doorway.py"
      - "tests/test_answer_doorway_mobile_presentation.py"
      - "wordpress/living-archive-answer-doorway-standard/assets/answer-doorway.css"
      - "wordpress/guide/woody-snippet-76926-universal.html"
      - "wordpress/living-archive-answer-doorway-standard/living-archive-answer-doorway-standard.php"
      - ".github/workflows/guide-humility-nearmiss-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-humility-nearmiss-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  humility-nearmiss-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile candidate Guide runtime
        run: python -m compileall -q main.py general_guide_composition.py
      - name: Verify exact humility and spiritual-maturity doorway selection
        run: PYTHONPATH=. python -m pytest -q tests/test_guide_humility_spiritual_maturity_doorway.py
      - name: Verify punctuation and source-boundary normalization
        run: PYTHONPATH=. python -m pytest -q tests/test_general_guide_provider_parse_contract.py
      - name: Verify answer and doorway mobile presentation contract
        run: PYTHONPATH=. python -m pytest -q tests/test_answer_doorway_mobile_presentation.py
