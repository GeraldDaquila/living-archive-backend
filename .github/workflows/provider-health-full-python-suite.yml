name: Provider Health Full Python Suite

on:
  pull_request:
    branches: [main]
    paths:
      - "provider_bank.py"
      - "provider_health_store.py"
      - "provider_resilience.py"
      - "test_provider_health_store.py"
      - "tests/**"
      - ".github/workflows/provider-health-full-python-suite.yml"

permissions:
  contents: read

jobs:
  full-python-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile provider resilience modules
        run: python -m compileall -q provider_bank.py provider_health_store.py provider_resilience.py

      - name: Run complete repository Python test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
