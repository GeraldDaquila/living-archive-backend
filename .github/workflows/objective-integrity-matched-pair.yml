name: Objective-integrity Gold Star matched-pair Gemini pilot

concurrency:
  group: objective-integrity-paired-pilot-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [qa/gold-star-objective-integrity-matched-pair-20261126]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_provider_capture:
        description: "Authorize the 12-call same-provider Gemini objective-integrity pilot"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  matched-pair-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpx pytest
      - name: Validate pre-registered objective-integrity cohort
        run: |
          test -f docs/qa/objective_integrity_matched_pair_cases_gemini.json
          PYTHONPATH=. python -m pytest -q tests/test_gold_star_objective_integrity_matched_pair.py tests/test_gold_star_matched_pair_capture.py tests/test_gold_star_matched_pair_workflow.py tests/test_gold_star_objective_integrity_matched_pair_workflow.py tests/test_gold_star_adaptation_evaluation.py
      - name: Verify candidate-local suite wiring
        run: python -m compileall -q scripts/capture_gold_star_matched_pairs.py

  matched-pair-capture:
    needs: matched-pair-contract
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/qa/gold-star-objective-integrity-matched-pair-20261126') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_provider_capture == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      USE_PROVIDER_BANK_MAX_ATTEMPTS: "2"
      USE_GUIDE_EVALUATION_PROVIDER_ORDER: "gemini"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install runtime and ASGI test transport
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpx
      - name: Run six same-provider, same-model Gemini control/treatment pairs
        run: >-
          python scripts/capture_gold_star_matched_pairs.py
          --case-set docs/qa/objective_integrity_matched_pair_cases.json
          --provider gemini
          --model gemini-3.8-flash
          --provider-timeout-seconds 10
          --inter-call-delay-seconds 65
          --output-dir artifacts/objective-integrity-matched-pairs-gemini
      - name: Upload blinded reviewer package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objective-integrity-blind-review-${{ github.run_id }}
          path: artifacts/objective-integrity-matched-pairs/blind-review-package.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload unblinding evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objective-integrity-unblinding-evidence-${{ github.run_id }}
          path: |
            artifacts/objective-integrity-matched-pairs/matched-pair-evidence.json
            artifacts/objective-integrity-matched-pairs/unblinding-key.json
            artifacts/objective-integrity-matched-pairs/paired-evaluation-template.json
          if-no-files-found: warn
          retention-days: 90
