name: Live Guide Dual-Service E2E

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "streaming_transport.py"
      - "general_guide_composition.py"
      - "deterministic_answer_recovery.py"
      - "tests/test_archive_constitutional_recovery.py"
      - "provider_bank.py"
      - "tests/test_cross_question_gold_standard_integrity.py"
      - "tests/test_general_guide_perception_contract.py"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - ".github/workflows/live-guide-dual-service-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-guide-dual-service-e2e
  cancel-in-progress: true

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for both production services and verify the live clarification boundary
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          match = re.search(r'APP_VERSION = "(v[0-9.]+)"', source)
          if not match:
              raise SystemExit("Cannot determine expected production version from main.py")
          expected_version = match.group(1)

          # Runtime source SHA-256 is computed by each service at startup. Verify
          # both live instances report the same deployed source, then verify that
          # each visitor-facing response reports that same hash. This is robust to
          # workflow-only commits, which do not require rebuilding the app.

          services = {
              "primary": "https://living-archive-backend.onrender.com",
              "backup": "https://living-archive-backend-mirror.onrender.com",
          }

          def post_query(base_url, query, timeout=90):
              request = urllib.request.Request(
                  base_url + "/api/query",
                  data=json.dumps({"query": query}).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = {"raw": body[:500]}
                  return exc.code, payload

          clarification_query = "Can you compare two ways of understanding this problem?"
          ready = set()
          last_state = {}

          for attempt in range(1, 25):
              for name, base_url in services.items():
                  if name in ready:
                      continue
                  try:
                      # This cheap audit endpoint exposes Render's deployed commit
                      # SHA; after it matches, verify the visitor-facing clarification
                      # boundary and ensure both responses share the same source hash.
                      request = urllib.request.Request(
                          base_url + "/api/integration-audit",
                          headers={"Accept": "application/json"},
                          method="GET",
                      )
                      with urllib.request.urlopen(request, timeout=10) as response:
                          status = response.status
                          payload = json.loads(response.read().decode("utf-8"))
                      last_state[name] = {
                          "status": status,
                          "version": payload.get("version"),
                          "fingerprint": payload.get("fingerprint"),
                          "deployment_commit_sha": payload.get("deployment_commit_sha"),
                          "source_sha256": payload.get("source_sha256"),
                      }
                      if (
                          status == 200
                          and payload.get("version") == expected_version
                          and str(payload.get("fingerprint") or "").startswith(f"USE-{expected_version}-")
                          and bool(payload.get("source_sha256"))
                      ):
                          boundary_status, boundary_payload = post_query(
                              base_url, clarification_query, timeout=25
                          )
                          if (
                              boundary_status == 200
                              and boundary_payload.get("version") == expected_version
                              and boundary_payload.get("source_sha256") == payload.get("source_sha256")
                              and boundary_payload.get("intent") == "CLARIFICATION_REQUIRED"
                              and boundary_payload.get("recommendation") is None
                              and boundary_payload.get("clarification", {}).get("required") is True
                          ):
                              ready.add(name)
                              print(
                                  f"{name}: runtime source and clarification boundary PASS; "
                                  f"version={expected_version}; source_sha256={payload.get('source_sha256')}"
                              )
                  except Exception as exc:
                      last_state[name] = {"error": f"{type(exc).__name__}: {str(exc)[:180]}"}
              if len(ready) == len(services):
                  break
              print(f"Waiting for expected release {expected_version}: attempt={attempt}, state={last_state}")
              time.sleep(10)

          if len(ready) != len(services):
              raise SystemExit(
                  f"Both services did not reach {expected_version} with the clarification contract. "
                  f"Last state: {last_state}"
              )
          primary_source = last_state.get("primary", {}).get("source_sha256")
          mirror_source = last_state.get("backup", {}).get("source_sha256")
          if not primary_source or primary_source != mirror_source:
              raise SystemExit(
                  "Primary/mirror runtime source parity failed: "
                  f"primary={primary_source}; mirror={mirror_source}"
              )
          print(f"Primary/mirror runtime source parity PASS: {primary_source}")

          # Exact regression for the general-fact fallback reported by the visitor.
          # This runs against both production services after release identity matches.
          water_query = "What is the boiling point of water at sea level?"
          water_results = {}
          for name, base_url in services.items():
              status, payload = post_query(base_url, water_query, timeout=60)
              if status != 200 or payload.get("version") != expected_version:
                  raise SystemExit(
                      f"{name}: water-boiling general-fact request failed: "
                      f"status={status}, version={payload.get('version')}"
                  )
              response = str(payload.get("response") or "")
              basis = payload.get("answer_basis") or {}
              if not re.search(r"100\s*°?C", response, re.I):
                  raise SystemExit(f"{name}: water answer missing 100°C: {response!r}")
              if not re.search(r"212\s*°?F", response, re.I):
                  raise SystemExit(f"{name}: water answer missing 212°F: {response!r}")
              if not re.search(r"standard atmospheric pressure", response, re.I):
                  raise SystemExit(f"{name}: water answer omitted pressure qualification: {response!r}")
              if basis.get("kind") != "general_knowledge":
                  raise SystemExit(f"{name}: water answer provenance is not general_knowledge: {basis!r}")
              if payload.get("recommendation") is not None:
                  raise SystemExit(f"{name}: water answer invented an Archive doorway: {payload.get('recommendation')!r}")
              if re.search(r"i haven.t found enough support|rather than fill the gap with outside knowledge", response, re.I):
                  raise SystemExit(f"{name}: water answer retained the Archive-only refusal: {response!r}")
              water_results[name] = (response, basis.get("kind"), payload.get("recommendation"))
              print(f"{name}: water-boiling general-fact boundary PASS; chars={len(response)}; basis={basis.get('kind')}")
          if water_results.get("primary") != water_results.get("backup"):
              raise SystemExit("Primary/mirror water-boiling response parity failed.")

          # Verify that the guard did not replace the ordinary composition path.
          # This established calibration question exercises explanatory depth,
          # readable paragraph structure, and the separate canonical doorway.
          golden_query = "What is stewardship and why does it matter now more than ever?"
          for name, base_url in services.items():
              status, payload = post_query(base_url, golden_query, timeout=120)
              if status != 200 or payload.get("version") != expected_version:
                  raise SystemExit(f"{name}: golden composition request failed: status={status}, payload={payload}")
              response = str(payload.get("response") or "").strip()
              paragraphs = [part.strip() for part in re.split(r"\n\s*\n+", response) if part.strip()]
              if payload.get("processing") != "basic_inquiry":
                  raise SystemExit(f"{name}: ordinary explanatory question left General Guide composition: {payload.get('intent')}")
              if payload.get("intent") == "GLOSSARY_HANDOFF" or payload.get("handoff") == "glossary":
                  raise SystemExit(f"{name}: compound explanatory question was misrouted to Glossary")
              if len(paragraphs) < 3 or len(response) < 250:
                  raise SystemExit(f"{name}: explanatory composition lost depth or paragraph structure")
              # Internal labels remain case-insensitive, but the product acronym
              # USE is reserved for uppercase; the ordinary verb "use" is valid prose.
              if (
                  re.search(
                      r"\b(?:provider bank|canonical evidence|retrieval layer|synthesis layer|processing layer)\b",
                      response,
                      re.I,
                  )
                  or re.search(r"\bUSE\b", response)
              ):
                  raise SystemExit(f"{name}: internal implementation language leaked into visitor prose")
              recommendation = payload.get("recommendation")
              if not isinstance(recommendation, dict):
                  raise SystemExit(f"{name}: independent canonical recommendation is missing")
              url = str(recommendation.get("url") or "")
              title = str(recommendation.get("title") or "").strip()
              if not title or not url.startswith("https://geralddaquila.com/"):
                  raise SystemExit(f"{name}: canonical recommendation failed domain/title validation")
              print(
                  f"{name}: golden composition PASS; version={expected_version}; "
                  f"paragraphs={len(paragraphs)}; response_chars={len(response)}; "
                  f"recommendation={title}; url={url}"
              )

          # Production integrity-recovery regression: a constitutional-reasoning
          # question must not receive the approved Living Archive definition answer.
          # This directly exercises the provider-backed recovery path on both services.
          constitutional_query = "What is constitutional reasoning in the Archive's sense?"
          for name, base_url in services.items():
              status, payload = post_query(base_url, constitutional_query, timeout=120)
              if status != 200 or payload.get("version") != expected_version:
                  raise SystemExit(
                      f"{name}: constitutional-reasoning request failed: "
                      f"status={status}, version={payload.get('version')}"
                  )
              response = str(payload.get("response") or "").strip()
              paragraphs = [part.strip() for part in re.split(r"\n\s*\n+", response) if part.strip()]
              if payload.get("processing") != "basic_inquiry":
                  raise SystemExit(
                      f"{name}: constitutional reasoning left General Guide composition: "
                      f"{payload.get('processing')!r}/{payload.get('intent')!r}"
                  )
              if payload.get("intent") == "GLOSSARY_HANDOFF" or payload.get("handoff") == "glossary":
                  raise SystemExit(f"{name}: constitutional reasoning was misrouted to Glossary")
              if len(paragraphs) < 3 or len(response) < 300:
                  raise SystemExit(
                      f"{name}: constitutional-reasoning response lacks explanatory depth: "
                      f"chars={len(response)}, paragraphs={len(paragraphs)}"
                  )
              if re.search(
                  r"(?i)the living archive is a public knowledge commons and an orientation ecosystem|"
                  r"it is not a chatbot that treats every question",
                  response,
              ):
                  raise SystemExit(
                      f"{name}: institutional-definition Gold Standard leaked into constitutional reasoning"
                  )
              if not re.search(r"(?i)constitutional reasoning", response):
                  raise SystemExit(f"{name}: response did not explain constitutional reasoning directly")
              if not re.search(r"(?i)governing relationships|relationships among concepts|relationships between concepts", response):
                  raise SystemExit(f"{name}: response omitted constitutional governing relationships")
              if not re.search(r"(?i)recovered constitutional architecture|constitutional architecture", response):
                  raise SystemExit(f"{name}: response omitted the recovered constitutional architecture")
              if not re.search(r"(?i)later interpretation|subsequent interpretation|interpretive layer", response):
                  raise SystemExit(f"{name}: response omitted the distinction from later interpretation")
              if not re.search(r"(?i)recovery before translation|recover.*before.*translat", response):
                  raise SystemExit(f"{name}: response omitted the Archive's recovery-before-translation order")
              if (
                  re.search(
                      r"\b(?:provider bank|canonical evidence|retrieval layer|synthesis layer|processing layer)\b",
                      response,
                      re.I,
                  )
                  or re.search(r"\bUSE\b", response)
              ):
                  raise SystemExit(f"{name}: internal implementation language leaked into constitutional response")
              recommendation = payload.get("recommendation")
              if not isinstance(recommendation, dict):
                  raise SystemExit(f"{name}: constitutional reasoning lacks a separate canonical doorway")
              url = str(recommendation.get("url") or "")
              title = str(recommendation.get("title") or "").strip()
              if not title or not url.startswith("https://geralddaquila.com/"):
                  raise SystemExit(f"{name}: constitutional canonical doorway failed validation")
              print(
                  f"{name}: constitutional-reasoning integrity-recovery PASS; "
                  f"chars={len(response)}; paragraphs={len(paragraphs)}; "
                  f"recommendation={title}; url={url}"
              )

          # Reproduce the visitor's reported failure exactly. This must remain
          # an answer-first interaction even when every model provider is down.
          explicit_explanation = "Explain stewardship, but do not send me to another page yet."
          for name, base_url in services.items():
              status, payload = post_query(base_url, explicit_explanation, timeout=120)
              if status != 200 or payload.get("version") != expected_version:
                  raise SystemExit(f"{name}: explicit explanation request failed: status={status}, payload={payload}")
              response = str(payload.get("response") or "").strip()
              paragraphs = [part.strip() for part in re.split(r"\n\s*\n+", response) if part.strip()]
              if payload.get("processing") != "basic_inquiry":
                  raise SystemExit(f"{name}: explicit explanation left General Guide composition")
              if len(paragraphs) < 3 or len(response) < 300:
                  raise SystemExit(f"{name}: explicit stewardship explanation is too thin: chars={len(response)}, paragraphs={len(paragraphs)}")
              if not re.search(r"(?i)^stewardship means", response):
                  raise SystemExit(f"{name}: explicit stewardship request was not answered directly")
              if (
                  re.search(
                      r"(?i)couldn't verify a reliable answer|won't present a guess as fact|separately selected Archive resource|provider bank|canonical evidence|retrieval layer|synthesis layer|processing layer",
                      response,
                  )
                  or re.search(r"\bUSE\b", response)
              ):
                  raise SystemExit(f"{name}: limitation-only or machine-facing fallback leaked into visitor prose")
              if re.search(r"(?m)^\s*(?:[-*+]\s+|\d+[.)]\s+)", response):
                  raise SystemExit(f"{name}: plain stewardship explanation used an unsolicited list")
              if not re.search(r"(?i)keeping a promise|shared spaces?|maintaining what others rely on|using resources thoughtfully|resources thoughtfully|returning|borrowed item", response):
                  raise SystemExit(f"{name}: stewardship answer lacks a recognizable everyday anchor")
              if not re.search(r"(?i)does not mean controlling|doesn't mean controlling|sacrificing yourself|within your limits|what is yours to care for", response):
                  raise SystemExit(f"{name}: stewardship answer omitted the boundary between care and control")
              if re.search(r"https?://|\[[^\]]+\]\(", response):
                  raise SystemExit(f"{name}: navigation was embedded in answer prose despite the visitor's instruction")
              recommendation = payload.get("recommendation")
              if recommendation is not None and not isinstance(recommendation, dict):
                  raise SystemExit(f"{name}: recommendation field has invalid shape")
              print(f"{name}: explicit stewardship/no-navigation answer PASS; chars={len(response)}; paragraphs={len(paragraphs)}; recommendation remains separate")

          # Verify the browser-facing SSE path is actually live, emits a
          # keep-alive-capable stream, and preserves the complete response
          # envelope (including the separately selected Archive recommendation).
          stream_query = "Explain stewardship, but do not send me to another page yet."
          for name, base_url in services.items():
              request = urllib.request.Request(
                  base_url + "/api/query-stream",
                  data=json.dumps({"query": stream_query}).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "text/event-stream"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  content_type = response.headers.get("Content-Type", "")
                  stream_body = response.read().decode("utf-8", "replace")
              if "text/event-stream" not in content_type:
                  raise SystemExit(f"{name}: stream content type is wrong: {content_type}")
              events = {}
              current_event = None
              for line in stream_body.splitlines():
                  if line.startswith("event:"):
                      current_event = line[6:].strip()
                  elif line.startswith("data:") and current_event:
                      try:
                          events[current_event] = json.loads(line[5:].strip())
                      except Exception:
                          raise SystemExit(f"{name}: invalid SSE JSON for event {current_event}")
              if "stream_start" not in events or "response_text" not in events or "response_complete" not in events:
                  raise SystemExit(f"{name}: SSE stream omitted required lifecycle events: {sorted(events)}")
              final_payload = events["response_complete"].get("payload")
              if not isinstance(final_payload, dict):
                  raise SystemExit(f"{name}: SSE completion omitted the authoritative response payload")
              answer = str(final_payload.get("response") or "").strip()
              paragraphs = [part.strip() for part in re.split(r"\n\s*\n+", answer) if part.strip()]
              if len(paragraphs) < 3 or len(answer) < 300:
                  raise SystemExit(f"{name}: SSE answer failed composition floor: chars={len(answer)}, paragraphs={len(paragraphs)}")
              if re.search(r"(?m)^\s*(?:[-*+]\s+|\d+[.)]\s+)", answer):
                  raise SystemExit(f"{name}: SSE stewardship answer used an unsolicited list")
              if not re.search(r"(?i)keeping a promise|shared spaces?|maintaining what others rely on|using resources thoughtfully|resources thoughtfully|returning|borrowed item", answer):
                  raise SystemExit(f"{name}: SSE answer lacks a recognizable everyday anchor")
              if not re.search(r"(?i)does not mean controlling|doesn't mean controlling|sacrificing yourself|within your limits|what is yours to care for", answer):
                  raise SystemExit(f"{name}: SSE answer omitted the boundary between care and control")
              streamed_recommendation = events["response_complete"].get("recommendation")
              if streamed_recommendation != final_payload.get("recommendation"):
                  raise SystemExit(
                      f"{name}: SSE completion recommendation diverged from the authoritative payload: "
                      f"{streamed_recommendation!r} != {final_payload.get('recommendation')!r}"
                  )
              if streamed_recommendation is not None and not isinstance(streamed_recommendation, dict):
                  raise SystemExit(f"{name}: SSE recommendation field has an invalid shape")
              if isinstance(streamed_recommendation, dict) and (
                  not streamed_recommendation.get("title") or not streamed_recommendation.get("url")
              ):
                  raise SystemExit(f"{name}: SSE recommendation is missing its canonical title or URL")
              print(
                  f"{name}: SSE delivery PASS; chars={len(answer)}; paragraphs={len(paragraphs)}; "
                  f"canonical recommendation preserved={streamed_recommendation is not None}"
              )

          # The Guide resource-discovery regression now respects the native Catalogue boundary.
          # A resource-finding question must cross into the Catalogue's own search surface;
          # USE must preserve the visitor's exact query instead of substituting a generic
          # page recommendation or duplicating Catalogue retrieval.
          discovery_query = "Where can I find material about institutional responsibility?"
          expected_catalogue_url = (
              "https://geralddaquila.com/explore-the-stewardship-catalogue/"
              + "?catalogue_query="
              + urllib.parse.quote(discovery_query, safe="")
          )
          discovery_results = {}
          for name, base_url in services.items():
              status, payload = post_query(base_url, discovery_query, timeout=120)
              if status != 200 or payload.get("version") != expected_version:
                  raise SystemExit(
            f"{name}: discovery parity request failed: status={status}, "
            f"version={payload.get('version')}, expected={expected_version}"
                  )
              if payload.get("intent") != "CATALOGUE_HANDOFF":
                  raise SystemExit(
            f"{name}: resource discovery did not use the native Catalogue boundary: "
            f"intent={payload.get('intent')!r}"
                  )
              if (
                  payload.get("handoff") != "catalogue"
                  or payload.get("handoff_mode") != "direct"
                  or payload.get("handoff_pending") is not True
                  or payload.get("return_mode") != "native_catalogue_search"
              ):
                  raise SystemExit(
            f"{name}: Catalogue handoff contract is incomplete: "
            f"handoff={payload.get('handoff')!r}, mode={payload.get('handoff_mode')!r}, "
            f"pending={payload.get('handoff_pending')!r}, return_mode={payload.get('return_mode')!r}"
                  )
              if payload.get("catalogue_query") != discovery_query:
                  raise SystemExit(
            f"{name}: original resource query was not preserved across Catalogue handoff: "
            f"{payload.get('catalogue_query')!r}"
                  )
              actual_url = str(payload.get("catalogue_url") or "")
              if actual_url != expected_catalogue_url:
                  raise SystemExit(
            f"{name}: native Catalogue destination mismatch: {actual_url!r}; "
            f"expected {expected_catalogue_url!r}"
                  )
              if payload.get("recommendation") is not None:
                  raise SystemExit(
            f"{name}: Catalogue handoff duplicated native Catalogue retrieval with a separate recommendation"
                  )
              discovery_results[name] = (
                  payload.get("intent"),
                  payload.get("handoff"),
                  payload.get("catalogue_query"),
                  actual_url,
              )
              print(
                  f"{name}: institutional-responsibility Catalogue handoff PASS; "
                  f"query preserved; url={actual_url}"
              )

          if discovery_results.get("primary") != discovery_results.get("backup"):
              raise SystemExit(f"Primary/mirror Catalogue handoff behavior diverged: {discovery_results}")
          print("primary/backup Catalogue handoff parity PASS: both preserve the same query and native destination")
          PY
