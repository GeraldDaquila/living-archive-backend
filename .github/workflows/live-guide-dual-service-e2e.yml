name: Live Guide Dual-Service Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "streaming_transport.py"
      - "general_guide_composition.py"
      - "general_guide_gold_standards.py"
      - "docs/qa/gold_standard_registry.json"
      - "deterministic_answer_recovery.py"
      - "provider_bank.py"
      - ".github/workflows/live-guide-dual-service-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-guide-dual-service-e2e
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify both production runtimes with inexpensive audit reads
        env:
          EXPECTED_RUNTIME_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request
          from datetime import date, datetime, timezone
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          match = re.search(r'APP_VERSION = "(v[0-9.]+)"', source)
          if not match:
              raise SystemExit("Cannot determine expected version from main.py")
          expected_version = match.group(1)
          expected_commit = __import__("os").environ["EXPECTED_RUNTIME_SHA"]

          services = {
              "primary": "https://living-archive-backend.onrender.com",
          }
          mirror_available_after = date(2026, 12, 1)
          if datetime.now(timezone.utc).date() >= mirror_available_after:
              services["mirror"] = "https://living-archive-backend-mirror.onrender.com"
          else:
              print(
                  "mirror: intentionally skipped until planned December 1, 2026 reset; "
                  "primary remains the sole production runtime under acceptance"
              )
          observations = {}

          # This release smoke test intentionally uses only the inexpensive
          # integration-audit GET endpoint. It does not call /api/query,
          # /api/query-stream, LLM providers, or Pinecone. Registry/selector
          # correctness is covered by offline PR checks; this confirms both
          # deployed instances have reached the expected commit and share
          # the same runtime source fingerprint.
          for name, base_url in services.items():
              last = None
              stable_reads = 0
              for attempt in range(1, 31):
                  request = urllib.request.Request(
                      base_url + "/api/integration-audit",
                      headers={"Accept": "application/json"},
                      method="GET",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=10) as response:
                          status = response.status
                          payload = json.loads(response.read().decode("utf-8"))
                      state = {
                          "status": status,
                          "version": payload.get("version"),
                          "fingerprint": payload.get("fingerprint"),
                          "deployment_commit_sha": payload.get("deployment_commit_sha"),
                          "source_sha256": payload.get("source_sha256"),
                      }
                      if (
                          status == 200
                          and state["version"] == expected_version
                          and state["deployment_commit_sha"] == expected_commit
                          and str(state["fingerprint"] or "").startswith(f"USE-{expected_version}-")
                          and state["source_sha256"]
                      ):
                          stable_reads = stable_reads + 1 if last == state else 1
                          last = state
                          if stable_reads >= 2:
                              observations[name] = state
                              print(f"{name}: runtime identity PASS: {state}")
                              break
                      else:
                          last = state
                          stable_reads = 0
                          print(f"{name}: awaiting expected runtime (attempt {attempt}/30): {state}")
                  except Exception as exc:
                      last = {"error": f"{type(exc).__name__}: {str(exc)[:160]}"}
                      stable_reads = 0
                      print(f"{name}: audit read unavailable (attempt {attempt}/30): {last}")
                  time.sleep(10)
              else:
                  raise SystemExit(
                      f"{name}: expected runtime did not stabilize; last observation={last}"
                  )

          primary = observations["primary"]
          if "mirror" in observations:
              mirror = observations["mirror"]
              if primary["source_sha256"] != mirror["source_sha256"]:
                  raise SystemExit(
                      "Primary/mirror source mismatch: "
                      f"{primary['source_sha256']} != {mirror['source_sha256']}"
                  )
              print(
                  "Dual-service runtime identity PASS: "
                  f"commit={expected_commit}; source_sha256={primary['source_sha256']}"
              )
          else:
              print(
                  "Primary-only runtime identity PASS; mirror verification deferred "
                  f"until {mirror_available_after.isoformat()}"
              )
          PY
