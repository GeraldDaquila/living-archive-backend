name: Guide Reflexive Institutional Critique
on:
  pull_request:
    paths: ["main.py", "guide_reflexive_critique.py", "gold_star_question_contract.py", "general_guide_composition.py", "tests/test_guide_reflexive_critique.py", "tests/test_guide_reflexive_critique_integration.py", ".github/workflows/guide-reflexive-institutional-critique.yml"]
  push:
    branches: [main]
    paths: ["main.py", "guide_reflexive_critique.py", "gold_star_question_contract.py", "general_guide_composition.py", "tests/test_guide_reflexive_critique.py", "tests/test_guide_reflexive_critique_integration.py", ".github/workflows/guide-reflexive-institutional-critique.yml"]
jobs:
  reflexive-critique-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m py_compile main.py guide_reflexive_critique.py gold_star_question_contract.py general_guide_composition.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_guide_reflexive_critique.py tests/test_guide_reflexive_critique_integration.py
