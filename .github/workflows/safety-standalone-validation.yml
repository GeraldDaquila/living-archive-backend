name: Standalone Deterministic Safety Validation

on:
  push:
    branches:
      - safety/standalone-deterministic-20261109
      - safety/visitor-flow-20261110
      - safety/frontend-validation-20261110
    paths:
      - 'safety_intelligence.py'
      - 'safety_utility.py'
      - 'safety_adapter.py'
      - 'safety_session.py'
      - 'main.py'
      - 'use_core.py'
      - 'tests/test_safety_first_turn_resource_handoff.py'
      - 'QA/V488_SAFETY_BOUNDARY_QA.py'
      - 'wordpress/living-archive-guide-v489.247-response-integrity.js'
      - 'wordpress/candidates/living-archive-guide-v489.313-safety-location-confirmation-candidate.js'
      - 'QA/test_frontend_safety_candidate.py'
      - '.github/workflows/safety-standalone-validation.yml'
  pull_request:
    paths:
      - 'safety_intelligence.py'
      - 'safety_utility.py'
      - 'safety_adapter.py'
      - 'main.py'
      - 'tests/test_safety_first_turn_resource_handoff.py'
      - 'QA/V488_SAFETY_BOUNDARY_QA.py'
      - '.github/workflows/safety-standalone-validation.yml'

permissions:
  contents: read

jobs:
  deterministic-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile safety and Guide modules
        run: python -m compileall -q safety_intelligence.py safety_utility.py safety_adapter.py safety_session.py use_core.py main.py

      - name: Deterministic safety boundary QA
        run: python QA/V488_SAFETY_BOUNDARY_QA.py

      - name: Safety state machine regression tests
        run: pytest -q tests/test_safety_first_turn_resource_handoff.py tests/test_safety_session.py QA/test_frontend_safety_candidate.py
