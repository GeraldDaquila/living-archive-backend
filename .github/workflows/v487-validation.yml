name: v487 production validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  v487-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP for recovered LAN fixture validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Recovered LAN subject-fit gate regression (synthetic fixture only)
        run: |
          php -l recovery/lan-subject-fit-repair/includes/class-lan-engine.php
          php -l recovery/lan-subject-fit-repair/tests/test_subject_fit_gate.php
          php recovery/lan-subject-fit-repair/tests/test_subject_fit_gate.php
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile current production modules
        run: >-
          python -m py_compile main.py use_core.py boundary_resilience.py provider_resilience.py provider_health_store.py provider_quota_control.py provider_bank.py shared_evidence.py shared_intelligence_primitives.py relationship_contribution.py relationship_adapter.py formation_contribution.py formation_adapter.py specialist_adapters.py specialist_registry.py QA/V487_91_DOORWAY_ADAPTER_QA.py QA/V487_91_DOORWAY_ADAPTER_TESTS.py QA/V487_92_JOURNEY_CONTRIBUTION_QA.py QA/V487_92_JOURNEY_CONTRIBUTION_TESTS.py QA/V489_84_HRN_PROVIDER_LANE_ARBITRATION_TESTS.py QA/V489_82_HRN_RELATIONAL_RETURN_QA.py QA/V489_102_HRN_ACTION_GUIDANCE_SURFACE_POLICY_QA.py
      - name: Guide hub contract tests
        run: PYTHONPATH=. python -m pytest -q tests/test_hub_contracts.py
      - name: Formation three-door contribution contract regression
        run: PYTHONPATH=. python -m pytest -q tests/test_formation_adapter_three_door_contract.py
      - name: Multi-concept topic-anchored recommendation regression
        run: PYTHONPATH=. python -m pytest -q tests/test_guide_topic_anchored_recommendation_fit.py
      - name: General Guide bounded provider-turn regression
        run: PYTHONPATH=. python -m pytest -q tests/test_general_guide_provider_budget.py
      - name: Shared provider health configuration diagnostics regression
        run: PYTHONPATH=. python -m pytest -q tests/test_provider_health_configuration_status.py tests/test_provider_health_readiness_endpoint.py
      - name: Provider quota-aware admission control regression
        run: PYTHONPATH=. python -m pytest -q tests/test_provider_quota_admission.py
      - name: Provider health persistence batching regression
        run: PYTHONPATH=. python -m pytest -q tests/test_provider_health_persistence_batching.py
      - name: HRN provider transport-health arbitration regression
        run: PYTHONPATH=. python -m pytest -q tests/test_hrn_provider_transport_health_priority.py
      - name: HRN uneven-effort natural-entry routing regression
        run: PYTHONPATH=. python -m pytest -q tests/test_hrn_reciprocity_routing.py
      - name: HRN perception independent fallback regression
        run: PYTHONPATH=. python -m pytest -q tests/test_hrn_perception_fallback.py
      - name: HRN explicit provider timeout regression
        run: PYTHONPATH=. python -m pytest -q tests/test_v489_118_hrn_free_tier_recovery.py
      - name: HRN bounded candidate fallback regression
        run: PYTHONPATH=. python -m pytest -q tests/test_v489_118_hrn_provider_budget_alignment.py
      - name: Ecosystem integration audit contract tests
        run: PYTHONPATH=. python -m pytest -q tests/test_ecosystem_integration_audit.py
      - name: Safety first-turn resource handoff regression
        run: PYTHONPATH=. python -m pytest -q tests/test_safety_first_turn_resource_handoff.py
      - name: v489.85 relational projection routing regression
        run: PYTHONPATH=. python -m pytest -q tests/test_v489_85_relational_projection_routing.py
      - name: v489.89 clustered relational topic-evidence regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_v489_89_relational_return_clustered_topic_evidence.py
      - name: v489.96 Gemini schema compatibility and HRN session isolation regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_v489_93_passive_friendship_boundary.py
      - name: v489.10 Guide request-boundary E2E regression
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          USE_LLM_PROVIDER_ORDER: ${{ vars.USE_LLM_PROVIDER_ORDER }}
        run: PYTHONPATH=. python -m pytest -q QA/V489_10_GUIDE_REQUEST_BOUNDARY_E2E.py
      - name: v489.94 bounded HRN provider budget and arbitration regression
        run: PYTHONPATH=. python QA/V489_84_HRN_PROVIDER_LANE_ARBITRATION_TESTS.py
      - name: v489.119 HRN provider budget and question-field contract regression
        run: PYTHONPATH=. python -m pytest -q tests/test_v489_118_hrn_free_tier_recovery.py tests/test_v489_118_hrn_provider_budget_alignment.py tests/test_v489_119_hrn_question_contract_prompt.py
      - name: v489.96 Gemini response-schema compatibility regression
        run: PYTHONPATH=. python QA/V489_96_GEMINI_SCHEMA_COMPATIBILITY_QA.py
      - name: v489.97 bounded provider HTTP timeout regression
        run: PYTHONPATH=. python QA/V489_97_PROVIDER_HTTP_TIMEOUT_QA.py
      - name: v489.98 HRN relational provider contract alignment regression
        run: PYTHONPATH=. python QA/V489_98_HRN_RELATIONAL_CONTRACT_ALIGNMENT_QA.py
      - name: v489.99 HRN contract completion and envelope regression
        run: PYTHONPATH=. python QA/V489_99_HRN_CONTRACT_COMPLETION_QA.py
      - name: v489.100 HRN question repair boundary regression
        run: PYTHONPATH=. python QA/V489_100_HRN_QUESTION_REPAIR_BOUNDARY_QA.py
      - name: v489.101 HRN surface-policy bank alignment QA
        run: PYTHONPATH=. python QA/V489_101_HRN_SURFACE_POLICY_BANK_ALIGNMENT_QA.py
      - name: v489.102 HRN action-guidance surface-policy QA
        run: PYTHONPATH=. python QA/V489_102_HRN_ACTION_GUIDANCE_SURFACE_POLICY_QA.py
      - name: v489.103 HRN internal-observer language regression QA
        run: PYTHONPATH=. python QA/V489_103_HRN_INTERNAL_OBSERVER_LANGUAGE_QA.py
      - name: v489.104 HRN relational communication return QA
        run: PYTHONPATH=. python QA/V489_104_HRN_RELATIONAL_COMMUNICATION_RETURN_QA.py
      - name: v489.89 clustered HRN relational-return structural QA
        run: PYTHONPATH=. python QA/V489_82_HRN_RELATIONAL_RETURN_QA.py
      - name: v487 protected-runtime compatibility validation
        run: python run_v387_authority_validation.py
      - name: v487.94 specialist-pipe integrity QA
        run: PYTHONPATH=. python QA/V487_94_SPECIALIST_PIPE_INTEGRITY_QA.py
      - name: v487.94 journey contribution structural QA
        run: PYTHONPATH=. python QA/V487_94_JOURNEY_CONTRIBUTION_QA.py
      - name: v487.92 journey contribution compatibility tests
        run: PYTHONPATH=. python QA/V487_92_JOURNEY_CONTRIBUTION_TESTS.py
      - name: v487.94 Formation specialist pipe QA
        run: PYTHONPATH=. python QA/V487_94_FORMATION_SPECIALIST_QA.py
      - name: post-Oct.1 pipe integrity QA
        run: PYTHONPATH=. python QA/V488_PIPE_INTEGRITY_QA.py
      - name: v488 sitewide safety boundary QA
        run: PYTHONPATH=. python QA/V488_SAFETY_BOUNDARY_QA.py
      - name: v488.77 provider-resilience structural QA
        run: PYTHONPATH=. python QA/V488_75_PROVIDER_BANK_QA.py
      - name: v488.77 boundary-resilience structural QA
        run: PYTHONPATH=. python QA/V488_77_BOUNDARY_RESILIENCE_QA.py
      - name: v487.89 specialist-pipe regression probes
        run: PYTHONPATH=. python QA/V487_89_SPECIALIST_PIPE_REGRESSION_TESTS.py
