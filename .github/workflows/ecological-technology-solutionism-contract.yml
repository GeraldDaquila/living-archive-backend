name: Ecological Technology-Solutionism Contract

on:
  pull_request:
    paths:
      - "deterministic_answer_recovery.py"
      - "general_guide_composition.py"
      - "tests/test_guide_systemwide_three_paragraph_default.py"
      - ".github/workflows/ecological-technology-solutionism-contract.yml"
  push:
    branches:
      - main
    paths:
      - "deterministic_answer_recovery.py"
      - "general_guide_composition.py"
      - "tests/test_guide_systemwide_three_paragraph_default.py"

jobs:
  ecological-technology-solutionism:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile changed Guide modules
        run: python -m compileall -q deterministic_answer_recovery.py general_guide_composition.py
      - name: Run ecological technology-solutionism regressions
        run: python -m pytest -q tests/test_guide_systemwide_three_paragraph_default.py -k technology_solutionism
