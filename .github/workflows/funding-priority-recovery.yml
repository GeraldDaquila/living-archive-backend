name: Funding priority bounded recovery regression

on:
  pull_request:
    paths:
      - "main.py"
      - "QA/V489_11_GUIDE_CONFLICT_RECOMMENDATION_FIT.py"
      - ".github/workflows/funding-priority-recovery.yml"
  workflow_dispatch:

jobs:
  funding-priority-recovery:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production entry point
        run: python -m py_compile main.py
      - name: Run funding-priority relevance and answer-recovery regressions
        run: python -m pytest -q QA/V489_11_GUIDE_CONFLICT_RECOMMENDATION_FIT.py
