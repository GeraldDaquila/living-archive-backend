name: Deterministic routing registry tests

on:
  pull_request:
    paths:
      - "deterministic_route_registry.py"
      - "tests/test_deterministic_route_registry.py"
      - ".github/workflows/deterministic-routing-tests.yml"
  push:
    branches:
      - "feat/deterministic-routing-registry"
    paths:
      - "deterministic_route_registry.py"
      - "tests/test_deterministic_route_registry.py"
      - ".github/workflows/deterministic-routing-tests.yml"

permissions:
  contents: read

jobs:
  deterministic-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run isolated registry tests
        run: python -m pytest -q tests/test_deterministic_route_registry.py
