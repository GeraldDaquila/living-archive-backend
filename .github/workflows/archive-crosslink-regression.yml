name: Archive meta-crosslink regression

on:
  pull_request:
    paths:
      - "archive_crosslink.py"
      - "scripts/audit_archive_crosslink_integrity.py"
      - "tests/test_archive_crosslink.py"
      - "tests/test_meta_crosslink_no_runtime_pinecone.py"
      - "tests/test_crosslink_territorial_integrity_audit.py"
      - "main.py"

permissions:
  contents: read

jobs:
  archive-crosslink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile crosslink and audit tools
        run: python -m py_compile archive_crosslink.py main.py scripts/audit_archive_crosslink_integrity.py tests/test_archive_crosslink.py tests/test_meta_crosslink_no_runtime_pinecone.py tests/test_crosslink_territorial_integrity_audit.py
      - name: Run crosslink and integrity-audit tests
        run: PYTHONPATH=. python -m pytest -q tests/test_archive_crosslink.py tests/test_meta_crosslink_no_runtime_pinecone.py tests/test_crosslink_territorial_integrity_audit.py
