name: Provider Bank Adaptive Architecture QA

on:
  push:
    branches:
      - provider-bank-test-calibration-20261108
  pull_request:
    branches:
      - main
    paths:
      - "provider_bank.py"
      - "provider_health_store.py"
      - "test_provider_bank_capacity_lifecycle.py"
      - "test_provider_bank_capacity_metrics.py"
      - "test_provider_recovery_contract.py"
      - "test_provider_response_preservation.py"
      - "test_server_capacity_contract.py"
      - "test_server_delegation_policy.py"
      - "test_server_delegation_resilience.py"
      - ".github/workflows/provider-bank-adaptive-qa.yml"

permissions:
  contents: read

jobs:
  provider-bank-adaptive-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest
      - name: Run adaptive provider-bank contract suite
        run: |
          pytest -q \
            test_server_capacity_contract.py \
            test_server_delegation_policy.py \
            test_server_delegation_resilience.py \
            test_provider_bank_capacity_metrics.py \
            test_provider_bank_capacity_lifecycle.py \
            test_provider_response_preservation.py \
            test_provider_recovery_contract.py
