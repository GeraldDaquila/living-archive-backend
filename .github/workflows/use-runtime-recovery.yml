name: USE Runtime Recovery Invariants

on:
  push:
    paths:
      - 'main.py'
      - 'use_core.py'
      - 'boundary_resilience.py'
      - 'visitor_failure_recovery.py'
      - 'tests/test_runtime_recovery_invariants.py'
      - 'tests/test_universal_visitor_failure_containment.py'
      - 'tests/test_lazy_embedding_model.py'
      - 'provider_bank.py'
      - 'tests/test_general_guide_provider_recovery_order.py'
  pull_request:
    paths:
      - 'main.py'
      - 'use_core.py'
      - 'boundary_resilience.py'
      - 'visitor_failure_recovery.py'
      - 'tests/test_runtime_recovery_invariants.py'
      - 'tests/test_universal_visitor_failure_containment.py'
      - 'tests/test_lazy_embedding_model.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run runtime identity and recovery invariants
        run: python -m unittest discover -s tests -p 'test_runtime_recovery_invariants.py' -v
      - name: Install visitor failure-containment test dependency
        run: python -m pip install pytest -r requirements.txt
      - name: Run lazy embedding initialization contract
        run: python -m pytest -q tests/test_lazy_embedding_model.py
      - name: Run universal visitor failure-containment contract
        run: python -m pytest -q tests/test_universal_visitor_failure_containment.py
      - name: Run Guide provider recovery ordering regression
        run: python -m pytest -q tests/test_general_guide_provider_recovery_order.py
      - name: Compile provider routing and visitor recovery modules
        run: python -m py_compile provider_bank.py main.py visitor_failure_recovery.py
      - name: Run complete repository test suite
        run: python -m pytest -q tests
