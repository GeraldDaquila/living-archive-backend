name: Guide entrusted stewardship regression

on:
  pull_request:
    paths:
      - "general_guide_composition.py"
      - "tests/test_guide_entrusted_stewardship_identification.py"
      - ".github/workflows/guide-entrusted-stewardship-regression.yml"
  push:
    branches: [main]
    paths:
      - "general_guide_composition.py"
      - "tests/test_guide_entrusted_stewardship_identification.py"
      - ".github/workflows/guide-entrusted-stewardship-regression.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Compile changed module and test
        run: python -m py_compile general_guide_composition.py tests/test_guide_entrusted_stewardship_identification.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_guide_entrusted_stewardship_identification.py
