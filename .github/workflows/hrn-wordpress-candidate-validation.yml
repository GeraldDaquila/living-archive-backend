name: HRN WordPress Candidate Validation

on:
  pull_request:
    paths:
      - "wordpress/hrn/**"
      - "recovery/hrn-provider-bridge-deadline-v1.2.1/**"
      - "recovery/hrn-provider-bridge-deadline-v1.2.2/**"
      - "QA/hrn_provider_bridge_deadline_recovery_test.php"
      - "QA/test_hrn_v05278_closure_evidence.py"
      - "QA/hrn_closure_evidence_runtime_test.php"
      - ".github/workflows/hrn-wordpress-candidate-validation.yml"
  push:
    branches:
      - "fix/hrn-v05278-closure-evidence"
      - "fix/hrn-natural-landing-local-recovery-v05279"
      - "fix/hrn-bridge-bounded-recovery-v1-2-1"
    paths:
      - "wordpress/hrn/**"
      - "recovery/hrn-provider-bridge-deadline-v1.2.1/**"
      - "QA/hrn_provider_bridge_deadline_recovery_test.php"
      - "QA/test_hrn_v05278_closure_evidence.py"
      - "QA/hrn_closure_evidence_runtime_test.php"
      - ".github/workflows/hrn-wordpress-candidate-validation.yml"

jobs:
  validate-hrn-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PHP syntax validation
        run: php -l wordpress/hrn/human-relational-navigator.php
      - name: Provider bridge deadline guard syntax validation
        run: php -l recovery/hrn-provider-bridge-deadline-v1.2.1/la-provider-bridge-deadline.php && php -l recovery/hrn-provider-bridge-deadline-v1.2.2/la-provider-bridge-deadline.php && php -l QA/hrn_provider_bridge_deadline_recovery_test.php
      - name: Provider bridge bounded recovery retry runtime test
        run: php QA/hrn_provider_bridge_deadline_recovery_test.php
      - name: HRN closure evidence contract tests
        run: python -m unittest QA.test_hrn_v05278_closure_evidence -v
      - name: Execute HRN closure evidence behavior tests
        run: php QA/hrn_closure_evidence_runtime_test.php
