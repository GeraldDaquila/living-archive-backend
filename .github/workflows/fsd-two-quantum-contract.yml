name: FSD Two-Quantum Contract
on:
  pull_request:
    paths:
      - "fsd_contract.py"
      - "test_fsd_contract.py"
      - "fsd_question_bank.py"
      - "fsd_runtime.py"
      - "test_fsd_runtime.py"
      - "provider_gateway_service.py"
      - "provider_bank.py"
      - "test_fsd_provider_operation.py"
      - "fsd_report_contract.py"
      - "test_fsd_report_contract.py"
      - "fsd_api.py"
      - "test_fsd_api.py"
      - "guide_runtime.py"
      - ".github/workflows/fsd-two-quantum-contract.yml"
  push:
    branches:
      - "feat/fsd-two-quantum-mvp"
    paths:
      - "fsd_contract.py"
      - "test_fsd_contract.py"
      - "fsd_question_bank.py"
      - "fsd_runtime.py"
      - "test_fsd_runtime.py"
      - "provider_gateway_service.py"
      - "provider_bank.py"
      - "test_fsd_provider_operation.py"
      - "fsd_report_contract.py"
      - "test_fsd_report_contract.py"
      - "fsd_api.py"
      - "test_fsd_api.py"
      - "guide_runtime.py"
      - ".github/workflows/fsd-two-quantum-contract.yml"
jobs:
  contract-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest fastapi httpx
      - name: Compile FSD contract
        run: python -m py_compile fsd_contract.py fsd_question_bank.py fsd_runtime.py fsd_report_contract.py fsd_api.py guide_runtime.py provider_gateway_service.py provider_bank.py
      - name: Run FSD contract regressions
        run: python -m pytest -q test_fsd_contract.py test_fsd_runtime.py test_fsd_provider_operation.py test_fsd_report_contract.py test_fsd_api.py
