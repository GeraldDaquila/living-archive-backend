name: USE v387 authority validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile main.py use_core.py run_v387_authority_validation.py tests/test_v387_secondary_pathway_relevance.py
      - name: Authority validation
        run: python run_v387_authority_validation.py
      - name: Regression test
        run: python -m pytest -q tests/test_v387_secondary_pathway_relevance.py
