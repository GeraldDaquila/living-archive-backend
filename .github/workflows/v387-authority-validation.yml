name: USE v487 production seam validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile current production modules
        run: python -m py_compile main.py use_core.py main_v487_28_runtime.py shared_evidence.py shared_intelligence_primitives.py QA/SHARED_PRIMITIVE_PRODUCTION_QA.py QA/SHARED_PRIMITIVE_PRODUCTION_TESTS.py QA/V487_87_SYNTHESIS_SEAM_QA.py QA/V487_87_SYNTHESIS_SEAM_TESTS.py
      - name: v487 protected-runtime compatibility validation
        run: python run_v387_authority_validation.py
      - name: v487.85 shared evidence seam QA
        run: python QA/SHARED_PRIMITIVE_PRODUCTION_QA.py
      - name: v487.85 shared evidence seam tests
        run: PYTHONPATH=. python QA/SHARED_PRIMITIVE_PRODUCTION_TESTS.py

      - name: v487.86 claim seam QA
        run: PYTHONPATH=. python QA/V487_86_CLAIM_SEAM_QA.py
      - name: v487.86 claim seam compatibility tests
        run: PYTHONPATH=. python QA/V487_86_CLAIM_SEAM_TESTS.py

      - name: v487.87 synthesis material seam QA
        run: PYTHONPATH=. python QA/V487_87_SYNTHESIS_SEAM_QA.py
      - name: v487.87 synthesis material seam compatibility tests
        run: PYTHONPATH=. python QA/V487_87_SYNTHESIS_SEAM_TESTS.py
