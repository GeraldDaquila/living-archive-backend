name: Apply USE v269 canonical chunk identity

on:
  push:
    paths:
      - '.github/workflows/apply_v269e.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply v269 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')

          # Require the known v268 production baseline before changing anything.
          required = [
              'APP_VERSION = "v268"',
              'DEPLOYMENT_FINGERPRINT = "USE-v268-canonical-publication-identity"',
              'CANONICAL_BUILD_ID = "USE-BUILD-v268-canonical-publication-identity"',
              'def _d20_content_self_identification',
              'def _function_targeted_candidate_search',
              'def _v268_canonical_publication_identity_self_audit',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('v269 baseline mismatch: ' + repr(missing))

          s = s.replace('APP_VERSION = "v268"', 'APP_VERSION = "v269"', 1)
          s = s.replace('DEPLOYMENT_FINGERPRINT = "USE-v268-canonical-publication-identity"', 'DEPLOYMENT_FINGERPRINT = "USE-v269-canonical-chunk-publication-identity"', 1)
          s = s.replace('CANONICAL_BUILD_ID = "USE-BUILD-v268-canonical-publication-identity"', 'CANONICAL_BUILD_ID = "USE-BUILD-v269-canonical-chunk-publication-identity"', 1)

          # D20: explicit publication phrase wins over generic Cornerstone identity.
          fn = s.index('def _d20_content_self_identification')
          a = s.index('    content_patterns = (', fn)
          b = s.index('    )\n    for pattern, resource_type', a) + len('    )\n')
          bs = chr(92)
          patterns = (
              '    content_patterns = (\n'
              f'        (r"{bs}bcornerstone{bs}s+essay(?:{bs}s+series)?{bs}b", "Essay"),\n'
              f'        (r"{bs}bfoundational{bs}s+essay(?:s)?{bs}b", "Essay"),\n'
              f'        (r"{bs}b(?:this|the) living archive navigator{bs}b", "Navigator"),\n'
              f'        (r"{bs}b(?:this|the) reference map{bs}b", "Reference Map"),\n'
              f'        (r"{bs}b(?:this|the) guided reading pathway{bs}b", "Pathway"),\n'
              f'        (r"{bs}b(?:this|the) knowledge hub{bs}b", "Knowledge Hub"),\n'
              f'        (r"{bs}b(?:this|the) cornerstone(?: hub)?{bs}b", "Cornerstone"),\n'
              f'        (r"{bs}b(?:this|the) learning arc{bs}b", "Learning Arc"),\n'
              f'        (r"{bs}b(?:this|the) case study{bs}b", "Case"),\n'
              f'        (r"{bs}b(?:this|the) essay{bs}b", "Essay"),\n'
              '    )\n'
          )
          s = s[:a] + patterns + s[b:]

          # Exact canonical URL sibling lookup: publication identity can live on another chunk.
          marker = 'def _v268_canonical_publication_identity_self_audit() -> None:\n'
          helper = '''def _v269_resolve_canonical_type_across_chunks(metadata, vector, required_type):
    """Resolve explicit publication identity from sibling chunks of one canonical URL."""
    if not required_type or not isinstance(metadata, dict) or not index:
        return None
    url = str(metadata.get("url", "") or "").strip().rstrip("/")
    if not url or not vector:
        return None
    try:
        result = index.query(
            vector=vector,
            top_k=32,
            include_metadata=True,
            filter={"url": {"$eq": url}},
        )
        matches = result.get("matches", []) if hasattr(result, "get") else getattr(result, "matches", [])
    except Exception as exc:
        print(f"USE v269 canonical chunk identity lookup error: {exc}")
        return None
    for match in matches or []:
        sibling = _match_metadata(match)
        if not isinstance(sibling, dict):
            continue
        recognized = _recognize_resource_type(sibling)
        if recognized.get("resource_type") != required_type:
            continue
        merged = dict(metadata)
        merged["_use_resource_type_recognition"] = dict(recognized)
        merged["_use_canonical_chunk_identity"] = {
            "source": "v269_exact_canonical_url_sibling_chunk",
            "url": url,
            "evidence_chunk_index": sibling.get("chunk_index"),
        }
        print(
            "USE v269 canonical chunk publication identity: "
            f"resolved type={required_type!r}, title={metadata.get('title')!r}, "
            f"url={url!r}, evidence_chunk_index={sibling.get('chunk_index')!r}."
        )
        return merged
    return None


'''
          if marker not in s:
              raise SystemExit('v269 audit marker missing')
          s = s.replace(marker, helper + marker, 1)

          # Replace only the explicit D20 gate inside function-targeted retrieval.
          start = s.index('def _function_targeted_candidate_search')
          gate = s.index('                if required_type:', start)
          gate_end = s.index('                print(', gate)
          replacement = '''                if required_type:
                    recognized = _recognize_resource_type(metadata)
                    if recognized.get("resource_type") != required_type:
                        resolved = _v269_resolve_canonical_type_across_chunks(
                            metadata, vector, required_type
                        )
                        if resolved is None:
                            rejected_for_type += 1
                            continue
                        metadata = resolved
                    else:
                        metadata = dict(metadata)
                        metadata["_use_resource_type_recognition"] = dict(recognized)
                    metadata = dict(metadata)
                    metadata["_use_explicit_type_selection_identity"] = {
                        "requested_type": required_type,
                        "source": "D20_type_constrained_function_retrieval",
                    }

'''
          s = s[:gate] + replacement + s[gate_end:]

          # Add a deterministic sibling-chunk audit before the existing v268 audit.
          audit = '''def _v269_canonical_chunk_publication_identity_self_audit() -> None:
    """Verify exact canonical-URL sibling lookup can recover explicit type identity."""
    chunks = [
        {"title": "T", "url": "https://example.invalid/chunked", "chunk_index": 1, "text": "Topic only."},
        {"title": "T", "url": "https://example.invalid/chunked", "chunk_index": 7, "text": "This essay forms part of the Cornerstone Essay Series."},
    ]
    class _ProbeIndex:
        def query(self, **kwargs):
            assert kwargs.get("filter") == {"url": {"$eq": "https://example.invalid/chunked"}}
            return {"matches": [{"metadata": x} for x in chunks]}
    old_index = globals().get("index")
    try:
        globals()["index"] = _ProbeIndex()
        resolved = _v269_resolve_canonical_type_across_chunks(chunks[0], [0.0], "Essay")
        assert resolved is not None
        assert resolved["_use_canonical_chunk_identity"]["evidence_chunk_index"] == 7
    finally:
        globals()["index"] = old_index
    print("USE v269 CANONICAL CHUNK PUBLICATION IDENTITY AUDIT: PASS")


'''
          s = s.replace(marker, audit + marker, 1)

          # Rename the existing audit only as a version label; preserve its body.
          s = s.replace('def _v268_canonical_publication_identity_self_audit() -> None:', 'def _v269_canonical_publication_identity_self_audit() -> None:', 1)
          s = s.replace('USE v268 CANONICAL PUBLICATION IDENTITY AUDIT:', 'USE v269 CANONICAL PUBLICATION IDENTITY AUDIT:', 1)

          # Recompute the canonical payload hash with the identity block normalized out.
          identity_re = re.compile(
              r'(?ms)^# === CANONICAL BUILD IDENTITY \(excluded from payload hash\) ===\n.*?^# === END CANONICAL BUILD IDENTITY ===\n?'
          )
          normalized, count = identity_re.subn(
              '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'v269 identity block count={count}')
          payload = hashlib.sha256(normalized.encode('utf-8')).hexdigest()
          s = re.sub(r'CANONICAL_BUILD_PAYLOAD_SHA256 = "[0-9a-f]+"', f'CANONICAL_BUILD_PAYLOAD_SHA256 = "{payload}"', s, count=1)

          # Static syntax check before writing.
          compile(s, 'main.py', 'exec')
          p.write_text(s, encoding='utf-8')
          print('v269 payload sha:', payload)
          print('v269 raw sha:', hashlib.sha256(s.encode('utf-8')).hexdigest())
          PY

      - name: Verify and commit
        run: |
          python -m py_compile main.py
          git diff --check
          git status --short
          git add main.py
          git commit -m "USE v269 canonical chunk publication identity"
          git push
