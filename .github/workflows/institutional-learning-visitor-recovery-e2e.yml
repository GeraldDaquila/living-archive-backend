name: Institutional Learning Visitor Recovery E2E

on:
  push:
    branches: [fix/institutional-learning-transport-recovery-20261121]
  pull_request:
    branches: [main]
    paths:
      - "institutional_learning_failure_contract.py"
      - "gold_star_response_floor.py"
      - "tests/test_institutional_learning_failure_contract.py"
      - "QA/guide_woody_mocked_ui_continuity_e2e.mjs"
      - ".github/workflows/institutional-learning-visitor-recovery-e2e.yml"

permissions:
  contents: read

concurrency:
  group: institutional-learning-visitor-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed backend contracts
        run: python -m py_compile main.py institutional_learning_failure_contract.py gold_star_response_floor.py
      - name: Exercise provider and Gold Star floor recovery end to end at the shared contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_institutional_learning_failure_contract.py \
            tests/test_gold_star_response_floor.py \
            tests/test_gold_star_semantic_contract.py

  visitor-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verify visitor answer, doorway, and conversation continuity
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 100s node QA/guide_woody_mocked_ui_continuity_e2e.mjs
