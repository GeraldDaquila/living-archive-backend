name: Guide Simple Systemic Explanation Gold Star QA

on:
  push:
    branches: [gold-star-systemic-explanation-accessibility-reconciled-20261120, fix/institutional-learning-first-response-20261121, fix/institutional-learning-transport-recovery-20261121]
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "simple_systemic_explanation_contract.py"
      - "institutional_learning_failure_contract.py"
      - "gold_star_semantic_contract.py"
      - "gold_star_question_contract.py"
      - "gold_star_response_floor.py"
      - "tests/test_simple_systemic_explanation_contract.py"
      - "tests/test_institutional_learning_failure_contract.py"
      - "tests/test_gold_star_semantic_contract.py"
      - "tests/test_gold_star_response_floor.py"
      - "tests/test_gold_star_question_contract.py"
      - "tests/test_gold_star_answer_envelope.py"
      - ".github/workflows/guide-simple-systemic-explanation-gold-star-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemic-explanation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile runtime units
        run: python -m py_compile main.py simple_systemic_explanation_contract.py institutional_learning_failure_contract.py gold_star_semantic_contract.py gold_star_question_contract.py gold_star_response_floor.py
      - name: Run focused contract tests
        run: PYTHONPATH=. python -m pytest -q tests/test_simple_systemic_explanation_contract.py tests/test_institutional_learning_failure_contract.py tests/test_gold_star_semantic_contract.py tests/test_gold_star_response_floor.py tests/test_gold_star_question_contract.py tests/test_gold_star_answer_envelope.py
