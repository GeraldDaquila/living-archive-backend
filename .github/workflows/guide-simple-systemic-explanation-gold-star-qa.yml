name: Guide Simple Systemic Explanation Gold Star QA

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "simple_systemic_explanation_contract.py"
      - "tests/test_simple_systemic_explanation_contract.py"
      - ".github/workflows/guide-simple-systemic-explanation-gold-star-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemic-explanation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile runtime units
        run: python -m py_compile main.py simple_systemic_explanation_contract.py
      - name: Run focused contract tests
        run: PYTHONPATH=. python -m pytest -q tests/test_simple_systemic_explanation_contract.py
