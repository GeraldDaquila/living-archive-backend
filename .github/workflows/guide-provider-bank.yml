name: General Guide provider-bank regression

on:
  pull_request:
    paths:
      - "provider_bank.py"
      - "main.py"
      - "tests/test_general_guide_provider_budget.py"
      - ".github/workflows/guide-provider-bank.yml"
  push:
    branches:
      - main
    paths:
      - "provider_bank.py"
      - "main.py"
      - "tests/test_general_guide_provider_budget.py"
      - ".github/workflows/guide-provider-bank.yml"

jobs:
  general-guide-provider-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile runtime and provider bank
        run: python -m py_compile main.py provider_bank.py
      - name: Test bounded Guide provider arbitration
        run: PYTHONPATH=. python -m pytest -q tests/test_general_guide_provider_budget.py
