name: General Guide provider-bank regression

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "provider_bank.py"
      - "general_guide_composition.py"
      - "tests/test_general_guide_response_shape_diagnostics.py"
      - "main.py"
      - "tests/test_general_guide_provider_budget.py"
      - "tests/test_active_active_server_routing.py"
      - "tests/test_v489_118_hrn_provider_budget_alignment.py"
      - "tests/test_provider_capacity_diagnostics.py"
      - "tests/test_provider_capacity_readiness_endpoint.py"
      - "tests/test_provider_error_redaction.py"
      - "tests/test_nvidia_model_aliases.py"
      - ".github/workflows/guide-provider-bank.yml"
  push:
    branches:
      - main
    paths:
      - "provider_bank.py"
      - "main.py"
      - "tests/test_general_guide_provider_budget.py"
      - "tests/test_active_active_server_routing.py"
      - "tests/test_v489_118_hrn_provider_budget_alignment.py"
      - "tests/test_provider_error_redaction.py"
      - ".github/workflows/guide-provider-bank.yml"

jobs:
  general-guide-provider-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      USE_PROVIDER_BANK_MAX_ATTEMPTS: "2"
      USE_GUIDE_EVALUATION_PROVIDER_ORDER: "groq,openrouter,gemini"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile runtime and provider bank
        run: python -m py_compile main.py provider_bank.py
      - name: Test bounded Guide provider arbitration
        run: PYTHONPATH=. python -m pytest -q tests/test_general_guide_provider_budget.py tests/test_active_active_server_routing.py tests/test_v489_118_hrn_provider_budget_alignment.py tests/test_provider_capacity_diagnostics.py tests/test_provider_capacity_readiness_endpoint.py tests/test_provider_error_redaction.py tests/test_nvidia_model_aliases.py tests/test_provider_bank_groq_empty_response_diagnostics.py tests/test_general_guide_response_shape_diagnostics.py
      - name: Run pinned same-provider Gold Star control/treatment capture
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/gold-star-matched-pair-runner-20261123' }}
        run: >-
          python scripts/capture_gold_star_matched_pairs.py
          --provider groq
          --model openai/gpt-oss-120b
          --provider-timeout-seconds 10
          --inter-call-delay-seconds 65
          --output-dir artifacts/gold-star-matched-pairs
      - name: Upload blind Gold Star review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-star-blind-review-${{ github.run_id }}
          path: artifacts/gold-star-matched-pairs/blind-review-package.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload Gold Star evidence and unblinding key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-star-unblinding-evidence-${{ github.run_id }}
          path: |
            artifacts/gold-star-matched-pairs/matched-pair-evidence.json
            artifacts/gold-star-matched-pairs/unblinding-key.json
            artifacts/gold-star-matched-pairs/paired-evaluation-template.json
          if-no-files-found: warn
          retention-days: 90
