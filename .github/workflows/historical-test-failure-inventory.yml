name: Historical test failure inventory

on:
  pull_request:
    paths:
      - "tests/**"
      - "*.py"
      - "requirements.txt"
      - "scripts/summarize_pytest_junit.py"
      - "docs/testing/HISTORICAL_FAILURE_ARCHIVE.md"
      - ".github/workflows/historical-test-failure-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite-inventory:
    name: Full-suite diagnostic (non-blocking inventory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run full pytest diagnostic
        id: pytest
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest-junit.xml
      - name: Build exact failure-node inventory
        if: always()
        run: |
          if [ -f artifacts/pytest-junit.xml ]; then
            python scripts/summarize_pytest_junit.py artifacts/pytest-junit.xml --output artifacts/failure-inventory.md
          else
            printf '# Pytest diagnostic inventory\n\nNo JUnit report was produced; inspect the pytest step logs.\n' > artifacts/failure-inventory.md
          fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-test-failure-inventory
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
