name: Guide system concept before FSD regression

on:
  pull_request:
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "tests/test_guide_system_concept_before_fsd.py"
      - ".github/workflows/guide-system-concept-before-fsd.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "tests/test_guide_system_concept_before_fsd.py"
      - ".github/workflows/guide-system-concept-before-fsd.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pytest
      - run: python -m py_compile main.py general_guide_composition.py tests/test_guide_system_concept_before_fsd.py
      - run: python -m pytest -q tests/test_guide_system_concept_before_fsd.py
