name: Guide method-comparison regression

on:
  pull_request:
    paths:
      - "general_guide_composition.py"
      - "tests/test_guide_method_comparison_contract.py"
      - ".github/workflows/guide-method-comparison-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-comparison-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Guide composition module
        run: python -m py_compile general_guide_composition.py
      - name: Run method-comparison regression tests
        run: python -m pytest -q tests/test_guide_method_comparison_contract.py
