name: Guide Bounded Relational Uncertainty Recovery
on:
  pull_request:
    paths:
      - "main.py"
      - "test_guide_bounded_relational_uncertainty_recovery.py"
      - ".github/workflows/guide-bounded-relational-uncertainty-recovery.yml"
  push:
    branches:
      - "fix/deterministic-bounded-relational-uncertainty"
    paths:
      - "main.py"
      - "test_guide_bounded_relational_uncertainty_recovery.py"
      - ".github/workflows/guide-bounded-relational-uncertainty-recovery.yml"
jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Compile production Guide runtime
        run: python -m py_compile main.py
      - name: Run bounded relational uncertainty regressions
        run: python -m pytest -q test_guide_bounded_relational_uncertainty_recovery.py
