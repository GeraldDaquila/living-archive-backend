name: Provider Health Bridge v2 Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "QA/provider_health_bridge_v2_candidate.php"
      - "QA/test_provider_health_bridge_v2.php"
      - "QA/provider_health_v2_ephemeral_wp_plugin.php"
      - "QA/test_provider_health_bridge_v2_wp_rest.php"
      - "QA/test_provider_health_python_wordpress_integration.py"
      - "QA/provider_health_merge_fixtures_v2.json"
      - ".github/workflows/provider-health-bridge-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: provider_health_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      wordpress:
        image: wordpress:7.1.4-php8.4-apache
        env:
          WORDPRESS_DB_HOST: mariadb:3306
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: root
          WORDPRESS_DB_NAME: provider_health_test
          WORDPRESS_TABLE_PREFIX: wp_
        ports:
          - 8080:80
    env:
      PROVIDER_HEALTH_MARIADB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=provider_health_test;charset=utf8mb4"
      PROVIDER_HEALTH_MARIADB_USER: root
      PROVIDER_HEALTH_MARIADB_PASSWORD: root
      PROVIDER_HEALTH_WP_BASE_URL: "http://127.0.0.1:8080"
      PROVIDER_HEALTH_WP_SECRET: "provider-health-v2-ephemeral-ci-only-secret"
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4"]
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: pdo_mysql, curl
      - name: PHP syntax checks
        run: |
          php -l QA/provider_health_bridge_v2_candidate.php
          php -l QA/test_provider_health_bridge_v2.php
          php -l QA/provider_health_v2_ephemeral_wp_plugin.php
          php -l QA/test_provider_health_bridge_v2_wp_rest.php
      - name: Run WordPress bridge contract and MariaDB 11.8 integration harness
        run: php QA/test_provider_health_bridge_v2.php
      - name: Install isolated WordPress 7.1.4 and candidate plugin
        run: |
          WP_CONTAINER=$(docker ps --filter "ancestor=wordpress:7.1.4-php8.4-apache" -q | head -n 1)
          test -n "$WP_CONTAINER"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/wp-admin/install.php >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/wp-admin/install.php >/dev/null
          curl -fsSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker cp /tmp/wp-cli.phar "$WP_CONTAINER":/tmp/wp-cli.phar
          docker exec "$WP_CONTAINER" mkdir -p /var/www/html/wp-content/plugins/provider-health-v2-test
          docker cp QA/provider_health_bridge_v2_candidate.php "$WP_CONTAINER":/var/www/html/wp-content/plugins/provider-health-v2-test/provider_health_bridge_v2_candidate.php
          docker cp QA/provider_health_v2_ephemeral_wp_plugin.php "$WP_CONTAINER":/var/www/html/wp-content/plugins/provider-health-v2-test/provider-health-v2-test.php
          docker exec "$WP_CONTAINER" php /tmp/wp-cli.phar --allow-root --path=/var/www/html core install --url=http://127.0.0.1:8080 --title="Provider Health v2 CI" --admin_user=ci --admin_password=ci-only-password --admin_email=ci@example.test --skip-email
          docker exec "$WP_CONTAINER" php /tmp/wp-cli.phar --allow-root --path=/var/www/html plugin activate provider-health-v2-test
      - name: Run real WordPress REST integration
        run: php QA/test_provider_health_bridge_v2_wp_rest.php
      - name: Set up Python for cross-process client integration
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python v2 client across independent WordPress-backed processes
        run: |
          python QA/test_provider_health_python_wordpress_integration.py write
          python QA/test_provider_health_python_wordpress_integration.py update
          python QA/test_provider_health_python_wordpress_integration.py read
