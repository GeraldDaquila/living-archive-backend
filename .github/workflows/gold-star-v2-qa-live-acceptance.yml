name: Gold Star v2 Standalone QA live visitor capture

on:
  push:
    branches:
      - gold-star-v2-complete-architecture
    paths:
      - "scripts/capture_gold_star_wp3_pairs.py"
      - ".github/workflows/gold-star-v2-qa-live-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-qa-live-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install candidate dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify candidate identity and run bounded QA visitor capture
        env:
          PYTHONPATH: .
          WP3_CAPTURE_BASE_URL: https://living-archive-gold-star-v2-qa.onrender.com
        run: |
          python scripts/capture_gold_star_wp3_pairs.py \
            --base-url "$WP3_CAPTURE_BASE_URL" \
            --min-llm-captures 0 \
            --delay-seconds 1 \
            --output artifacts/gold-star-v2-standalone-qa-paired-capture.json
      - name: Upload QA capture report, including failed or incomplete captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-star-v2-standalone-qa-paired-capture
          path: artifacts/gold-star-v2-standalone-qa-paired-capture.json
          if-no-files-found: warn
          retention-days: 90
