name: Guide provider-exhaustion regression

on:
  pull_request:
    paths:
      - "main.py"
      - "tests/test_gold_star_visitor_boundary.py"
      - ".github/workflows/guide-provider-exhaustion.yml"
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "tests/test_gold_star_visitor_boundary.py"
      - ".github/workflows/guide-provider-exhaustion.yml"

permissions:
  contents: read

jobs:
  provider-exhaustion-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile changed runtime module
        run: python -m py_compile main.py
      - name: Run provider-exhaustion regression tests
        run: python -m pytest -q tests/test_gold_star_visitor_boundary.py -k "provider_exhaustion"
