name: Assemble USE v334 clean engine

on:
  push:
    branches:
      - v334-clean-engine-action

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for final marker
        id: marker
        run: |
          if [ ! -f .v334-final-marker ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Assemble and promote clean v334
        if: steps.marker.outputs.ready == 'true'
        env:
          EXPECTED_SHA: 6b2a32776045fbb369df66b585aadfd9fdb56eb12736205590f47bb9c41d21d7
        run: |
          set -euo pipefail
          cat .v334-payload/payload_01.txt \
              .v334-payload/payload_02.txt \
              .v334-payload/payload_03.txt \
              .v334-payload/payload_04.txt \
              .v334-payload/payload_05.txt \
              .v334-payload/payload_06.txt \
              .v334-payload/payload_07.txt > /tmp/v334.b64
          base64 -d /tmp/v334.b64 | gzip -d > main.py
          actual="$(sha256sum main.py | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA"
          python -m py_compile main.py
          rm -rf .v334-payload .v334-final-marker
          git rm .github/workflows/assemble-v334.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'USE PRODUCTION VERSION: v334 — clean full-engine compassionate boundary'
          git push origin "$GITHUB_REF_NAME"
