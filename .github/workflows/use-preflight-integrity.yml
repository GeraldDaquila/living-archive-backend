name: USE Preflight Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/gold_standard_registry.json'
      - 'docs/qa/gold_star_qualitative_transfer_review.json'
      - 'gold_star_lessons.py'
      - 'scripts/validate_gold_star_registry.py'
      - 'tests/test_gold_star_lessons.py'
      - 'tests/test_gold_star_qualitative_transfer_review.py'
      - '.github/workflows/use-preflight-integrity.yml'
      - 'main.py'
      - 'gold_star_response_floor.py'
      - 'tests/test_gold_star_response_floor.py'
      - 'QA/AI_ROLE_DISTINCTION_DOORWAY_BOUNDARY_TESTS.py'
  push:
    branches: [main]
    paths:
      - 'docs/qa/gold_standard_registry.json'
      - 'docs/qa/gold_star_qualitative_transfer_review.json'
      - 'gold_star_lessons.py'
      - 'scripts/validate_gold_star_registry.py'
      - 'tests/test_gold_star_lessons.py'
      - 'tests/test_gold_star_qualitative_transfer_review.py'
      - '.github/workflows/use-preflight-integrity.yml'

jobs:
  gold-star-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gold Star test dependencies
        run: python -m pip install --upgrade pytest
      - name: Validate canonical Gold Star registry and immutable numbering
        run: python scripts/validate_gold_star_registry.py
      - name: Compile Gold Star runtime
        run: python -m py_compile gold_star_lessons.py
      - name: Run Gold Star runtime and registry-governance regressions
        run: python -m pytest -q tests/test_gold_star_lessons.py tests/test_gold_star_qualitative_transfer_review.py
      - name: Install USE runtime dependencies for changed boundary checks
        run: python -m pip install -r requirements.txt
      - name: Compile production runtime
        run: python -m py_compile main.py
      - name: Run AI role doorway boundary regression
        run: python -m pytest -q QA/AI_ROLE_DISTINCTION_DOORWAY_BOUNDARY_TESTS.py
      - name: Run Gold Star v2 source-independent response-floor tests
        run: python -m pytest -q tests/test_gold_star_response_floor.py tests/test_gold_star_adaptive_intelligence_v2.py
