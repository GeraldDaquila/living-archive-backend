name: Gold Star Semantic Contract Tests

on:
  pull_request:
    paths:
      - "gold_star_semantic_contract.py"
      - "scripts/gold_star_paired_offline_evaluation.py"
      - "tests/test_gold_star_semantic_contract.py"
      - "tests/test_gold_star_paired_offline_evaluation.py"
      - "tests/test_gold_star_paired_fixture_template.py"
      - "docs/qa/gold_star_paired_fixture_template.json"
      - ".github/workflows/gold-star-semantic-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused Gold Star tests
        run: python -m pytest -q tests/test_gold_star_semantic_contract.py tests/test_gold_star_paired_offline_evaluation.py tests/test_gold_star_paired_fixture_template.py
