name: Guide resource discovery evidence
on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "tests/test_guide_resource_discovery_evidence.py"
      - "tests/test_guide_discovery_source_cleanup.py"
      - ".github/workflows/guide-resource-discovery-evidence.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "tests/test_guide_resource_discovery_evidence.py"
      - ".github/workflows/guide-resource-discovery-evidence.yml"

permissions:
  contents: read

jobs:
  resource-discovery-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Guide runtime
        run: python -m py_compile main.py general_guide_composition.py
      - name: Run resource-discovery evidence regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_guide_resource_discovery_evidence.py tests/test_guide_discovery_source_cleanup.py tests/test_guide_topic_anchored_recommendation_fit.py tests/test_general_guide_preference_clarification.py tests/test_general_guide_perception_contract.py
