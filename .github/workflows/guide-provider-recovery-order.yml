name: Guide Provider Recovery Ordering

on:
  pull_request:
    paths:
      - 'provider_bank.py'
      - 'tests/test_general_guide_provider_recovery_order.py'
      - '.github/workflows/guide-provider-recovery-order.yml'
  push:
    branches: [main]
    paths:
      - 'provider_bank.py'
      - 'tests/test_general_guide_provider_recovery_order.py'
      - '.github/workflows/guide-provider-recovery-order.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-provider-recovery-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest -r requirements.txt
      - name: Run focused Guide provider-order regressions
        run: python -m pytest -q tests/test_general_guide_provider_recovery_order.py
      - name: Compile provider routing module
        run: python -m py_compile provider_bank.py
      - name: Run complete repository test suite
        run: python -m pytest -q tests
