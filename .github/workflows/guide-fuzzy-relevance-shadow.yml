name: Guide Fuzzy Relevance Shadow
on:
  pull_request:
    paths:
      - "guide_fuzzy_relevance.py"
      - "tests/test_guide_fuzzy_relevance_shadow.py"
      - "tests/test_guide_fuzzy_relevance_balanced_evaluation.py"
      - "tests/test_guide_fuzzy_relevance_heldout_paraphrases.py"
      - "tests/test_guide_fuzzy_relevance_simulated_question_battery.py"
      - "tests/test_guide_fuzzy_relevance_independent_challenge_set.py"
      - "tests/test_guide_fuzzy_shadow_visitor_boundary.py"
      - "tests/fixtures/guide_fuzzy_relevance_balanced_evaluation.json"
      - "tests/fixtures/guide_fuzzy_relevance_heldout_paraphrases.json"
      - "tests/fixtures/guide_fuzzy_relevance_simulated_question_battery.json"
      - "tests/fixtures/guide_fuzzy_relevance_independent_challenge_set.json"
      - ".github/workflows/guide-fuzzy-relevance-shadow.yml"
  push:
    branches: [main]
    paths:
      - "guide_fuzzy_relevance.py"
      - "tests/test_guide_fuzzy_relevance_shadow.py"
      - "tests/test_guide_fuzzy_relevance_balanced_evaluation.py"
      - "tests/test_guide_fuzzy_relevance_heldout_paraphrases.py"
      - "tests/test_guide_fuzzy_relevance_simulated_question_battery.py"
      - "tests/test_guide_fuzzy_relevance_independent_challenge_set.py"
      - "tests/test_guide_fuzzy_shadow_visitor_boundary.py"
      - "tests/fixtures/guide_fuzzy_relevance_balanced_evaluation.json"
      - "tests/fixtures/guide_fuzzy_relevance_heldout_paraphrases.json"
      - "tests/fixtures/guide_fuzzy_relevance_simulated_question_battery.json"
      - "tests/fixtures/guide_fuzzy_relevance_independent_challenge_set.json"
      - ".github/workflows/guide-fuzzy-relevance-shadow.yml"
jobs:
  fuzzy-relevance-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test fuzzy relevance shadow scorer, boundary, and evaluations
        run: python -m pytest -q -s tests/test_guide_fuzzy_relevance_shadow.py tests/test_guide_fuzzy_relevance_balanced_evaluation.py tests/test_guide_fuzzy_relevance_heldout_paraphrases.py tests/test_guide_fuzzy_relevance_simulated_question_battery.py tests/test_guide_fuzzy_relevance_independent_challenge_set.py tests/test_guide_fuzzy_shadow_visitor_boundary.py
