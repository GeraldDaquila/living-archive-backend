name: Guide Fuzzy Shadow Observability
on:
  pull_request:
    paths:
      - "main.py"
      - "guide_fuzzy_shadow_observer.py"
      - "tests/test_guide_fuzzy_shadow_observer.py"
      - ".github/workflows/guide-fuzzy-shadow-observability.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "guide_fuzzy_shadow_observer.py"
      - "tests/test_guide_fuzzy_shadow_observer.py"
      - ".github/workflows/guide-fuzzy-shadow-observability.yml"
jobs:
  shadow-observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test fuzzy shadow observer and scorer
        run: python -m pytest -q tests/test_guide_fuzzy_shadow_observer.py tests/test_guide_fuzzy_relevance_shadow.py tests/test_guide_fuzzy_relevance_balanced_evaluation.py tests/test_guide_fuzzy_relevance_heldout_paraphrases.py tests/test_guide_fuzzy_relevance_simulated_question_battery.py tests/test_guide_fuzzy_relevance_independent_challenge_set.py
