name: Practical stewardship routing regression

on:
  pull_request:
    paths:
      - "main.py"
      - "QA/V489_12_GUIDE_STEWARDSHIP_PRACTICE_ROUTING.py"
      - ".github/workflows/stewardship-practice-routing.yml"
  workflow_dispatch:

jobs:
  stewardship-practice-routing:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production entry point
        run: python -m py_compile main.py
      - name: Run routing regressions
        run: python -m pytest -q QA/V489_12_GUIDE_STEWARDSHIP_PRACTICE_ROUTING.py
