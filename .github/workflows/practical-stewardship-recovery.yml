name: Practical stewardship provider-exhaustion recovery

on:
  pull_request:
    paths:
      - "main.py"
      - "QA/V489_13_GUIDE_PRACTICAL_STEWARDSHIP_RECOVERY.py"
      - ".github/workflows/practical-stewardship-recovery.yml"
  workflow_dispatch:

jobs:
  practical-stewardship-recovery:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production entry point
        run: python -m py_compile main.py
      - name: Run provider-exhaustion regressions
        run: python -m pytest -q QA/V489_13_GUIDE_PRACTICAL_STEWARDSHIP_RECOVERY.py QA/V489_12_GUIDE_STEWARDSHIP_PRACTICE_ROUTING.py
