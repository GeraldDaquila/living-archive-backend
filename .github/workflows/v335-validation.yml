name: v335 validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - exp/v335-compact-response-contract

jobs:
  v335-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v335 provider envelope
        run: python run_v335_validation.py

      - name: Compile production modules
        run: python -m compileall -q main.py use_core.py tests

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run v335 regression probes
        run: python -m pytest -q tests/test_v335_response_contract.py tests/test_v335_budget_contract.py

      - name: Smoke test deployed production endpoint
        env:
          PROD_URL: https://living-archive-backend.onrender.com
        run: |
          python - <<'PY'
          import json, os, subprocess
          url = os.environ["PROD_URL"] + "/api/query"
          query = "What advise or essay from the Living Archive that you can recommend for someone who is grieving from the death of a loved one?"
          raw = subprocess.check_output([
              "curl", "-sS", "--fail-with-body", "--max-time", "60",
              "-H", "Content-Type: application/json",
              "-d", json.dumps({"query": query}),
              url,
          ], text=True)
          data = json.loads(raw)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          assert data.get("ok") is True, data
          assert data.get("version") == "v335", data
          answer = str(data.get("response") or "")
          assert answer.strip(), data
          assert "The Transformative Power of Loss: Finding Meaning in Grief Through Spiritual and Scientific Wisdom" in answer, data
          lower = answer.casefold()
          assert "please try again" not in lower, data
          assert "provider" not in lower, data
          assert "retriev" not in lower, data
          print("V335 PRODUCTION SMOKE TEST: PASS")
          PY
