name: Live Guide Upper Entryway E2E

on:
  push:
    branches: [qa/live-guide-wordpress-browser-e2e]
    paths:
      - "QA/live_guide_upper_entryway_e2e.mjs"
      - ".github/workflows/live-guide-upper-entryway-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-guide-upper-entryway-e2e
  cancel-in-progress: true

jobs:
  upper-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live upper Custom HTML entryway
        timeout-minutes: 2
        run: node QA/live_guide_upper_entryway_e2e.mjs
