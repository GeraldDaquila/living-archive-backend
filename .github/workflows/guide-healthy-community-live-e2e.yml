name: Guide Healthy Community Live Browser Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_*.py"
      - "provider_bank.py"
      - "humility_spiritual_maturity_contract.py"
      - "community_rule_decision_contract.py"
      - "QA/guide_healthy_community_live_e2e.mjs"
      - "QA/guide_extraordinary_claims_live_e2e.mjs"
      - "tests/test_human_development_conceptual_recovery.py"
      - ".github/workflows/guide-healthy-community-live-e2e.yml"
      - "tests/test_conceptual_guide_grounding_boundary.py"
      - "general_guide_gold_standards.py"
      - "tests/test_general_guide_gold_standard_doorway_policy.py"
      - "scripts/guide_live_evaluation.py"
      - "docs/qa/guide_live_critical_evaluation_cases.json"
      - "tests/test_guide_live_evaluation_runner.py"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_*.py"
      - "humility_spiritual_maturity_contract.py"
      - "community_rule_decision_contract.py"
      - "QA/guide_healthy_community_live_e2e.mjs"
      - ".github/workflows/guide-healthy-community-live-e2e.yml"
      - "tests/test_conceptual_guide_grounding_boundary.py"
      - "general_guide_gold_standards.py"
      - "tests/test_general_guide_gold_standard_doorway_policy.py"
      - "scripts/guide_live_evaluation.py"
      - "docs/qa/guide_live_critical_evaluation_cases.json"
      - "tests/test_guide_live_evaluation_runner.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Share the primary provider-budget lock with Guide Live Evaluation.
  # These two suites must not spend the same production provider quota concurrently.
  group: guide-primary-provider-budgeted-live-validation-primary
  cancel-in-progress: false

jobs:
  live-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # The dedicated PR QA backend is not rebuilt for arbitrary pull requests.
    # Run real WordPress visitor acceptance after the commit reaches main; PRs
    # remain covered by mocked UI continuity and composition-contract tests.
    if: github.event_name != 'pull_request'
    env:
      USE_API_ORIGIN: https://living-archive-backend.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Wait for this candidate's API build
        timeout-minutes: 5
        run: |
          expected_version="$(sed -n '1s/^# USE PRODUCTION VERSION: \([^ ]*\).*/\1/p' main.py)"
          expected_sha="$GITHUB_SHA"
          if [ -z "$expected_version" ] || [ -z "$expected_sha" ]; then
            echo "Could not read expected USE version or commit SHA."
            exit 1
          fi
          echo "EXPECTED_USE_VERSION=$expected_version" >> "$GITHUB_ENV"
          echo "EXPECTED_USE_COMMIT_SHA=$expected_sha" >> "$GITHUB_ENV"
          echo "Expected runtime version: $expected_version"
          echo "Expected deployed commit: $expected_sha"
          echo "Target backend: $USE_API_ORIGIN"
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS --max-time 12 "$USE_API_ORIGIN/api/provider-health-readiness" || true)"
            actual_version="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"
            actual_sha="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin).get("deployment_commit_sha", ""))' 2>/dev/null || true)"
            if [ "$actual_version" = "$expected_version" ] && [ "$actual_sha" = "$expected_sha" ]; then
              echo "Exact candidate is live: version=$actual_version commit=$actual_sha"
              exit 0
            fi
            echo "Attempt $attempt/30: runtime version='${actual_version:-unavailable}' commit='${actual_sha:-unavailable}', waiting for version=$expected_version commit=$expected_sha."
            sleep 10
          done
          echo "Target API did not report exact expected version $expected_version and commit $expected_sha before timeout."
          exit 1
      - name: Prepare mobile acceptance evidence directory
        run: mkdir -p artifacts
      - name: Verify extraordinary-claims doorway through the real WordPress visitor UI
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 160s node QA/guide_extraordinary_claims_live_e2e.mjs
      - name: Verify real WordPress visitor rendering, exact humility near-miss, and mobile presentation
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=5s 280s node QA/guide_healthy_community_live_e2e.mjs
      - name: Upload real mobile visitor rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-live-mobile-acceptance-${{ github.run_id }}
          path: |
            artifacts/guide-humility-live-mobile.png
            artifacts/guide-extraordinary-claims-mobile.png
          if-no-files-found: warn
          retention-days: 30
