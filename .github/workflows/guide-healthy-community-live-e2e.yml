name: Guide Healthy Community Live Browser Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "QA/guide_healthy_community_live_e2e.mjs"
      - "tests/test_human_development_conceptual_recovery.py"
      - ".github/workflows/guide-healthy-community-live-e2e.yml"
      - "tests/test_conceptual_guide_grounding_boundary.py"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "QA/guide_healthy_community_live_e2e.mjs"
      - ".github/workflows/guide-healthy-community-live-e2e.yml"
      - "tests/test_conceptual_guide_grounding_boundary.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-healthy-community-live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # The dedicated PR QA backend is not rebuilt for arbitrary pull requests.
    # Run real WordPress visitor acceptance after the commit reaches main; PRs
    # remain covered by mocked UI continuity and composition-contract tests.
    if: github.event_name != 'pull_request'
    env:
      USE_API_ORIGIN: https://living-archive-backend.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Wait for this candidate's API build
        timeout-minutes: 5
        run: |
          expected_version="$(sed -n '1s/^# USE PRODUCTION VERSION: \([^ ]*\).*/\1/p' main.py)"
          expected_sha="$GITHUB_SHA"
          if [ -z "$expected_version" ] || [ -z "$expected_sha" ]; then
            echo "Could not read expected USE version or commit SHA."
            exit 1
          fi
          echo "EXPECTED_USE_VERSION=$expected_version" >> "$GITHUB_ENV"
          echo "EXPECTED_USE_COMMIT_SHA=$expected_sha" >> "$GITHUB_ENV"
          echo "Expected runtime version: $expected_version"
          echo "Expected deployed commit: $expected_sha"
          echo "Target backend: $USE_API_ORIGIN"
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS --max-time 12 "$USE_API_ORIGIN/api/provider-health-readiness" || true)"
            actual_version="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"
            actual_sha="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin).get("deployment_commit_sha", ""))' 2>/dev/null || true)"
            if [ "$actual_version" = "$expected_version" ] && [ "$actual_sha" = "$expected_sha" ]; then
              echo "Exact candidate is live: version=$actual_version commit=$actual_sha"
              exit 0
            fi
            echo "Attempt $attempt/30: runtime version='${actual_version:-unavailable}' commit='${actual_sha:-unavailable}', waiting for version=$expected_version commit=$expected_sha."
            sleep 10
          done
          echo "Target API did not report exact expected version $expected_version and commit $expected_sha before timeout."
          exit 1
      - name: Verify real WordPress visitor rendering and humane fallback
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 160s node QA/guide_healthy_community_live_e2e.mjs
