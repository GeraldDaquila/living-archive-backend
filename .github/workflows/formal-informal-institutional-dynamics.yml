name: Formal and Informal Institutional Dynamics Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "tests/test_formal_informal_institutional_dynamics.py"
      - ".github/workflows/formal-informal-institutional-dynamics.yml"
  push:
    branches:
      - "fix/formal-informal-institutional-dynamics-20261118"

permissions:
  contents: read

jobs:
  institutional-dynamics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile changed runtime modules
        run: python -m py_compile main.py general_guide_composition.py

      - name: Run focused institutional dynamics regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_formal_informal_institutional_dynamics.py

      - name: Run adjacent shared visitor-boundary regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_structural_doorway_presence.py \
            tests/test_general_guide_perception_contract.py \
            tests/test_gold_star_structural_change_direct_answer.py \
            tests/test_general_guide_gold_standard_doorway_policy.py
