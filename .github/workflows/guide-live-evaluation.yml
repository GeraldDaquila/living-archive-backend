name: Guide Live Evaluation

on:
  # Bounded synthetic replay twice daily; this is not visitor-conversation surveillance.
  schedule:
    - cron: '17 */12 * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/guide-live-evaluation.yml"
      - ".github/workflows/live-gold-star-visitor-smoke.yml"
      - "tests/test_guide_live_evaluation_runner.py"
      - "scripts/guide_live_evaluation.py"
      - "claim_adjudication.py"
      - "tests/test_claim_adjudication.py"
      - "main.py"
      - "general_guide_*.py"
      - "gold_star_*.py"
      - "provider_bank.py"
      - "community_tradeoff_candidate_policy.py"
      - "deterministic_answer_recovery.py"
      - "docs/qa/gold_standard_registry.json"
      - "docs/qa/gold_star_transferability_map.json"
      - "docs/qa/gold_star_qualitative_transfer_review.json"
      - "docs/qa/guide_learning_evaluation_set.json"
  workflow_dispatch:
    inputs:
      target_service:
        description: "Production service to evaluate"
        type: choice
        required: true
        default: primary
        options:
          - primary
          - mirror

permissions:
  contents: read

concurrency:
  group: guide-primary-provider-budgeted-live-validation-${{ github.event.inputs.target_service || 'primary' }}
  cancel-in-progress: false

jobs:
  live-evaluation:
    name: Capture and score live Guide responses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out evaluated source and registry
        uses: actions/checkout@v4

      - name: Wait for exact candidate API deployment
        timeout-minutes: 5
        env:
          TARGET_SERVICE: ${{ inputs.target_service || 'primary' }}
        run: |
          if [ "$TARGET_SERVICE" = "mirror" ]; then
            BASE_URL="https://living-archive-backend-mirror.onrender.com"
          else
            BASE_URL="https://living-archive-backend.onrender.com"
          fi
          expected_version="$(sed -n '1s/^# USE PRODUCTION VERSION: \([^ ]*\).*/\1/p' main.py)"
          expected_sha="$GITHUB_SHA"
          if [ -z "$expected_version" ] || [ -z "$expected_sha" ]; then
            echo "Could not read expected USE version or commit SHA."
            exit 1
          fi
          echo "Waiting for exact runtime version=$expected_version commit=$expected_sha at $BASE_URL"
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS --max-time 12 "$BASE_URL/api/provider-health-readiness" || true)"
            actual_version="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"
            actual_sha="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin).get("deployment_commit_sha", ""))' 2>/dev/null || true)"
            if [ "$actual_version" = "$expected_version" ] && [ "$actual_sha" = "$expected_sha" ]; then
              echo "Exact candidate is live: version=$actual_version commit=$actual_sha"
              exit 0
            fi
            echo "Attempt $attempt/30: runtime version='${actual_version:-unavailable}' commit='${actual_sha:-unavailable}', waiting for version=$expected_version commit=$expected_sha."
            sleep 10
          done
          echo "Target API did not report the exact candidate before timeout."
          exit 1
      - name: Run registry-derived live evaluation
        id: evaluation
        continue-on-error: true
        env:
          TARGET_SERVICE: ${{ inputs.target_service }}
          PYTHONPATH: .
        run: |
          if [ "$TARGET_SERVICE" = "mirror" ]; then
            BASE_URL="https://living-archive-backend-mirror.onrender.com"
          else
            BASE_URL="https://living-archive-backend.onrender.com"
          fi
          python scripts/guide_live_evaluation.py \
            --base-url "$BASE_URL" \
            --output artifacts/guide-live-evaluation-report.json

      - name: Upload complete response-level report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-live-evaluation-${{ inputs.target_service || 'primary' }}-${{ github.run_id }}
          path: artifacts/guide-live-evaluation-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail run when a regression or held-out critical check fails
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
        run: |
          if [ "$EVALUATION_OUTCOME" != "success" ]; then
            echo "Guide live evaluation found failures. Download the uploaded report and review every failed check."
            exit 1
          fi
