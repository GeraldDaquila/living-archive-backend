name: Guide Epistemic Multi-Axis Retrieval
on:
  pull_request:
    paths:
      - "main.py"
      - "guide_epistemic_query.py"
      - "tests/test_guide_epistemic_query.py"
      - "tests/test_guide_epistemic_query_integration.py"
      - ".github/workflows/guide-epistemic-multi-axis-retrieval.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "guide_epistemic_query.py"
      - "tests/test_guide_epistemic_query.py"
      - "tests/test_guide_epistemic_query_integration.py"
      - ".github/workflows/guide-epistemic-multi-axis-retrieval.yml"
jobs:
  epistemic-query-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile production Guide and retrieval planner
        run: python -m py_compile main.py guide_epistemic_query.py
      - name: Run epistemic query planner and production integration tests
        run: PYTHONPATH=. python -m pytest -q tests/test_guide_epistemic_query.py tests/test_guide_epistemic_query_integration.py
