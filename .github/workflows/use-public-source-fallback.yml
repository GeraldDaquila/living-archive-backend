name: USE public source fallback tests

on:
  pull_request:
    paths:
      - "living_archive_public_source.py"
      - "tests/test_living_archive_public_source.py"
      - ".github/workflows/use-public-source-fallback.yml"
  push:
    branches:
      - main
    paths:
      - "living_archive_public_source.py"
      - "tests/test_living_archive_public_source.py"
      - ".github/workflows/use-public-source-fallback.yml"

jobs:
  public-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run public-source security and normalization tests
        run: python -m pytest -q tests/test_living_archive_public_source.py
