name: Gold Star ledger PostgreSQL schema contract

on:
  pull_request:
    branches: [main]
    paths:
      - "migrations/**"
      - "tests/test_gold_star_ledger_schema.py"
      - ".github/workflows/gold-star-ledger-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goldstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goldstar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goldstar_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" pytest
      - name: Compile schema contract tests
        run: python -m py_compile tests/test_gold_star_ledger_schema.py
      - name: Apply migration and verify PostgreSQL constraints
        run: python -m pytest -q tests/test_gold_star_ledger_schema.py
