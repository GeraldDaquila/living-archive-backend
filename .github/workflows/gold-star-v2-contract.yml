name: Gold Star v2 shared-contract regressions

on:
  pull_request:
    branches: [main]
    paths:
      - "gold_star_question_contract.py"
      - "gold_star_answer_envelope.py"
      - "gold_star_route_capabilities.py"
      - "hub_contracts.py"
      - "main.py"
      - "gold_star_semantic_contract.py"
      - "gold_star_response_floor.py"
      - "gold_star_pattern_detection.py"
      - "specialist_adapters.py"
      - "deterministic_answer_recovery.py"
      - "general_guide_composition.py"
      - "gold_star_adaptation_evaluation.py"
      - "use_core.py"
      - "scripts/capture_gold_star_wp3_pairs.py"
      - "scripts/gold_star_wp3_simulation.py"
      - "scripts/gold_star_qa_browser_acceptance.py"
      - "tests/test_gold_star_*"
      - "tests/test_embedding_runtime_policy.py"
      - ".github/workflows/gold-star-wp3-memory-probe.yml"
      - ".github/workflows/gold-star-v2-contract.yml"
  push:
    branches: [gold-star-v2-complete-architecture]
    paths:
      - "gold_star_question_contract.py"
      - "main.py"
      - "gold_star_semantic_contract.py"
      - "gold_star_pattern_detection.py"
      - "gold_star_response_floor.py"
      - "specialist_adapters.py"
      - "deterministic_answer_recovery.py"
      - "general_guide_composition.py"
      - "gold_star_adaptation_evaluation.py"
      - "scripts/gold_star_wp3_simulation.py"
      - "tests/test_gold_star_*"
      - ".github/workflows/gold-star-v2-contract.yml"

permissions:
  contents: read

jobs:
  shared-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest -r requirements.txt
      - name: Compile shared Gold Star route contracts and simulation harness
        run: python -m py_compile gold_star_answer_envelope.py gold_star_question_contract.py gold_star_route_capabilities.py main.py gold_star_semantic_contract.py gold_star_response_floor.py specialist_adapters.py deterministic_answer_recovery.py general_guide_composition.py gold_star_pattern_detection.py gold_star_adaptation_evaluation.py use_core.py scripts/capture_gold_star_wp3_pairs.py scripts/gold_star_wp3_simulation.py scripts/gold_star_qa_browser_acceptance.py
      - name: Run shared question, specialist, provenance, and simulation regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_gold_star_answer_envelope.py tests/test_gold_star_route_capabilities.py tests/test_gold_star_specialist_context.py tests/test_gold_star_question_contract.py tests/test_gold_star_response_floor.py tests/test_gold_star_adaptive_intelligence_v2.py tests/test_gold_star_visitor_boundary.py tests/test_gold_star_evidence_validation.py tests/test_gold_star_bounded_repair.py tests/test_gold_star_semantic_contract.py tests/test_gold_star_wp3_calibration_contract.py tests/test_gold_star_wp3_paired_capture.py tests/test_gold_star_wp3_simulation.py tests/test_gold_star_task_recovery.py tests/test_gold_star_wp3_delegated_review.py tests/test_gold_star_lessons.py tests/test_gold_star_cross_question_pattern_learning.py tests/test_gold_star_multi_candidate_adjudication.py tests/test_gold_star_qualitative_transfer_review.py tests/test_gold_star_transferability_map.py tests/test_gold_star_scope_governance.py tests/test_gold_star_qa_browser_acceptance.py tests/test_gold_star_runtime_authority_boundary.py tests/test_gold_star_selector_equivalence.py tests/test_gold_star_pattern_detection.py tests/test_gold_star_adaptation_evaluation.py tests/test_embedding_runtime_policy.py
      - name: Produce explicitly simulated seven-case evaluation artifact
        env:
          PYTHONPATH: .
        run: python scripts/gold_star_wp3_simulation.py --output artifacts/gold-star-wp3-simulation.json
      - name: Upload simulation-only report
        uses: actions/upload-artifact@v4
        with:
          name: gold-star-wp3-simulation-only
          path: artifacts/gold-star-wp3-simulation.json
          if-no-files-found: error
          retention-days: 90
