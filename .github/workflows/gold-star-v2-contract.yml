name: Gold Star v2 shared-contract regressions

on:
  pull_request:
    branches: [main]
    paths:
      - "gold_star_question_contract.py"
      - "gold_star_answer_envelope.py"
      - "gold_star_route_capabilities.py"
      - "hub_contracts.py"
      - "main.py"
      - "gold_star_semantic_contract.py"
      - "gold_star_response_floor.py"
      - "specialist_adapters.py"
      - "deterministic_answer_recovery.py"
      - "general_guide_composition.py"
      - "tests/test_gold_star_*"
      - ".github/workflows/gold-star-v2-contract.yml"
  push:
    branches: [gold-star-v2-complete-architecture]
    paths:
      - "gold_star_question_contract.py"
      - "gold_star_semantic_contract.py"
      - "gold_star_response_floor.py"
      - "specialist_adapters.py"
      - "deterministic_answer_recovery.py"
      - "general_guide_composition.py"
      - "tests/test_gold_star_*"
      - ".github/workflows/gold-star-v2-contract.yml"

permissions:
  contents: read

jobs:
  shared-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest -r requirements.txt
      - name: Compile shared Gold Star route contracts
        run: python -m py_compile gold_star_answer_envelope.py gold_star_question_contract.py gold_star_route_capabilities.py main.py gold_star_semantic_contract.py gold_star_response_floor.py specialist_adapters.py deterministic_answer_recovery.py general_guide_composition.py
      - name: Run shared question and specialist contract regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_gold_star_answer_envelope.py tests/test_gold_star_route_capabilities.py tests/test_gold_star_specialist_context.py tests/test_gold_star_question_contract.py tests/test_gold_star_response_floor.py tests/test_gold_star_adaptive_intelligence_v2.py tests/test_gold_star_visitor_boundary.py tests/test_gold_star_evidence_validation.py tests/test_gold_star_bounded_repair.py tests/test_gold_star_wp3_calibration_contract.py tests/test_gold_star_wp3_paired_capture.py
