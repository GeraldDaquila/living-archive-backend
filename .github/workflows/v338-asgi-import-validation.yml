name: USE v338 ASGI import validation

on:
  push:
    branches:
      - fix/v338-asgi-app

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile main.py use_core.py run_v338_asgi_import_validation.py
      - run: python run_v338_asgi_import_validation.py
