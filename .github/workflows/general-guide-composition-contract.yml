permissions:
  contents: read

jobs:
  composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install runtime dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Guide runtime modules
        run: python -m compileall -q main.py guide_runtime.py gold_star_response_floor.py guide_direct_attribute_evidence.py general_guide_composition.py general_guide_gold_standards.py gold_star_lessons.py deterministic_answer_recovery.py inquiry_family_transfer_contract.py gold_star_question_contract.py gold_star_semantic_contract.py gold_star_response_floor.py gold_star_semantic_retrieval.py comparative_traditions_contract.py deterministic_answer_recovery.py guide_incomplete_knowledge.py guide_answerability.py streaming_transport.py gold_star_evaluation_context.py provider_bank.py gold_star_evaluation_runner.py
      - name: Run request-local Gold Star matched-pair isolation contracts
        run: python -m pytest -q tests/test_gold_star_evaluation_context.py
      - name: Run synthetic-only Gold Star paired generation contracts
        run: python -m pytest -q tests/test_gold_star_evaluation_runner.py
      - name: Run multi-candidate and cold-start Gold Star retrieval contracts
        run: python -m pytest -q tests/test_gold_star_multi_candidate_adjudication.py tests/test_gold_star_cross_question_pattern_learning.py tests/test_gold_star_lessons.py tests/test_gold_star_semantic_retrieval.py
      - name: Run inquiry-family transfer and lived-response boundary regressions
        run: python -m pytest -q tests/test_inquiry_family_transfer_boundary.py
      - name: Run provider-exhaustion and response-boundary regressions
        run: python -m pytest -q tests/test_claim_adjudication_request_gate.py tests/test_general_guide_provider_parse_contract.py
      - name: Run bounded Guide provider arbitration regressions
        run: python -m pytest -q tests/test_general_guide_provider_budget.py tests/test_provider_resilience.py
      - name: Run composition regression tests
        run: python -m pytest -q tests/test_guide_first_failure_recovery.py tests/test_developmental_capacities_recovery.py
      - name: Run Gold Star final-delivery observability regressions
        run: python -m pytest -q tests/test_gold_star_final_delivery_attribution.py
      - name: Run deterministic Gold Star visitor-boundary integration regressions
        run: python -m pytest -q tests/test_gold_star_deterministic_composition.py
      - name: Run existing composition regression tests
        run: python -m pytest -q tests/test_general_guide_answer_first_hard_boundary.py tests/test_deterministic_stewardship_comparison_answer_first.py tests/test_archive_passage_contrast_contract.py tests/test_comparative_traditions_contract.py tests/test_general_guide_comparative_traditions_composition.py tests/test_general_guide_perception_contract.py tests/test_general_guide_autonomy_evidence_contract.py tests/test_general_guide_preference_clarification.py tests/test_general_guide_practical_next_step_contract.py test_deterministic_answer_recovery.py tests/test_direct_attribute_evidence_boundary.py tests/test_visitor_meta_commentary_boundary.py tests/test_shared_definition_exhaustion_recovery.py tests/test_provider_exhaustion_regex_contract.py tests/test_spiritual_community_accountability_contract.py tests/test_regeneration_invitation_discernment_gold_star.py tests/test_guide_orientation_information_contract.py tests/test_guide_meta_coverage_policy.py tests/test_guide_epistemic_category_distinction.py tests/test_gold_star_question_contract.py tests/test_gold_star_semantic_contract.py tests/test_gold_star_route_capabilities.py tests/test_guide_terminal_doorway_omission.py tests/test_guide_outcome_telemetry_correlation.py
      - name: Run layered answerability and calibrated abstention tests
        run: python -m pytest -q tests/test_guide_layered_answerability.py tests/test_guide_answerability_repair.py
      - name: Run stewardship under incomplete knowledge final-boundary tests
        run: python -m pytest -q tests/test_guide_incomplete_knowledge.py
      - name: Run formal and informal institutional dynamics contract
        run: python -m pytest -q tests/test_formal_informal_institutional_dynamics.py
      - name: Run system-wide three-paragraph default and fragmented-knowledge regression
        run: python -m pytest -q tests/test_guide_systemwide_three_paragraph_default.py
      - name: Run visitor idea-chunking and readability contract
        run: python -m pytest -q tests/test_guide_visitor_idea_chunking_contract.py
      - name: Run elementary factual Gold Standard regressions
        run: python -m pytest -q tests/test_general_guide_elementary_factual_gold_standards.py tests/test_cosmology_worldview_gold_star.py
      - name: Run static Guide composition QA
        run: python QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py
      - name: Run reciprocity community final visitor contract regressions
        run: python -m pytest -q tests/test_guide_reciprocity_community_purpose.py
      - name: Run public commons provider-exhaustion answerability regressions
        run: python -m pytest -q tests/test_public_commons_civic_renewal_recovery.py
      - name: Run superseded reciprocity fallback and active shadow-cohort regressions
        run: python -m pytest -q tests/test_guide_named_concept_recovery.py tests/test_v489_283_guide_discovery_voice.py tests/test_gold_star_full_shadow_cohort.py
      - name: Run runtime gold-standard enforcement regressions
        run: python -m pytest -q tests/test_general_guide_gold_standard_runtime.py
      - name: Run felt-truth claim discernment final-boundary regressions
        run: python -m pytest -q tests/test_felt_truth_claim_discernment.py
      - name: Run Gold Star v2 source-independent response-floor tests
        run: python -m pytest -q tests/test_gold_star_response_floor.py tests/test_gold_star_adaptive_intelligence_v2.py
      - name: Run AI role doorway boundary regression
        run: python -m pytest -q QA/AI_ROLE_DISTINCTION_DOORWAY_BOUNDARY_TESTS.py
      - name: Run offline Guide learning evaluation integrity tests
        run: python -m pytest -q tests/test_guide_learning_offline_evaluation.py
      - name: Run live evaluation runner unit tests (no production calls)
        run: python -m pytest -q tests/test_guide_live_evaluation_runner.py
      - name: Run central gold-standard registry contracts
        run: python -m pytest -q tests/test_gold_standard_registry.py
      - name: Run structural-change Gold Star doorway contract
        run: python -m pytest -q tests/test_gold_star_structural_change_direct_answer.py tests/test_general_guide_gold_standard_doorway_policy.py
      - name: Generate pinned registry identity report
        env:
          QA_APPLICATION_COMMIT: ${{ github.sha }}
          QA_RUNTIME_IDENTITY: github-actions/${{ runner.os }}/python-3.12
        run: python scripts/qa/report_gold_standard_registry.py --output gold-standard-registry-report.json
      - name: Upload pinned registry identity report
        uses: actions/upload-artifact@v4
        with:
          name: gold-standard-registry-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: gold-standard-registry-report.json
          if-no-files-found: error
          retention-days: 90
