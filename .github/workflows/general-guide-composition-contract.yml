name: General Guide Composition Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "tests/test_general_guide_perception_contract.py"
      - "tests/test_general_guide_preference_clarification.py"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - ".github/workflows/general-guide-composition-contract.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "tests/test_general_guide_perception_contract.py"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - ".github/workflows/general-guide-composition-contract.yml"

permissions:
  contents: read

jobs:
  composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile Guide runtime modules
        run: python -m compileall -q main.py general_guide_composition.py streaming_transport.py
      - name: Run composition regression tests
        run: python -m pytest -q tests/test_general_guide_perception_contract.py tests/test_general_guide_preference_clarification.py
      - name: Run static Guide composition QA
        run: python QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py
