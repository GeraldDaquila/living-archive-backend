name: General Guide Composition Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "guide_direct_attribute_evidence.py"
      - "tests/test_direct_attribute_evidence_boundary.py"
      - "general_guide_composition.py"
      - "general_guide_gold_standards.py"
      - "tests/test_general_guide_gold_standard_runtime.py"
      - "tests/test_guide_learning_offline_evaluation.py"
      - "scripts/guide_live_evaluation.py"
      - "tests/test_guide_live_evaluation_runner.py"
      - "docs/qa/guide_live_evaluation_protocol.md"
      - "docs/qa/reports/live-guide-baseline-2026-10-25-v489.297.md"
      - ".github/workflows/guide-live-evaluation.yml"
      - "docs/qa/guide_learning_lesson.schema.json"
      - "docs/qa/guide_learning_evaluation_set.json"
      - "deterministic_answer_recovery.py"
      - "test_deterministic_answer_recovery.py"
      - "tests/test_general_guide_perception_contract.py"
      - "tests/test_general_guide_preference_clarification.py"
      - "tests/test_general_guide_elementary_factual_gold_standards.py"
      - "tests/fixtures/general_guide_elementary_factual_gold_standards.json"
      - "requirements.txt"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - ".github/workflows/general-guide-composition-contract.yml"
      - "docs/qa/gold_standard_registry.json"
      - "scripts/qa/report_gold_standard_registry.py"
      - "tests/test_gold_standard_registry.py"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "general_guide_composition.py"
      - "general_guide_gold_standards.py"
      - "tests/test_general_guide_gold_standard_runtime.py"
      - "tests/test_guide_learning_offline_evaluation.py"
      - "docs/qa/guide_learning_lesson.schema.json"
      - "docs/qa/guide_learning_evaluation_set.json"
      - "deterministic_answer_recovery.py"
      - "test_deterministic_answer_recovery.py"
      - "tests/test_general_guide_perception_contract.py"
      - "tests/test_general_guide_preference_clarification.py"
      - "tests/test_general_guide_elementary_factual_gold_standards.py"
      - "tests/fixtures/general_guide_elementary_factual_gold_standards.json"
      - "requirements.txt"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - ".github/workflows/general-guide-composition-contract.yml"
      - "docs/qa/gold_standard_registry.json"
      - "scripts/qa/report_gold_standard_registry.py"
      - "tests/test_gold_standard_registry.py"

permissions:
  contents: read

jobs:
  composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install runtime dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Guide runtime modules
        run: python -m compileall -q main.py guide_direct_attribute_evidence.py general_guide_composition.py general_guide_gold_standards.py deterministic_answer_recovery.py streaming_transport.py
      - name: Run composition regression tests
        run: python -m pytest -q tests/test_general_guide_perception_contract.py tests/test_general_guide_preference_clarification.py test_deterministic_answer_recovery.py tests/test_direct_attribute_evidence_boundary.py
      - name: Run elementary factual Gold Standard regressions
        run: python -m pytest -q tests/test_general_guide_elementary_factual_gold_standards.py
      - name: Run static Guide composition QA
        run: python QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py
      - name: Run runtime gold-standard enforcement regressions
        run: python -m pytest -q tests/test_general_guide_gold_standard_runtime.py
      - name: Run offline Guide learning evaluation integrity tests
        run: python -m pytest -q tests/test_guide_learning_offline_evaluation.py
      - name: Run live evaluation runner unit tests (no production calls)
        run: python -m pytest -q tests/test_guide_live_evaluation_runner.py
      - name: Run central gold-standard registry contracts
        run: python -m pytest -q tests/test_gold_standard_registry.py
      - name: Generate pinned registry identity report
        env:
          QA_APPLICATION_COMMIT: ${{ github.sha }}
          QA_RUNTIME_IDENTITY: github-actions/${{ runner.os }}/python-3.12
        run: python scripts/qa/report_gold_standard_registry.py --output gold-standard-registry-report.json
      - name: Upload pinned registry identity report
        uses: actions/upload-artifact@v4
        with:
          name: gold-standard-registry-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: gold-standard-registry-report.json
          if-no-files-found: error
          retention-days: 90
