name: Publish Archive Crosslink Snapshot
on:
  workflow_dispatch:
  schedule:
    # Monthly territorial refresh: 00:15 UTC on the first day of each month.
    # The live Guide never performs this scan on startup or visitor requests.
    - cron: "15 0 1 * *"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build validated territorial map
        run: python -m scripts.publish_archive_crosslink_snapshot
      - name: Commit validated map
        run: |
          git config user.name "Living Archive Snapshot Publisher"
          git config user.email "actions@github.com"
          git add archive_crosslink_snapshot.json archive_crosslink_snapshot.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Refresh validated archive crosslink snapshot"
          git push
