name: Publish Archive Crosslink Snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build validated territorial map
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: python scripts/publish_archive_crosslink_snapshot.py
      - name: Commit validated map
        run: |
          git config user.name "Living Archive Snapshot Publisher"
          git config user.email "actions@github.com"
          git add archive_crosslink_snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh validated archive crosslink snapshot"
          git push
