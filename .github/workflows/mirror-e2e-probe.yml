name: Mirror E2E Probe

on:
  push:
    branches:
      - e2e/mirror-probe-20261007

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: POST one ordinary Guide query to USE2
        shell: bash
        run: |
          set -euo pipefail
          body='{"query":"What does loneliness ask us to notice?"}'
          code="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$body" \
            -o response.json \
            -w '%{http_code}' \
            'https://living-archive-backend-mirror.onrender.com/api/query')"
          echo "HTTP status: $code"
          cat response.json
          test "$code" = "200"
