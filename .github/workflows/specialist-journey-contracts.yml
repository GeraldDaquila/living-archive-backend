name: Existing specialist journey contracts

on:
  pull_request:
    paths:
      - "tests/test_existing_specialist_journey_contracts.py"
      - "specialist_adapters.py"
      - "specialist_registry.py"
      - "hub_contracts.py"
      - "relationship_contribution.py"
      - "formation_contribution.py"
      - "formation_adapter.py"
      - ".github/workflows/specialist-journey-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "tests/test_existing_specialist_journey_contracts.py"
      - "specialist_adapters.py"
      - "specialist_registry.py"
      - "hub_contracts.py"
      - "relationship_contribution.py"
      - "formation_contribution.py"
      - "formation_adapter.py"
      - ".github/workflows/specialist-journey-contracts.yml"

jobs:
  existing-specialist-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Verify existing Guide-to-specialist contract composition
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_existing_specialist_journey_contracts.py
          tests/test_hub_contracts.py
          tests/test_formation_adapter_three_door_contract.py
