name: USE Randomized Ecosystem Resilience Simulation

on:
  pull_request:
    paths:
      - "main.py"
      - "guide_runtime.py"
      - "specialist_registry.py"
      - "specialist_adapters.py"
      - "provider_bank.py"
      - "provider_resilience.py"
      - "pinecone_retrieval_budget.py"
      - "archive_crosslink.py"
      - "streaming_transport.py"
      - "safety_utility.py"
      - "safety_adapter.py"
      - "safety_intelligence.py"
      - "tests/test_use_ecosystem_randomized_resilience.py"
      - ".github/workflows/use-ecosystem-randomized-resilience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-ecosystem-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run seeded ecosystem resilience simulation
        run: python -m unittest tests/test_use_ecosystem_randomized_resilience.py tests/test_ecosystem_integration_audit.py -v
