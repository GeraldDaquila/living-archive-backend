name: Conceptual Guide Grounding Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "guide_direct_attribute_evidence.py"
      - "tests/test_conceptual_guide_grounding_boundary.py"
      - ".github/workflows/conceptual-guide-grounding-boundary.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "guide_direct_attribute_evidence.py"
      - "tests/test_conceptual_guide_grounding_boundary.py"
      - ".github/workflows/conceptual-guide-grounding-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conceptual-grounding-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile conceptual Guide runtime modules
        run: python -m compileall -q main.py guide_direct_attribute_evidence.py general_guide_composition.py deterministic_answer_recovery.py
      - name: Run the exact conceptual grounding regression
        run: python -m pytest -q tests/test_conceptual_guide_grounding_boundary.py
