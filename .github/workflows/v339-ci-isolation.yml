name: USE v339 canonical doorway isolated validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/v339-ci-isolation
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile production modules
        run: python -m py_compile main.py use_core.py
      - name: v339 structural validation
        run: python -m pytest -q tests/test_v339_canonical_recommendation_doorway.py
      - name: v339 isolated runtime validation
        run: python -m pytest -q tests/test_v339_canonical_recommendation_doorway_runtime.py
