name: Apply USE v269b canonical chunk identity patch

on:
  push:
    paths:
      - '.github/workflows/apply_v269b.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply v269 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib

          path = Path('main.py')
          source = path.read_text(encoding='utf-8')

          assert 'APP_VERSION = "v268"' in source
          assert 'USE-v268-canonical-publication-identity' in source
          assert 'USE-BUILD-v268-canonical-publication-identity' in source

          source = source.replace('APP_VERSION = "v268"', 'APP_VERSION = "v269"', 1)
          source = source.replace(
              'DEPLOYMENT_FINGERPRINT = "USE-v268-canonical-publication-identity"',
              'DEPLOYMENT_FINGERPRINT = "USE-v269-canonical-chunk-publication-identity"', 1)
          source = source.replace(
              'CANONICAL_BUILD_ID = "USE-BUILD-v268-canonical-publication-identity"',
              'CANONICAL_BUILD_ID = "USE-BUILD-v269-canonical-chunk-publication-identity"', 1)

          old_patterns = '''    content_patterns = (\n        (r"\b(?:this|the) living archive navigator\b", "Navigator"),\n        (r"\b(?:this|the) reference map\b", "Reference Map"),\n        (r"\b(?:this|the) guided reading pathway\b", "Pathway"),\n        (r"\b(?:this|the) knowledge hub\b", "Knowledge Hub"),\n        (r"\b(?:this|the) cornerstone(?: hub)?\b", "Cornerstone"),\n        (r"\b(?:this|the) learning arc\b", "Learning Arc"),\n        (r"\b(?:this|the) case study\b", "Case"),\n        (r"\b(?:this|the) essay\b", "Essay"),\n    )\n'''
          new_patterns = '''    content_patterns = (\n        (r"\bcornerstone\s+essay(?:\s+series)?\b", "Essay"),\n        (r"\bfoundational\s+essay(?:s)?\b", "Essay"),\n        (r"\b(?:this|the) living archive navigator\b", "Navigator"),\n        (r"\b(?:this|the) reference map\b", "Reference Map"),\n        (r"\b(?:this|the) guided reading pathway\b", "Pathway"),\n        (r"\b(?:this|the) knowledge hub\b", "Knowledge Hub"),\n        (r"\b(?:this|the) cornerstone(?: hub)?\b", "Cornerstone"),\n        (r"\b(?:this|the) learning arc\b", "Learning Arc"),\n        (r"\b(?:this|the) case study\b", "Case"),\n        (r"\b(?:this|the) essay\b", "Essay"),\n    )\n'''
          assert old_patterns in source
          source = source.replace(old_patterns, new_patterns, 1)

          marker = 'def _v268_canonical_publication_identity_self_audit() -> None:\n'
          assert marker in source
          helper = '''def _v269_resolve_canonical_type_across_chunks(\n    metadata: Dict[str, Any],\n    vector: Optional[List[float]],\n    required_type: Optional[str],\n) -> Optional[Dict[str, Any]]:\n    """Resolve publication identity across chunks sharing one canonical URL.\n\n    Pinecone records are chunked representations of one canonical resource.\n    A document-type declaration may legitimately occur in a later chunk even\n    when the semantically retrieved chunk does not contain it. This resolver\n    uses exact canonical URL identity to inspect sibling chunks; it never\n    infers type from topic, title, or semantic similarity.\n    """\n    if not required_type or not isinstance(metadata, dict) or not index:\n        return None\n    url = str(metadata.get("url", "") or "").strip().rstrip("/")\n    if not url or not vector:\n        return None\n    try:\n        result = index.query(\n            vector=vector,\n            top_k=32,\n            include_metadata=True,\n            filter={"url": {"$eq": url}},\n        )\n        sibling_matches = (\n            result.get("matches", [])\n            if hasattr(result, "get")\n            else getattr(result, "matches", [])\n        )\n    except Exception as exc:\n        print(f"USE v269 canonical chunk identity lookup error: {exc}")\n        return None\n\n    for sibling in sibling_matches or []:\n        sibling_metadata = _match_metadata(sibling)\n        if not isinstance(sibling_metadata, dict):\n            continue\n        recognized = _recognize_resource_type(sibling_metadata)\n        if recognized.get("resource_type") != required_type:\n            continue\n        merged = dict(metadata)\n        merged["_use_resource_type_recognition"] = dict(recognized)\n        merged["_use_canonical_chunk_identity"] = {\n            "source": "v269_exact_canonical_url_sibling_chunk",\n            "url": url,\n            "evidence_chunk_index": sibling_metadata.get("chunk_index"),\n        }\n        print(\n            "USE v269 canonical chunk publication identity: "\n            f"resolved type={required_type!r}, title={metadata.get('title')!r}, "\n            f"url={url!r}, evidence_chunk_index={sibling_metadata.get('chunk_index')!r}."\n        )\n        return merged\n    return None\n\n\n'''
          source = source.replace(marker, helper + marker, 1)

          old_gate = '''                if required_type:\n                    recognized = _recognize_resource_type(metadata)\n                    if recognized.get("resource_type") != required_type:\n                        rejected_for_type += 1\n                        continue\n                    # v140: D20 has positively established that this candidate\n'''
          new_gate = '''                if required_type:\n                    recognized = _recognize_resource_type(metadata)\n                    if recognized.get("resource_type") != required_type:\n                        resolved = _v269_resolve_canonical_type_across_chunks(\n                            metadata, vector, required_type\n                        )\n                        if resolved is None:\n                            rejected_for_type += 1\n                            continue\n                        metadata = resolved\n                        recognized = metadata.get("_use_resource_type_recognition") or {}\n                    else:\n                        metadata = dict(metadata)\n                        metadata["_use_resource_type_recognition"] = dict(recognized)\n                    # v140: D20 has positively established that this candidate\n'''
          assert old_gate in source
          source = source.replace(old_gate, new_gate, 1)

          source = source.replace(
              'def _v268_canonical_publication_identity_self_audit() -> None:',
              'def _v269_canonical_chunk_publication_identity_self_audit() -> None:', 1)

          old_audit = '''    recognition = _recognize_resource_type(canonical_taxonomy_essay)\n    assert recognition["resource_type"] == "Essay", (\n'''
          new_audit = '''    cornerstone_essay = {\n        "title": canonical_taxonomy_essay["title"],\n        "url": "https://example.invalid/cornerstone-essay",\n        "text": "This essay forms part of the Cornerstone Essay Series.",\n    }\n    cornerstone_recognition = _recognize_resource_type(cornerstone_essay)\n    assert cornerstone_recognition["resource_type"] == "Essay", (\n        "v269 D20 precedence: Cornerstone Essay Series was incorrectly recognized as Cornerstone."\n    )\n    assert cornerstone_recognition["basis"] == "content_self_identification"\n\n    cornerstone_only = {\n        "title": "The Twelve Cornerstones of the Living Archive",\n        "url": "https://example.invalid/cornerstone",\n        "text": "This Cornerstone provides a foundational lens across domains.",\n    }\n    assert _recognize_resource_type(cornerstone_only)["resource_type"] == "Cornerstone"\n\n    recognition = _recognize_resource_type(canonical_taxonomy_essay)\n    assert recognition["resource_type"] == "Essay", (\n'''
          assert old_audit in source
          source = source.replace(old_audit, new_audit, 1)

          source = source.replace('v268 canonical publication identity:', 'v269 canonical publication identity:')

          pattern = re.compile(r'(?ms)^# === CANONICAL BUILD IDENTITY \\(excluded from payload hash\\) ===\n.*?^# === END CANONICAL BUILD IDENTITY ===\n?')
          normalized, count = pattern.subn(
              '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n'
              '# <CANONICAL_BUILD_IDENTITY_BLOCK>\n'
              '# === END CANONICAL BUILD IDENTITY ===\n',
              source, count=1)
          assert count == 1
          payload = hashlib.sha256(normalized.encode('utf-8')).hexdigest()
          source = re.sub(
              r'CANONICAL_BUILD_PAYLOAD_SHA256 = "[0-9a-f]+"',
              f'CANONICAL_BUILD_PAYLOAD_SHA256 = "{payload}"',
              source, count=1)
          path.write_text(source, encoding='utf-8')
          print('v269 payload sha:', payload)
          print('v269 raw sha:', hashlib.sha256(source.encode('utf-8')).hexdigest())
          PY

      - name: Commit patched main.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --check
          git rm .github/workflows/apply_v269b.yml .github/workflows/apply_v269.yml
          git commit -m "USE v269 canonical chunk publication identity"
          git push
