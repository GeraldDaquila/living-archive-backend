name: Promote USE v296

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote-v296:
    if: github.event.head_commit.message == 'USE v296 promotion bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and audit v296 from exact v295 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import difflib
          import hashlib
          import re
          import subprocess

          p = Path("main.py")
          baseline = subprocess.check_output(["git", "show", "HEAD:main.py"])
          baseline_sha = hashlib.sha256(baseline).hexdigest()
          expected_baseline_sha = "2ec0baad0e61caf87ee02cf1fc66c7623285a7a7650b5b60790e385f38972d8e"
          if baseline_sha != expected_baseline_sha:
              raise SystemExit(f"v295 baseline raw SHA mismatch: {baseline_sha}")

          source = baseline.decode("utf-8")
          required = [
              '# USE PRODUCTION VERSION: v295 — Embedding Runtime Thread Experiment: 6 Threads + Canonical Identity Correction + The Guide',
              'APP_VERSION = "v295"',
              'DEPLOYMENT_FINGERPRINT = "USE-v295-embedding-runtime-threads-6"',
              'CANONICAL_BUILD_ID = "USE-BUILD-v295-embedding-runtime-threads-6"',
              'embedding_model = TextEmbedding(model_name="BAAI/bge-small-en-v1.5", threads=6)',
          ]
          missing = [x for x in required if source.count(x) != 1]
          if missing:
              raise SystemExit("Unexpected v295 baseline markers: " + repr(missing))

          source = source.replace(
              '# USE PRODUCTION VERSION: v295 — Embedding Runtime Thread Experiment: 6 Threads + Canonical Identity Correction + The Guide',
              '# USE PRODUCTION VERSION: v296 — Embedding Runtime Default Threads + The Guide', 1)
          source = source.replace('APP_VERSION = "v295"', 'APP_VERSION = "v296"', 1)
          source = source.replace(
              'DEPLOYMENT_FINGERPRINT = "USE-v295-embedding-runtime-threads-6"',
              'DEPLOYMENT_FINGERPRINT = "USE-v296-embedding-runtime-default-threads"', 1)
          source = source.replace(
              'CANONICAL_BUILD_ID = "USE-BUILD-v295-embedding-runtime-threads-6"',
              'CANONICAL_BUILD_ID = "USE-BUILD-v296-embedding-runtime-default-threads"', 1)
          source = source.replace(
              'embedding_model = TextEmbedding(model_name="BAAI/bge-small-en-v1.5", threads=6)',
              'embedding_model = TextEmbedding(model_name="BAAI/bge-small-en-v1.5")', 1)

          normalized = source.replace("\r\n", "\n").replace("\r", "\n")
          pattern = re.compile(
              r"(?ms)^# === CANONICAL BUILD IDENTITY \(excluded from payload hash\) ===\n"
              r".*?"
              r"^# === END CANONICAL BUILD IDENTITY ===\n?"
          )
          payload, count = pattern.subn(
              "# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n"
              "# <CANONICAL_BUILD_IDENTITY_BLOCK>\n"
              "# === END CANONICAL BUILD IDENTITY ===\n",
              normalized,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Canonical identity block count={count}, expected 1")
          payload_sha = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          source = re.sub(
              r'CANONICAL_BUILD_PAYLOAD_SHA256 = "[0-9a-f]+"',
              f'CANONICAL_BUILD_PAYLOAD_SHA256 = "{payload_sha}"',
              source,
              count=1,
          )

          # Preserve the production source's CRLF byte representation.
          p.write_bytes(source.replace("\n", "\r\n").encode("utf-8"))
          candidate = p.read_bytes()
          candidate_sha = hashlib.sha256(candidate).hexdigest()
          expected_candidate_sha = "6fb8bce46659f94be29426ba100da5d291de7194336ebdc0ca102f1fc234b85c"
          expected_payload_sha = "e5fe14ba645e13dfa2731a20a908917ce3935ba3d690a229efcbcccd41cae91e"
          if payload_sha != expected_payload_sha:
              raise SystemExit(f"v296 canonical payload SHA mismatch: {payload_sha}")
          if candidate_sha != expected_candidate_sha:
              raise SystemExit(f"v296 raw SHA mismatch: {candidate_sha}")

          final_source = candidate.decode("utf-8")
          compile(final_source, str(p), "exec")
          ast.parse(final_source)
          if final_source.count('v295') != 0:
              raise SystemExit("v296 contains stale v295 markers")
          if final_source.count('threads=6') != 0 or final_source.count('threads=4') != 0:
              raise SystemExit("v296 contains stale explicit thread settings")
          if final_source.count('TextEmbedding(model_name="BAAI/bge-small-en-v1.5")') != 1:
              raise SystemExit("v296 embedding constructor invariant failed")

          # Whitelist the complete source-level delta against v295.
          old_lines = baseline.decode("utf-8").splitlines()
          new_lines = final_source.splitlines()
          diff = list(difflib.unified_diff(old_lines, new_lines, n=0))
          removed = {x[1:] for x in diff if x.startswith('-') and not x.startswith('---')}
          added = {x[1:] for x in diff if x.startswith('+') and not x.startswith('+++')}
          allowed_removed = {
              '# USE PRODUCTION VERSION: v295 — Embedding Runtime Thread Experiment: 6 Threads + Canonical Identity Correction + The Guide',
              'APP_VERSION = "v295"',
              'DEPLOYMENT_FINGERPRINT = "USE-v295-embedding-runtime-threads-6"',
              'CANONICAL_BUILD_ID = "USE-BUILD-v295-embedding-runtime-threads-6"',
              'CANONICAL_BUILD_PAYLOAD_SHA256 = "339634aec31e2231fc497d0ea1a8f1d4233e1ce7f9cf0a7e445038c88adc883e"',
              'embedding_model = TextEmbedding(model_name="BAAI/bge-small-en-v1.5", threads=6)',
          }
          allowed_added = {
              '# USE PRODUCTION VERSION: v296 — Embedding Runtime Default Threads + The Guide',
              'APP_VERSION = "v296"',
              'DEPLOYMENT_FINGERPRINT = "USE-v296-embedding-runtime-default-threads"',
              'CANONICAL_BUILD_ID = "USE-BUILD-v296-embedding-runtime-default-threads"',
              f'CANONICAL_BUILD_PAYLOAD_SHA256 = "{expected_payload_sha}"',
              'embedding_model = TextEmbedding(model_name="BAAI/bge-small-en-v1.5")',
          }
          if removed != allowed_removed or added != allowed_added:
              raise SystemExit(f"Unexpected source delta. removed={removed!r} added={added!r}")

          print("v296 pre-commit source audit: PASS")
          print("baseline_raw_sha256:", baseline_sha)
          print("candidate_raw_sha256:", candidate_sha)
          print("canonical_payload_sha256:", payload_sha)
          print("python_compile: PASS")
          print("ast_parse: PASS")
          print("source_delta_whitelist: PASS")
          PY

      - name: Commit v296 and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-v296.yml
          git add main.py
          git commit -m "USE v296 promotion bootstrap"
          git push origin main
