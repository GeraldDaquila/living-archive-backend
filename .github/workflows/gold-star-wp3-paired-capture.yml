name: Gold Star WP3 paired capture (Standalone QA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact deployed QA candidate
        uses: actions/checkout@v4
        with:
          ref: de2cb3d858f300053578f3065dc581d43decb007
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install candidate runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify deployed SHA and capture seven held-out visitor cases
        env:
          PYTHONPATH: .
          WP3_CAPTURE_BASE_URL: https://living-archive-gold-star-v2-qa.onrender.com
        run: |
          python scripts/capture_gold_star_wp3_pairs.py \
            --base-url "$WP3_CAPTURE_BASE_URL" \
            --output artifacts/gold-star-wp3-paired-capture.json
      - name: Upload attributable capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-star-wp3-paired-capture
          path: artifacts/gold-star-wp3-paired-capture.json
          if-no-files-found: warn
          retention-days: 90
