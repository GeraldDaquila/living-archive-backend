name: Candidate Test Behavioral Gate

on:
  push:
    branches:
      - fix/authoritative-intentional-no-doorway-reconciled
    paths:
      - "general_guide_gold_standards.py"
      - "scripts/validate_gold_star_registry.py"
      - "tests/test_general_guide_intentional_no_doorway.py"
      - ".github/workflows/candidate-test-behavioral-gate.yml"

permissions:
  contents: read

jobs:
  intentional-no-doorway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed TEST exact Gold Star behavior
        env:
          TEST_BASE_URL: https://living-archive-test-no-doorway-pr1525.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          query = "What is spiritual bypassing, and why does it matter?"
          registry = json.loads(Path("docs/qa/gold_standard_registry.json").read_text(encoding="utf-8"))
          record = next((r for r in registry["records"] if r.get("query") == query and r.get("status") == "USER_APPROVED_GOLD_STANDARD"), None)
          if not record or record.get("doorway_status") != "INTENTIONALLY_NONE_APPROVED":
              raise SystemExit("Canonical intentional no-doorway fixture not found")
          expected = str(record.get("expected_response") or "").strip()
          # Candidate service must be deployed from this exact branch before behavior is trusted.
          request = urllib.request.Request(
              os.environ["TEST_BASE_URL"].rstrip("/") + "/api/query",
              data=json.dumps({"query": query}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode())
          if response.status != 200:
              raise SystemExit(f"HTTP {response.status}")
          if str(payload.get("response") or "").strip() != expected:
              raise SystemExit("Deployed TEST response differs from canonical Gold Standard")
          if payload.get("recommendation") is not None:
              raise SystemExit(f"Unexpected doorway recommendation: {payload.get('recommendation')!r}")
          if payload.get("processing") != "final_visitor_boundary_exact_gold_standard":
              raise SystemExit(f"Unexpected processing boundary: {payload.get('processing')!r}")
          print("PASS: approved intentional no-doorway contract holds in deployed TEST.")
          PY
