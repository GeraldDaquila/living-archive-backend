name: EI-HRN Recovery Snapshot Validation

on:
  pull_request:
    paths:
      - 'scripts/ei-hrn-release-snapshot.php'
      - 'tests/php/test_ei_hrn_release_snapshot.php'
      - '.github/workflows/ei-hrn-recovery-snapshot.yml'
  push:
    branches:
      - qa/ei-hrn-snapshot-tool-20261109
    paths:
      - 'scripts/ei-hrn-release-snapshot.php'
      - 'tests/php/test_ei_hrn_release_snapshot.php'
      - '.github/workflows/ei-hrn-recovery-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with ZIP support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      - name: PHP syntax check
        run: php -l scripts/ei-hrn-release-snapshot.php
      - name: Run isolated snapshot and restore rehearsal
        run: php tests/php/test_ei_hrn_release_snapshot.php

  wordpress-filesystem-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with ZIP support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      - name: Install WP-CLI
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
      - name: Prepare disposable WordPress filesystem
        run: |
          mkdir -p /tmp/snapshot-wp
          wp core download --path=/tmp/snapshot-wp --allow-root
          wp core version --path=/tmp/snapshot-wp --allow-root
          mkdir -p /tmp/snapshot-wp/wp-content/plugins
          cp -a plugins/human-relational-navigator /tmp/snapshot-wp/wp-content/plugins/
          cp -a plugins/living-archive-emergency-intelligence /tmp/snapshot-wp/wp-content/plugins/
          mkdir -p /tmp/private-recovery
          chmod 0700 /tmp/private-recovery
      - name: Capture and independently verify real plugin trees
        shell: bash
        run: |
          set -euo pipefail
          result="$(php scripts/ei-hrn-release-snapshot.php --wp-root=/tmp/snapshot-wp --output-dir=/tmp/private-recovery)"
          echo "$result"
          archive="$(printf '%s' "$result" | php -r '$v=json_decode(stream_get_contents(STDIN),true); if (($v["status"] ?? "") !== "verified") exit(1); echo $v["archive"];')"
          sha256sum -c "$archive.sha256"
          mkdir -p /tmp/restored-wp/wp-content/plugins
          unzip -q "$archive" -d /tmp/restored-wp/wp-content/plugins
          php -r '
            $archive=$argv[1]; $root=$argv[2];
            $raw=shell_exec("unzip -p ".escapeshellarg($archive)." manifest.json");
            $m=json_decode($raw,true);
            if (!is_array($m) || empty($m["files"])) { fwrite(STDERR,"Manifest missing\\n"); exit(1); }
            foreach ($m["files"] as $f) {
              $p=$root."/".$f["path"];
              if (!is_file($p) || filesize($p)!==$f["size"] || !hash_equals($f["sha256"],hash_file("sha256",$p))) {
                fwrite(STDERR,"Restore mismatch: ".$f["path"]."\\n"); exit(1);
              }
            }
            echo "PASS: actual plugin trees restored byte-for-byte into a separate WordPress filesystem. Entries: ".count($m["files"])."\\n";
          ' "$archive" /tmp/restored-wp/wp-content/plugins
