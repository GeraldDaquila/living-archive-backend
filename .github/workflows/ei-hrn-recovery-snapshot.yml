name: EI-HRN Recovery Snapshot Validation

on:
  pull_request:
    paths:
      - 'scripts/ei-hrn-release-snapshot.php'
      - 'tests/php/test_ei_hrn_release_snapshot.php'
      - '.github/workflows/ei-hrn-recovery-snapshot.yml'
  push:
    branches:
      - qa/ei-hrn-snapshot-tool-20261109
    paths:
      - 'scripts/ei-hrn-release-snapshot.php'
      - 'tests/php/test_ei_hrn_release_snapshot.php'
      - '.github/workflows/ei-hrn-recovery-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with ZIP support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      - name: PHP syntax check
        run: php -l scripts/ei-hrn-release-snapshot.php
      - name: Run isolated snapshot and restore rehearsal
        run: php tests/php/test_ei_hrn_release_snapshot.php
