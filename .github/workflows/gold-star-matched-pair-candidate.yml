name: Gold Star candidate-local matched-pair evaluation
# Candidate rerun after source-level recovery and integrity corrections.

on:
  pull_request:
    types: [opened, synchronize, reopened]
# Replaces the former push-only [run-matched-pairs] opt-in with a visible PR-head run.
# The capture script reads docs/qa/gold_star_matched_pair_cases.json as its pinned case source.

permissions:
  contents: read

jobs:
  matched-pair-local:
    # Explicit opt-in: this tagged commit runs paid provider-backed evaluation.
    # QA execution is isolated to GitHub Actions; no Render task or deployment is created.
    # Re-triggered after provider-secret updates so the new credentials are exercised.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/gold-star-matched-pair-runner-20261123' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      USE_PROVIDER_BANK_MAX_ATTEMPTS: "2"
      USE_GUIDE_EVALUATION_PROVIDER_ORDER: "groq,gemini,openrouter"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install candidate runtime and ASGI test transport
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpx
      - name: Run same-provider, same-model control/treatment captures
        run: >-
          python scripts/capture_gold_star_matched_pairs.py
          --inter-call-delay-seconds 65
          --output-dir artifacts/gold-star-matched-pairs
      - name: Upload blind review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-star-blind-review-${{ github.run_id }}
          path: artifacts/gold-star-matched-pairs/blind-review-package.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload evidence and separate unblinding key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-star-unblinding-evidence-${{ github.run_id }}
          path: |
            artifacts/gold-star-matched-pairs/matched-pair-evidence.json
            artifacts/gold-star-matched-pairs/unblinding-key.json
            artifacts/gold-star-matched-pairs/paired-evaluation-template.json
          if-no-files-found: warn
          retention-days: 90
