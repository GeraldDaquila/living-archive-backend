name: v336 validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - exp/v336-visitor-answer-construction

jobs:
  v336-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production modules
        run: python -m compileall -q main.py use_core.py tests
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run current v387 regression probes
        run: python -m pytest -q tests/test_v387_secondary_pathway_relevance.py
      - name: Reject stale v335 contract gate
        run: python - <<'PY'
import pathlib
source = pathlib.Path('main.py').read_text(encoding='utf-8')
assert 'APP_VERSION = "v387"' in source
assert 'USE-v387-secondary-pathway-relevance' in source
assert 'def _transition_profile(user_query: str) -> dict:' in source
assert 'def _build_sensitive_recommendation_answer(user_query: str, primary: dict, docs: list) -> str:' in source
print('USE v387 replacement for stale v336 gate: PASS')
PY
