name: Provider Bank gateway secret rotation regression

on:
  pull_request:
    paths:
      - "provider_gateway_service.py"
      - "tests/test_provider_gateway_secret_rotation.py"
      - ".github/workflows/provider-gateway-secret-rotation.yml"
  push:
    branches: [main]
    paths:
      - "provider_gateway_service.py"
      - "tests/test_provider_gateway_secret_rotation.py"
      - ".github/workflows/provider-gateway-secret-rotation.yml"

permissions:
  contents: read

jobs:
  provider-gateway-secret-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile provider gateway
        run: python -m py_compile provider_gateway_service.py
      - name: Test current / previous secret overlap and rejection
        run: PYTHONPATH=. python -m pytest -q tests/test_provider_gateway_secret_rotation.py
