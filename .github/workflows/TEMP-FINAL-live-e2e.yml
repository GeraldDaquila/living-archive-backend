name: TEMP FINAL live E2E integrity probe

on:
  push:
    branches:
      - main

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for v487.90 live runtime
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url="https://living-archive-backend.onrender.com/"
          deadline=time.time()+240
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen(url,timeout=15) as r:
                      data=json.loads(r.read().decode("utf-8","replace"))
                      print(data)
                      if data.get("version")=="v487.90":
                          print("LIVE_V487_90_PASS")
                          break
              except Exception as exc:
                  print("waiting:",exc)
              time.sleep(5)
          else:
              raise SystemExit("LIVE_V487_90_TIMEOUT")
          PY

      - name: Live USE to HRN
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          url="https://living-archive-backend.onrender.com/api/query"
          payload={"query":"I promised my father I'd take care of something for him. It felt natural at first, but now the responsibility is becoming much bigger than I expected, and part of me wants to step back. I gave him my word.","history":[]}
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","Accept":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=90) as r:
                  raw=r.read().decode("utf-8","replace")
                  print("USE HTTP",r.status)
                  print(raw[:9000])
          except urllib.error.HTTPError as e:
              raw=e.read().decode("utf-8","replace")
              print("USE HTTP",e.code)
              print(raw[:9000])
              raise
          data=json.loads(raw)
          assert data.get("ok") is True, data
          assert data.get("intent")=="RELATIONAL_HANDOFF", data
          assert str(data.get("response") or "").strip(), data
          assert (data.get("relational_delegation") or {}).get("specialist_id")=="relationship", data
          print("LIVE_USE_HRN_PASS")
          PY

      - name: Live Formation entrance
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          url="https://living-archive-backend.onrender.com/api/formation-entrance"
          payload={"choice":"I want to become steadier in carrying responsibility.","situation":"I am taking on a larger responsibility and need to understand how to carry it well.","possibility":"I want to become more steady without making everything depend on me."}
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","Accept":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read().decode("utf-8","replace")
                  print("FORMATION HTTP",r.status)
                  print(raw[:9000])
          except urllib.error.HTTPError as e:
              raw=e.read().decode("utf-8","replace")
              print("FORMATION HTTP",e.code)
              print(raw[:9000])
              raise
          data=json.loads(raw)
          assert data.get("ok") is True, data
          assert str(data.get("response") or "").strip(), data
          interpretation=(data.get("formation_contribution") or {}).get("interpretation") or {}
          assert str(interpretation.get("pathway") or "").strip(), data
          doors=(data.get("formation_contribution") or {}).get("canonical_candidates") or []
          assert 1 <= len(doors) <= 3, data
          print("LIVE_FORMATION_PASS")
          PY
