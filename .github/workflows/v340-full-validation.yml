name: USE full validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile production modules
        run: python -m py_compile main.py use_core.py run_v374_validation.py
      - name: v375 structural and provenance validation
        run: python run_v374_validation.py
      - name: v375 visitor-experience regression contract
        run: python -m pytest -q tests/test_v374_visitor_experience_architecture.py
      - name: Protected core identity
        run: python - <<'PY'
from pathlib import Path
import hashlib
core = Path('use_core.py').read_bytes()
expected = 'fb3208a8d287f16562ffd640d89f65d5e8d18607'
actual = hashlib.sha1(f'blob {len(core)}\0'.encode() + core).hexdigest()
assert actual == expected, (expected, actual)
print('protected_core_git_blob_sha=PASS')
PY
      - name: Runtime markers
        run: python - <<'PY'
from pathlib import Path
source = Path('main.py').read_text(encoding='utf-8')
for marker in (
    'APP_VERSION = "v375"',
    'DEPLOYMENT_FINGERPRINT = "USE-v375-visitor-experience-authority-calibration"',
    'CANONICAL_BUILD_ID = "USE-BUILD-v375-visitor-experience-authority-calibration"',
    'def _visitor_experience_contract',
    'def _frame_neutral_generation_documents',
    'use_core.generate_llm_response = _v375_finalize',
):
    assert marker in source, marker
print('v375 runtime markers: PASS')
PY