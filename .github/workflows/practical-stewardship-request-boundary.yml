name: Practical stewardship request-boundary recovery

on:
  pull_request:
    paths:
      - "main.py"
      - "QA/V489_10_GUIDE_REQUEST_BOUNDARY_E2E.py"
      - ".github/workflows/practical-stewardship-request-boundary.yml"
  workflow_dispatch:

jobs:
  practical-stewardship-request-boundary:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production entry point
        run: python -m py_compile main.py
      - name: Run request-boundary regressions
        run: python -m pytest -q QA/V489_10_GUIDE_REQUEST_BOUNDARY_E2E.py QA/V489_13_GUIDE_PRACTICAL_STEWARDSHIP_RECOVERY.py
