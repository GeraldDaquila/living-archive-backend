name: HRN reciprocity routing regression

on:
  pull_request:
    paths:
      - "main.py"
      - "tests/test_hrn_reciprocity_routing.py"
      - ".github/workflows/hrn-reciprocity-routing.yml"
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "tests/test_hrn_reciprocity_routing.py"
      - ".github/workflows/hrn-reciprocity-routing.yml"

jobs:
  hrn-reciprocity-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile routing runtime
        run: python -m py_compile main.py
      - name: Verify HRN handoff and bounded lookup exclusion
        run: PYTHONPATH=. python -m pytest -q tests/test_hrn_reciprocity_routing.py
