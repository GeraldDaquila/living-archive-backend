name: USE v339 legacy compatibility validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile production modules
        run: python -m py_compile main.py use_core.py run_v338_validation.py
      - name: v339 authority validation
        run: python run_v338_validation.py
      - name: v336 preserved regression probes
        run: python -m pytest -q tests/test_v336_runtime_presentation.py tests/test_v336_visitor_answer_contract.py
