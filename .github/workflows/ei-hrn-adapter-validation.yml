name: EI-HRN Adapter Validation

on:
  push:
    branches:
      - dev/ei-security-and-hrn-adapter-20261109
    paths:
      - 'plugins/human-relational-navigator/**'
      - 'plugins/living-archive-emergency-intelligence/**'
      - '.github/workflows/ei-hrn-adapter-validation.yml'
  pull_request:
    paths:
      - 'plugins/human-relational-navigator/**'
      - 'plugins/living-archive-emergency-intelligence/**'
      - '.github/workflows/ei-hrn-adapter-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP syntax validation
        shell: bash
        run: |
          find plugins/human-relational-navigator plugins/living-archive-emergency-intelligence -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Frontend JavaScript syntax validation
        run: node --check plugins/human-relational-navigator/assets/relational-navigator.js

      - name: Location-only boundary assertions
        run: php scripts/validate-ei-hrn-boundary.php
