name: EI-HRN Adapter Validation

on:
  push:
    branches:
      - dev/ei-security-and-hrn-adapter-20261109
    paths:
      - 'plugins/human-relational-navigator/**'
      - 'plugins/living-archive-emergency-intelligence/**'
      - 'tests/test_ei_hrn_location_only_contract.py'
      - 'tests/php/**'
      - 'tests/e2e/**'
      - 'scripts/validate-ei-hrn-boundary.php'
      - '.github/workflows/ei-hrn-adapter-validation.yml'
  pull_request:
    paths:
      - 'plugins/human-relational-navigator/**'
      - 'plugins/living-archive-emergency-intelligence/**'
      - '.github/workflows/ei-hrn-adapter-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: PHP syntax validation
        shell: bash
        run: |
          find plugins/human-relational-navigator plugins/living-archive-emergency-intelligence -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: EI registry provenance and expiry tests
        run: php tests/php/test_ei_registry_provenance_and_expiry.php

      - name: Frontend JavaScript syntax validation
        run: node --check plugins/human-relational-navigator/assets/relational-navigator.js

      - name: Location-only boundary assertions
        run: php scripts/validate-ei-hrn-boundary.php

      - name: Isolated HRN resource-handler execution tests
        run: php tests/php/test_hrn_resource_location_handler.php

      - name: EI-HRN location-only regression tests
        run: pytest -q tests/test_ei_hrn_location_only_contract.py

  wordpress-rest-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP with WordPress requirements
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, curl, json, xml, zip
          coverage: none

      - name: Install WP-CLI
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

      - name: Install disposable WordPress
        env:
          WORDPRESS_DB_HOST: 127.0.0.1:3306
          WORDPRESS_DB_NAME: wordpress
          WORDPRESS_DB_USER: wordpress
          WORDPRESS_DB_PASSWORD: wordpress
        run: |
          mkdir -p /tmp/wp
          cd /tmp/wp
          wp core download --allow-root
          wp config create --dbname="$WORDPRESS_DB_NAME" --dbuser="$WORDPRESS_DB_USER" --dbpass="$WORDPRESS_DB_PASSWORD" --dbhost="$WORDPRESS_DB_HOST" --dbprefix=wp_ --allow-root
          wp core install --url=http://127.0.0.1 --title="EI-HRN CI Test" --admin_user=ci-admin --admin_password="ci-only-password" --admin_email=ci@example.invalid --skip-email --allow-root

      - name: Install exact plugin source and isolated test fixture
        run: |
          mkdir -p /tmp/wp/wp-content/plugins
          cp -a plugins/human-relational-navigator /tmp/wp/wp-content/plugins/
          cp -a plugins/living-archive-emergency-intelligence /tmp/wp/wp-content/plugins/
          mkdir -p /tmp/wp/wp-content/plugins/human-relational-navigator/includes
          printf '%s\n' '<?php // Test-only empty dependency stub; canonical retrieval is outside this test scope.' > /tmp/wp/wp-content/plugins/human-relational-navigator/includes/class-hrn-canonical-retriever.php
          cd /tmp/wp
          wp plugin activate living-archive-emergency-intelligence human-relational-navigator --allow-root

      - name: Exercise real WordPress REST bootstrap and dispatch
        run: |
          cp tests/php/test_ei_hrn_wordpress_integration.php /tmp/wp/wp-content/
          cd /tmp/wp
          wp eval-file wp-content/test_ei_hrn_wordpress_integration.php --allow-root


  browser-safety-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise browser safety-location success and failure paths
        run: node tests/e2e/ei-hrn-browser-safety.js
