name: CLSS stewardship contract tests

on:
  push:
    paths:
      - "tests/fixtures/clss/stewardship-coherence-cases.json"
      - "tests/test_clss_stewardship_fixtures.py"
      - "tests/clss_response_validator.py"
      - "tests/test_clss_response_validator.py"
      - "tests/clss_evidence_triage.py"
      - "tests/test_clss_evidence_triage.py"
      - "tests/clss_deterministic_response.py"
      - "tests/test_clss_deterministic_response.py"
      - "tests/clss_reasoning_acceptance.py"
      - "tests/test_clss_reasoning_acceptance.py"
      - "clss_reasoning_boundary.py"
      - "clss_evidence_normalization.py"
      - "tests/test_clss_evidence_normalization.py"
      - "tests/test_clss_reasoning_boundary.py"
      - "tests/test_clss_fixture_validator_bridge.py"
      - ".github/workflows/clss-stewardship-contract.yml"
  pull_request:
    paths:
      - "tests/fixtures/clss/stewardship-coherence-cases.json"
      - "tests/test_clss_stewardship_fixtures.py"
      - "tests/clss_response_validator.py"
      - "tests/test_clss_response_validator.py"
      - "tests/clss_evidence_triage.py"
      - "tests/test_clss_evidence_triage.py"
      - "tests/clss_deterministic_response.py"
      - "tests/test_clss_deterministic_response.py"
      - "tests/clss_reasoning_acceptance.py"
      - "tests/test_clss_reasoning_acceptance.py"
      - "tests/test_clss_fixture_validator_bridge.py"
      - ".github/workflows/clss-stewardship-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-integrity:
    name: Validate CLSS contract, triage, fallback, and reasoning acceptance gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run CLSS contract, triage, fallback, and reasoning acceptance tests
        run: python -m unittest -v tests.test_clss_stewardship_fixtures tests.test_clss_response_validator tests.test_clss_fixture_validator_bridge tests.test_clss_evidence_triage tests.test_clss_deterministic_response tests.test_clss_reasoning_acceptance tests.test_clss_reasoning_boundary tests.test_clss_evidence_normalization
