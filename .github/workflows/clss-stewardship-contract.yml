name: CLSS stewardship contract tests

on:
  push:
    paths:
      - "tests/fixtures/clss/stewardship-coherence-cases.json"
      - "tests/test_clss_stewardship_fixtures.py"
      - "tests/clss_response_validator.py"
      - "tests/test_clss_response_validator.py"
      - ".github/workflows/clss-stewardship-contract.yml"
  pull_request:
    paths:
      - "tests/fixtures/clss/stewardship-coherence-cases.json"
      - "tests/test_clss_stewardship_fixtures.py"
      - "tests/clss_response_validator.py"
      - "tests/test_clss_response_validator.py"
      - ".github/workflows/clss-stewardship-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-integrity:
    name: Validate CLSS fixture integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run fixture integrity tests
        run: python -m unittest -v tests.test_clss_stewardship_fixtures tests.test_clss_response_validator
