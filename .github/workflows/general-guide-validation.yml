name: General Guide Composition Validation

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "provider_bank.py"
      - "general_guide_composition.py"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - "tests/test_general_guide_perception_contract.py"
      - "tests/test_guide_source_template_leak_boundary.py"
      - "QA/V489_82_HRN_RELATIONAL_RETURN_QA.py"
      - ".github/workflows/general-guide-validation.yml"
  pull_request:
    paths:
      - "main.py"
      - "provider_bank.py"
      - "general_guide_composition.py"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - ".github/workflows/general-guide-validation.yml"

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run source-template visitor-boundary regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_guide_source_template_leak_boundary.py
      - name: Run provider-neutral General Guide QA
        run: python QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py
      - name: Run universal perception regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_general_guide_perception_contract.py
      - name: Run bounded HRN relational-return QA
        run: python QA/V489_82_HRN_RELATIONAL_RETURN_QA.py
