name: General Guide Composition Validation

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "ai_workforce_restructuring_contract.py"
      - "tests/test_structural_doorway_presence.py"
      - "provider_bank.py"
      - "general_guide_composition.py"
      - "general_guide_gold_standards.py"
      - "deterministic_answer_recovery.py"
      - "tests/test_archive_constitutional_recovery.py"
      - "tests/test_archive_claim_doorway_authority.py"
      - "tests/test_guide_reflective_balance_doorway.py"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - "tests/test_general_guide_perception_contract.py"
      - "tests/test_guide_source_template_leak_boundary.py"
      - "tests/test_gold_standard_registry.py"
      - "tests/test_gold_star_remedy_selection_runtime_boundary.py"
      - "tests/test_guide_systemwide_three_paragraph_default.py"
      - "tests/test_guide_healthy_community_answer_contract.py"
      - "tests/test_resonance_confirmation_bias_recovery.py"
      - "tests/test_general_guide_gold_standard_doorway_policy.py"
      - "tests/test_retrieval_failure_gold_star.py"
      - "docs/qa/gold_standard_registry.json"
      - "docs/qa/gold_star_qualitative_transfer_review.json"
      - "scripts/validate_gold_star_registry.py"
      - "QA/V489_82_HRN_RELATIONAL_RETURN_QA.py"
      - ".github/workflows/general-guide-validation.yml"
  pull_request:
    paths:
      - "main.py"
      - "ai_workforce_restructuring_contract.py"
      - "tests/test_structural_doorway_presence.py"
      - "provider_bank.py"
      - "general_guide_composition.py"
      - "general_guide_gold_standards.py"
      - "deterministic_answer_recovery.py"
      - "tests/test_archive_constitutional_recovery.py"
      - "tests/test_guide_reflective_balance_doorway.py"
      - "QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py"
      - "tests/test_gold_standard_registry.py"
      - "tests/test_gold_star_remedy_selection_runtime_boundary.py"
      - "tests/test_guide_systemwide_three_paragraph_default.py"
      - "tests/test_guide_healthy_community_answer_contract.py"
      - "tests/test_resonance_confirmation_bias_recovery.py"
      - "tests/test_general_guide_gold_standard_doorway_policy.py"
      - "tests/test_retrieval_failure_gold_star.py"
      - "docs/qa/gold_standard_registry.json"
      - "docs/qa/gold_star_qualitative_transfer_review.json"
      - "scripts/validate_gold_star_registry.py"
      - ".github/workflows/general-guide-validation.yml"

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch canonical main ref for registry immutability validation
        run: git fetch origin main:refs/remotes/origin/main
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate canonical Gold Star registry integrity
        run: python scripts/validate_gold_star_registry.py
      - name: Run canonical Gold Star registry regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_gold_standard_registry.py
      - name: Run remedy-selection and terminal doorway regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_gold_star_remedy_selection.py tests/test_gold_star_remedy_selection_runtime_boundary.py
      - name: Run source-template visitor-boundary regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_guide_source_template_leak_boundary.py
      - name: Run Archive constitutional recovery regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_archive_constitutional_recovery.py
      - name: Run Archive claim doorway authority regression
        run: PYTHONPATH=. python -m pytest -q tests/test_archive_claim_doorway_authority.py
      - name: Run reflective balance canonical doorway regression
        run: PYTHONPATH=. python -m pytest -q tests/test_guide_reflective_balance_doorway.py
      - name: Run structural doorway and workforce Gold Star regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_structural_doorway_presence.py
      - name: Run provider-neutral General Guide QA
        run: python QA/V488_95_GENERAL_GUIDE_COMPOSITION_QA.py
      - name: Run universal perception regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_general_guide_perception_contract.py
      - name: Run bounded HRN relational-return QA
        run: python QA/V489_82_HRN_RELATIONAL_RETURN_QA.py
      - name: Run healthy-community answer and doorway regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_guide_healthy_community_answer_contract.py
      - name: Run resonance and confirmation-bias discernment regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_resonance_confirmation_bias_recovery.py
      - name: Run exact Gold Star doorway authority regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_general_guide_gold_standard_doorway_policy.py
