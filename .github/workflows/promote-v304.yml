name: Promote USE v304 recognition breakdown diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote-v304:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact v304 source patch
        env:
          PATCH_B64: ...