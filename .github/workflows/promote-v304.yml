name: Promote USE v304 recognition breakdown diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote-v304:
    if: ${{ !contains(github.event.head_commit.message, 'Promote USE v304') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact v304 source patch
        env:
          PATCH_B64: 
          EXPECTED_RAW_SHA: d829bc5e8f3114fa23b55ccf692d12c7030fc17208ef4111840be5cff93fca09
          EXPECTED_PAYLOAD_SHA: b85ed552fc8fa592151b6c29e7d14ca15d4b88f3be4f1394b68d000db9505052
        run: |
          python - <<'PY'
          import base64, hashlib, re, subprocess, os
          from pathlib import Path

          p = Path('main.py')
          source = p.read_text(encoding='utf-8')
          if 'APP_VERSION = "v304"' in source:
              print('v304 already present; nothing to promote.')
              raise SystemExit(0)

          patch = base64.b64decode(os.environ['PATCH_B64'])
          Path('/tmp/v304.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '/tmp/v304.patch'], check=True)

          raw = p.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          p.write_bytes(raw.replace(b'\n', b'\r\n'))

          final = p.read_bytes()
          raw_sha = hashlib.sha256(final).hexdigest()
          text = final.decode('utf-8')
          canonical = text.replace('\r\n', '\n').replace('\r', '\n')
          canonical = re.sub(
              r'(?ms)^# === CANONICAL BUILD IDENTITY \\(excluded from payload hash\\) ===\\n.*?^# === END CANONICAL BUILD IDENTITY ===\\n?',
              '# === CANONICAL BUILD IDENTITY (excluded from payload hash) ===\n# <CANONICAL_BUILD_IDENTITY_BLOCK>\n# === END CANONICAL BUILD IDENTITY ===\n',
              canonical,
              count=1,
          )
          payload_sha = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          if raw_sha != os.environ['EXPECTED_RAW_SHA']:
              raise SystemExit(f'raw SHA mismatch: {raw_sha}')
          if payload_sha != os.environ['EXPECTED_PAYLOAD_SHA']:
              raise SystemExit(f'payload SHA mismatch: {payload_sha}')
          compile(text, 'main.py', 'exec')
          print(f'v304 source verified: raw={raw_sha} payload={payload_sha} bytes={len(final)}')
          PY

      - name: Commit exact v304 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add main.py
          git commit -m "Promote USE v304 recognition breakdown diagnostic [skip ci]"
          git push origin main
